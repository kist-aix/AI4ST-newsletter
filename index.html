<!-- 자립형 배포본 · 2026-09-11 08:03 생성 · 더블클릭하면 열립니다 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* ══════════════════════════════════════════════════════════════
   디자인 토큰 — 세 상태를 모두 정의한다.
   :root 에 완전한 라이트 팔레트, 미디어 쿼리와 [data-theme]에서 재정의.
   미디어 쿼리 안에서만 정의되는 색이 하나라도 있으면,
   시스템 기본(스탬프 없음) 상태에서 그 색이 사라져 글자가 배경에 묻힌다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#EDF0EE; --surface:#FBFCFB; --surface2:#F1F4F2; --panel:#16211D;
  --ink:#131C19; --ink2:#2C3A35; --muted:#5A6A63; --line:#D2DAD5; --line2:#E3E9E5;
  --accent:#0D6A56; --accent-soft:#DCEBE5; --gov:#2A4B7C; --gov-soft:#DFE7F2;
  --warn:#95441A; --warn-soft:#F2E3D8; --panel-ink:#DCE7E2; --panel-dim:#7E948C;
  --ok:#0D6A56; --ok-soft:#DCEBE5; --crit:#8E2F2F; --crit-soft:#F4DFDF;
  --pw-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1211; --surface:#141C19; --surface2:#1A2421; --panel:#0A100E;
    --ink:#E4EBE7; --ink2:#C3D0CA; --muted:#8FA098; --line:#26332F; --line2:#1E2A26;
    --accent:#4CC5A2; --accent-soft:#12302A; --gov:#84AADE; --gov-soft:#16233A;
    --warn:#DE9364; --warn-soft:#2E2019; --panel-ink:#D5E2DC; --panel-dim:#71877F;
    --ok:#4CC5A2; --ok-soft:#12302A; --crit:#E08585; --crit-soft:#331B1B;
    --pw-ink:#0D1211;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1211; --surface:#141C19; --surface2:#1A2421; --panel:#0A100E;
  --ink:#E4EBE7; --ink2:#C3D0CA; --muted:#8FA098; --line:#26332F; --line2:#1E2A26;
  --accent:#4CC5A2; --accent-soft:#12302A; --gov:#84AADE; --gov-soft:#16233A;
  --warn:#DE9364; --warn-soft:#2E2019; --panel-ink:#D5E2DC; --panel-dim:#71877F;
  --ok:#4CC5A2; --ok-soft:#12302A; --crit:#E08585; --crit-soft:#331B1B;
  --pw-ink:#0D1211;
}

*{box-sizing:border-box}
html{color-scheme:light dark}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  font-size:14.5px; line-height:1.72; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Gowun Batang','Noto Serif KR',Georgia,serif; margin:0; text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
img{max-width:100%}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px 90px}

/* ── 머리 ── */
.top{padding:30px 0 0; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start}
.top .grow{flex:1 1 300px}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); font-weight:600}
h1{font-size:clamp(24px,4.4vw,36px); font-weight:700; margin-top:10px; line-height:1.2}
.subline{color:var(--muted); font-size:13px; margin-top:9px;
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}

/* 내부면 표식. 화면 캡처가 밖으로 나갔을 때 구분되어야 하므로 숨기거나 접지 않는다. */
.internal-badge{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  letter-spacing:.1em; padding:3px 9px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn);
}
.themetog{
  appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 10px; border-radius:2px;
  cursor:pointer;
}
.themetog:hover{color:var(--ink); border-color:var(--ink)}
.themetog:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── 내비 ── */
nav.tabs{display:flex; gap:0; margin-top:24px; border-bottom:2px solid var(--ink); overflow-x:auto}
nav.tabs a, nav.tabs button{
  appearance:none; text-decoration:none; display:block;
  border:1px solid var(--line); border-bottom:none; background:var(--surface2);
  color:var(--muted); font-family:'Noto Sans KR',sans-serif; font-size:13.5px; font-weight:500;
  padding:9px 15px; cursor:pointer; white-space:nowrap; margin-right:-1px; border-radius:2px 2px 0 0;
}
nav.tabs .n{font-family:'IBM Plex Mono',monospace; font-size:11px; margin-right:7px; opacity:.75}
nav.tabs a:hover, nav.tabs button:hover{background:var(--surface); color:var(--ink)}
nav.tabs a[aria-current="page"], nav.tabs button[aria-selected="true"]{
  background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700}
nav.tabs a:focus-visible, nav.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.pane{padding:30px 0 0}
.pane[hidden]{display:none}

h2{font-size:21px; font-weight:700; margin:34px 0 6px}
h2:first-child{margin-top:0}
h3{font-size:15.5px; font-weight:700; margin:24px 0 10px}
.dek{color:var(--muted); font-size:13.5px; margin-bottom:16px; max-width:72ch}

/* ── 표 ── */
.scroll{overflow-x:auto; border:1px solid var(--line); background:var(--surface); margin:16px 0}
table{border-collapse:collapse; width:100%; min-width:540px; font-size:13px}
th,td{padding:9px 11px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line2)}
thead th{background:var(--surface2); font-family:'IBM Plex Mono',monospace; font-weight:600;
  font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--line); white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td.n{font-variant-numeric:tabular-nums; font-family:'IBM Plex Mono',monospace; white-space:nowrap}

/* ── 칩·등급 ── */
.chip{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:2px 6px; border-radius:2px; border:1px solid var(--line); background:var(--surface2);
  color:var(--ink2); margin:1px 2px 1px 0; white-space:nowrap}
.chip.a{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.chip.b{background:var(--gov-soft); border-color:var(--gov); color:var(--gov)}
.chip.c{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.sig{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  font-weight:600; padding:2px 6px; border-radius:2px; white-space:nowrap}
.sig.s1{background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok)}
.sig.s2{background:var(--gov-soft); color:var(--gov); border:1px solid var(--gov)}
.sig.s3{background:var(--surface2); color:var(--muted); border:1px solid var(--line)}
.sig.s4{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn)}

/* ── 도구막대·버튼 ── */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0;
  padding:12px 14px; background:var(--surface); border:1px solid var(--line)}
.toolbar .count{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.toolbar .count b{color:var(--accent); font-size:15px}
button.act, a.act{
  appearance:none; text-decoration:none; display:inline-block;
  border:1px solid var(--ink); background:var(--ink); color:var(--bg);
  font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:600; padding:7px 14px;
  border-radius:2px; cursor:pointer;
}
button.act.ghost, a.act.ghost{background:transparent; color:var(--ink)}
button.act:hover, a.act:hover{opacity:.86}
button.act:focus-visible, a.act:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
select, input[type=search], input[type=text]{
  font-family:'Noto Sans KR',sans-serif; font-size:13px; padding:6px 9px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:2px;
}
select:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ── 후보풀 ── */
table.pool td{vertical-align:middle}
table.pool tr.on{background:var(--accent-soft)}
table.pool input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer}
.sc{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:12px}
.sc b{font-size:13.5px; color:var(--accent)}
.ttl{font-weight:500; line-height:1.5}
.src{font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace}
/* 검증 경위 — 내부 후보풀 화면에만 나온다(2026-09-04). 무엇을 확보하지 못했는지를
   승인 전에 보이게 하되, 제목보다 뒤로 물러서게 해서 사실과 섞이지 않게 한다. */
.vnote{margin-top:5px; font-size:11.5px; line-height:1.55; color:var(--muted);
  border-left:2px solid var(--line); padding:3px 0 3px 8px}
.vnote .lbl{display:inline-block; margin-right:6px; font-weight:600; color:var(--warn,#a15c00)}
.pw{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600;
  padding:1px 5px; border-radius:2px; background:var(--gov); color:var(--pw-ink);
  margin-right:5px; vertical-align:1px}

/* ── 발송본 패널 ── */
.out{background:var(--panel); color:var(--panel-ink); padding:20px 18px; margin-top:14px;
  overflow-x:auto; border-radius:2px}
.out pre{margin:0; font-family:'IBM Plex Mono','D2Coding',monospace; font-size:12px;
  line-height:1.9; white-space:pre-wrap; word-break:break-word}

/* ── 노트 ── */
.note{background:var(--surface); border-left:3px solid var(--accent); padding:14px 16px;
  margin:16px 0; font-size:13.5px; color:var(--ink2)}
.note.warn{border-left-color:var(--warn)}
.note .lbl{display:block; font-family:'IBM Plex Mono',monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:600;
  margin-bottom:5px}
.note.warn .lbl{color:var(--warn)}

/* ── REF 카드 ── */
.refs{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; margin-top:14px}
.ref{border:1px solid var(--line); background:var(--surface); padding:13px 14px}
.ref .rid{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); letter-spacing:.06em}
.ref .rt{font-weight:700; font-size:14px; margin:5px 0 6px; line-height:1.45}
.ref .rm{font-size:12.5px; color:var(--muted); margin-bottom:8px}
.ref .rk{font-size:12.5px; color:var(--ink2); margin-top:8px; padding-top:8px;
  border-top:1px dashed var(--line)}
.filters{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0}
.filters button{appearance:none; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
  padding:4px 9px; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  cursor:pointer; border-radius:2px}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── 스레드 ── */
.thread{border:1px solid var(--line); background:var(--surface); padding:15px 16px; margin-bottom:12px}
.thread .tn{font-weight:700; font-size:15px; font-family:'Gowun Batang',serif}
.tl{list-style:none; margin:12px 0 0; padding:0 0 0 16px; border-left:2px solid var(--line)}
.tl li{position:relative; padding:0 0 10px 14px; font-size:13px}
.tl li::before{content:''; position:absolute; left:-21px; top:8px; width:7px; height:7px;
  border-radius:50%; background:var(--accent); border:2px solid var(--surface)}
.tl .d{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-right:8px}
.verdict{margin-top:12px; padding:10px 12px; background:var(--surface2);
  border-left:3px solid var(--gov); font-size:13px}
.verdict b{color:var(--gov)}

/* ── 이슈 ── */
.iss{border:1px solid var(--line); background:var(--surface); margin-bottom:14px}
.ih{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
  gap:10px; align-items:baseline}
.ih .rule{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; background:var(--ink); color:var(--bg); border-radius:2px}
.ih .it{font-weight:700; font-size:15px; font-family:'Gowun Batang',serif; flex:1 1 240px}
.ib{padding:14px 16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px}
.lbl2{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin-bottom:5px}
.toc{font-size:13px; margin:0; padding-left:17px}
.toc li{margin-bottom:3px}
.vfy{font-size:12.5px}
.vf{display:block; margin-bottom:4px}
.ok-i{color:var(--ok); font-weight:600}
.wn-i{color:var(--warn); font-weight:600}
.cr-i{color:var(--crit); font-weight:600}

/* ── D-day ── */
.dd{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; border-radius:2px; background:var(--surface2); border:1px solid var(--line);
  color:var(--muted)}
.dd.near{background:var(--crit-soft); border-color:var(--crit); color:var(--crit)}
.dd.mid{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}

/* ── 파이프라인 ── */
.pipe{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); margin-top:14px}
.col{background:var(--surface); padding:12px 13px; min-height:130px}
.colh{display:flex; align-items:baseline; gap:8px; margin-bottom:10px; padding-bottom:8px;
  border-bottom:1px solid var(--line2)}
.colh .cn{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); font-weight:600}
.colh .cc{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600;
  color:var(--accent); margin-left:auto; font-variant-numeric:tabular-nums}
.card{background:var(--surface2); border:1px solid var(--line); padding:8px 10px;
  margin-bottom:7px; font-size:12.5px; line-height:1.5}
.card .cid{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted)}
.card.done{border-left:3px solid var(--ok)}
.empty{font-size:12.5px; color:var(--muted); padding:6px 0}

/* ── 리포트 ── */
.rep{border:1px solid var(--line); background:var(--surface); margin-bottom:14px}
.reph{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
  gap:10px; align-items:baseline}
.reph .no{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; background:var(--accent); color:var(--surface); border-radius:2px}
.reph .rtt{font-weight:700; font-size:15.5px; font-family:'Gowun Batang',serif; flex:1 1 240px}
.repb{padding:14px 16px}
.sum{background:var(--surface2); border-left:3px solid var(--accent); padding:11px 13px;
  margin-bottom:12px; font-size:13px}
.sum span{display:block; margin-bottom:5px}
.sum span:last-child{margin-bottom:0}
.repmeta{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; font-size:12.5px}
.stg{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
  padding:2px 7px; border-radius:2px; border:1px solid var(--line); background:var(--surface2);
  color:var(--muted)}
.stg.wait{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.stg.go{background:var(--gov-soft); border-color:var(--gov); color:var(--gov)}
.stg.pub{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}

/* ── 아카이브 목록 ── */
.edlist{display:grid; gap:10px; margin-top:14px}
.edrow{display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; padding:12px 14px;
  border:1px solid var(--line); background:var(--surface); text-decoration:none; color:inherit}
.edrow:hover{border-color:var(--accent)}
.edrow .ed{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--accent);
  font-weight:600; white-space:nowrap}
.edrow .eh{flex:1 1 260px; font-size:13.5px}
.item{border-bottom:1px solid var(--line2); padding:11px 0}
.item:last-child{border-bottom:none}
.item .isec{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted);
  letter-spacing:.06em; text-transform:uppercase}
.item .itx{font-size:13.5px; margin-top:3px; line-height:1.7}
.hit{background:var(--accent-soft); border-radius:2px}

ul.tight{margin:10px 0 0; padding-left:19px}
ul.tight li{margin-bottom:6px; font-size:13.5px}
ul.tight li::marker{color:var(--accent)}
footer{margin-top:50px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted);
  font-size:12px; font-family:'IBM Plex Mono',monospace}
code{font-family:'IBM Plex Mono',monospace; font-size:.92em; background:var(--surface2);
  padding:1px 4px; border-radius:2px}
b{font-weight:700}

@media (max-width:520px){
  .wrap{padding:0 14px 70px}
  nav.tabs a, nav.tabs button{padding:8px 11px; font-size:12.5px}
}

/* ── 발표일·원문 표기 ─────────────────────────────────────────
   검색엔진이 몇 달 지난 자료를 오늘 것처럼 올려 준다. 담당자가 승인 전에
   날짜를 눈으로 보게 하려고 항목마다 붙인다. 확인 못 한 날짜는 감추지 않는다. */
.pd{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:1px 5px; border-radius:2px; border:1px solid var(--line);
  background:var(--surface2); color:var(--muted); white-space:nowrap}
.pd.warn{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.src-link{font-size:10.5px; font-family:'IBM Plex Mono',monospace;
  text-decoration:none; border-bottom:1px solid currentColor}
.src-link:hover{border-bottom-width:2px}

/* ── 워치리스트 패널 (관리용 화면 전용) ───────────────────────
   발송본에서 뺀 뒤로 이 패널이 유일한 노출 지점이다. */
ul.watch{list-style:none; margin:0; padding:0}
ul.watch li{padding:8px 0; border-bottom:1px solid var(--line2);
  font-size:13px; line-height:1.65; display:flex; gap:9px; align-items:flex-start}
ul.watch li:last-child{border-bottom:none}
ul.watch .dd{flex:0 0 auto}

/* ── 지면 서식 (뉴스레터 면 · 내부 미리보기가 함께 쓴다) ─────────
   뉴스레터 면에만 두면 관리용 후보풀 화면의 미리보기가 다른 모습으로
   그려진다. 담당자가 화면에서 본 것과 배포되는 지면은 같아야 한다. */
  /* 공유용 전용 — 결과 중심 배치. 해석·판단근거는 싣지 않는다. */
  .fact{border-left:3px solid var(--line); padding:10px 0 10px 14px; margin:0 0 2px}
  .fact + .fact{border-top:1px solid var(--line2)}
  .fact .ft{font-size:14px; font-weight:600; line-height:1.55; color:var(--ink)}
  .fact .fk{font-size:13px; line-height:1.75; color:var(--ink2); margin-top:5px}
  .fact .fm{margin-top:6px; display:flex; flex-wrap:wrap; gap:7px; align-items:center}
  /* 섹션 7개를 색으로 가른다. 번호를 세지 않고도 어느 갈래인지 눈에 들어와야 한다.
     라이트는 어두운 색, 다크는 밝은 색 — 세 테마 상태를 모두 정의한다. */
  :root{
    --s1:#2A4B7C; --s2:#0D6A56; --s3:#5B3E8E; --s4:#16607A;
    --s5:#8A5A1B; --s6:#8E3346; --s7:#4A6B22;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --s1:#8DAFE2; --s2:#4CC5A2; --s3:#B7A0E4; --s4:#74C4DF;
      --s5:#E0AC72; --s6:#E993A7; --s7:#AFD177;
    }
  }
  :root[data-theme="dark"]{
    --s1:#8DAFE2; --s2:#4CC5A2; --s3:#B7A0E4; --s4:#74C4DF;
    --s5:#E0AC72; --s6:#E993A7; --s7:#AFD177;
  }

  .secblk{margin:0 0 26px}
  .secblk h3{display:flex; align-items:baseline; gap:9px; margin:0 0 4px;
    font-size:15px; letter-spacing:-.01em;
    border-bottom:2px solid currentColor; padding-bottom:6px}
  .secblk[data-sec="1"] h3{color:var(--s1)}
  .secblk[data-sec="2"] h3{color:var(--s2)}
  .secblk[data-sec="3"] h3{color:var(--s3)}
  .secblk[data-sec="4"] h3{color:var(--s4)}
  .secblk[data-sec="5"] h3{color:var(--s5)}
  .secblk[data-sec="6"] h3{color:var(--s6)}
  .secblk[data-sec="7"] h3{color:var(--s7)}
  /* 항목 왼쪽 선도 같은 색을 옅게 물려 받아 어느 섹션 소속인지 이어 보이게 한다 */
  .secblk[data-sec="1"] .fact{border-left-color:var(--s1)}
  .secblk[data-sec="2"] .fact{border-left-color:var(--s2)}
  .secblk[data-sec="3"] .fact{border-left-color:var(--s3)}
  .secblk[data-sec="4"] .fact{border-left-color:var(--s4)}
  .secblk[data-sec="5"] .fact{border-left-color:var(--s5)}
  .secblk[data-sec="6"] .fact{border-left-color:var(--s6)}
  .secblk[data-sec="7"] .fact{border-left-color:var(--s7)}
/* ── 당일 미리보기 (내부 후보풀 화면) ─────────────────────────
   체크하는 즉시 배포될 지면이 이 안에 그려진다. 테두리를 둘러 '지면'과
   '작업 화면'을 눈으로 가른다 — 안쪽은 밖으로 나가는 것이다. */
.preview{border:1px solid var(--line); background:var(--surface);
  padding:16px 18px 6px; margin:12px 0 0}
.preview .toolbar{margin-top:0}
pre.cmd{margin:8px 0 0; padding:10px 12px; overflow-x:auto; white-space:pre-wrap;
  word-break:break-all; background:var(--surface2); border:1px solid var(--line);
  font-family:'IBM Plex Mono','D2Coding',monospace; font-size:11.5px;
  line-height:1.7; color:var(--ink2)}

/* ══════════════════════════════════════════════════════════════
   기사 상세면 (2026-09-09 신설)
   목록의 제목을 누르면 이 면이 선다 — 메타표 · AI 상세요약 · 하단 원문 링크.
   별도 파일이 아니라 같은 파일 안에서 갈아 끼우므로, 배포본 한 장으로 보내도
   그대로 눌린다. 인쇄·이미지로 구울 때는 bundle.py 가 목록만 남기고 감춘다.
   ══════════════════════════════════════════════════════════════ */

/* 목록에서 — 제목이 눌린다는 것이 보여야 한다. 밑줄 대신 오른쪽에 표를 단다. */
.fact a.ft{display:block; text-decoration:none; color:var(--ink); font-size:14px;
  font-weight:600; line-height:1.55}
.fact a.ft:hover{color:var(--accent)}
.fact a.ft:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
/* 제목 줄 — 헤드라인과 「상세 보기」를 양 끝으로 벌린다 (2026-09-09 지시).
   좁은 화면에서는 상세 보기가 아래로 떨어지되 오른쪽에 붙어 있게 한다. */
.fact .fh{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline;
  justify-content:space-between}
.fact .fh a.ft{flex:1 1 240px}
.fact .fh a.dgo{flex:0 0 auto; margin-left:auto}

/* 「상세 보기」 — 목록에서 상세면으로 가는 유일한 길이다. 발표일도 출처도
   상세면 메타표가 지므로 목록에는 이것만 둔다. */
a.dgo{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  font-weight:600; letter-spacing:.04em; padding:2px 8px; border-radius:2px;
  border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  text-decoration:none; white-space:nowrap}
a.dgo:hover{background:var(--accent); color:var(--surface)}
a.dgo:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
/* 리포트 카드 제목 옆 표는 그대로 쓴다 */
a.rtt .more{display:inline-block; margin-left:8px; vertical-align:2px;
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; letter-spacing:.08em;
  padding:1px 5px; border-radius:2px; border:1px solid var(--line);
  background:var(--surface2); color:var(--muted); white-space:nowrap}
a.rtt:hover .more{border-color:var(--accent); color:var(--accent);
  background:var(--accent-soft)}

/* ── 상세면 ── */
.detail{max-width:78ch}
.dhead{border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:0}
.dsec{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; font-weight:600; color:var(--muted); margin-bottom:8px}
.detail[data-sec="1"] .dsec{color:var(--s1)}
.detail[data-sec="2"] .dsec{color:var(--s2)}
.detail[data-sec="3"] .dsec{color:var(--s3)}
.detail[data-sec="4"] .dsec{color:var(--s4)}
.detail[data-sec="5"] .dsec{color:var(--s5)}
.detail[data-sec="6"] .dsec{color:var(--s6)}
.detail[data-sec="7"] .dsec{color:var(--s7)}
.dtt{font-size:clamp(19px,3vw,25px); font-weight:700; line-height:1.38; color:var(--ink)}

/* 메타표 — 자료발표일·출처·원문링크. 첨부 서식과 같은 자리에 같은 것이 오게 둔다. */
.dmeta{margin:0; padding:14px 16px; background:var(--surface2);
  border:1px solid var(--line); border-top:none; display:grid; gap:7px 18px; font-size:12.5px}
.dmeta > div{display:grid; grid-template-columns:88px 1fr; gap:12px; align-items:baseline}
.dmeta dt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em;
  color:var(--muted); font-weight:600; padding-top:1px}
.dmeta dd{margin:0; color:var(--ink2); word-break:break-all; line-height:1.6}
.dmeta dd a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line)}
.dmeta dd a:hover{border-bottom-color:currentColor}
/* 출처 조각이 곧 링크다 (2026-09-09). src-link 의 기본값(10.5px 모노)은 목록의
   좁은 줄에 맞춘 것이라 표 안에서는 읽기 어렵다 — 여기서는 본문 크기로 되돌린다. */
.dmeta dd a.src-link{font-family:inherit; font-size:13px; border-bottom-color:var(--accent)}

.dkey{margin-top:16px; padding:12px 14px; background:var(--surface);
  border-left:3px solid var(--accent); font-size:13.5px; line-height:1.75; color:var(--ink)}
.dkey .lbl2{margin-bottom:5px}

/* AI 요약 상자 */
.aibox{margin-top:16px; padding:16px 18px; background:var(--surface);
  border:1px solid var(--line); border-radius:2px}
.aibox .aih{display:flex; align-items:center; gap:8px; margin-bottom:12px;
  padding-bottom:9px; border-bottom:1px solid var(--line2);
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.09em;
  font-weight:600; color:var(--accent); text-transform:uppercase}
.aibox .aim{display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:18px; padding:0 5px; border-radius:2px;
  background:var(--accent); color:var(--surface); font-size:10px; letter-spacing:.04em}
/* 양쪽 맞춤을 쓰되 줄 가운데가 벌어지지 않게 한다 (2026-09-09 지시).
   word-break:keep-all 은 어절을 쪼개지 않아 한글 문단에서 줄 끝에 긴 어절이
   걸리면 그 줄을 통째로 다음 줄로 넘기고, 남은 자리를 낱말 사이 빈칸이 나눠 가져
   구멍처럼 벌어진다. 한글은 음절 단위로 넘겨도 읽기에 지장이 없으므로 기본값을
   쓴다 — 줄이 빈틈없이 차서 늘릴 여백 자체가 거의 남지 않는다.
   영문 낱말(EuroHPC)은 기본값에서도 중간에 쪼개지지 않는다. */
.aibox p{font-size:13.8px; line-height:1.95; color:var(--ink2); margin:0 0 11px;
  text-align:justify; word-break:normal; overflow-wrap:break-word; hyphens:none}
.aibox p:last-child{margin-bottom:0}
/* 韓 연계 — 사실이 아니라 우리 해석이다. 색을 갈라 경계를 보이게 한다. */
.aibox.kor{background:var(--gov-soft); border-color:var(--gov)}
.aibox.kor .aih{color:var(--gov); border-bottom-color:var(--gov)}
.aibox.kor .aim.k{background:var(--gov); color:var(--pw-ink)}
.aibox.kor p{color:var(--ink)}

/* 유료 지면 표 — 누르기 전에 알 수 있어야 한다 (2026-09-09).
   유료 소스는 보조 출처로 달지 않는 것이 원칙이고, 이 표가 붙는 것은
   그 기사 자체가 항목이라 유료 지면이 유일한 확인 경로인 예외뿐이다. */
.paywall{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px;
  font-weight:600; letter-spacing:.06em; padding:1px 5px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn);
  white-space:nowrap; vertical-align:1px}

@media (max-width:520px){
  .dmeta > div{grid-template-columns:74px 1fr; gap:9px}
}

/* ══════════════════════════════════════════════════════════════
   리포트 상세면 (2026-09-09 신설)
   서가의 카드를 누르면 이 면이 선다. 기사 상세면과 같은 뼈대를 쓰되
   메타표에 자료발간일·키워드·첨부파일이 더 붙는다.
   ══════════════════════════════════════════════════════════════ */
.rep a.rtt{text-decoration:none; color:var(--ink)}
.rep a.rtt:hover{color:var(--accent)}
.rep a.rtt:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.kws{display:flex; flex-wrap:wrap; gap:5px}
.kw{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:1px 6px; border-radius:2px; background:var(--accent-soft);
  border:1px solid var(--accent); color:var(--accent); white-space:nowrap}
a.file{display:inline-flex; align-items:center; gap:8px; text-decoration:none;
  padding:7px 11px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink2); font-size:12.5px; margin:0 6px 6px 0}
a.file:hover{border-color:var(--accent); background:var(--accent-soft)}
a.file .ext{font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600;
  letter-spacing:.06em; padding:2px 5px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn)}
a.file .ext.html{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

/* 공개 아카이브의 항목 제목 — 누르면 그 기사의 상세면이 선다 (2026-09-09) */
a.alink{color:var(--ink); text-decoration:none; font-weight:600;
  border-bottom:1px solid var(--line)}
a.alink:hover{color:var(--accent); border-bottom-color:currentColor}
a.alink:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* 상세면이 서는 동안 탭을 감춘다. nav.tabs 의 display:flex 가 브라우저 기본
   [hidden]{display:none} 을 이기므로 여기서 다시 눌러 준다 — 이걸 빼면 상세면 위에
   탭이 남고, 눌러도 뒤에 가린 목록만 바뀌어 아무 일도 안 일어난 것처럼 보인다. */
nav.tabs[hidden]{display:none !important}

</style>
<style>
  details.raw{margin:22px 0 0; border:1px solid var(--line); background:var(--surface2)}
  details.raw summary{padding:9px 12px; cursor:pointer; font-size:13px; color:var(--muted)}
  details.raw pre{margin:0; padding:0 12px 12px; white-space:pre-wrap;
    font-size:12.5px; line-height:1.7; color:var(--ink2)}
  .filters{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px}
  .filters input, .filters select{border:1px solid var(--line); background:var(--surface);
    color:var(--ink); padding:7px 9px; font:inherit; font-size:13px; border-radius:2px}
  mark{background:var(--accent-soft); color:var(--ink); padding:0 1px}
  /* 머리글이 그리는 빈 내비게이션 바를 지운다 — 탭은 본문에서 만든다 */
  .top + nav.tabs:empty{display:none}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="pane" id="body"></div>
  <footer id="foot"></footer>
</div>

<script>
/* 공통 유틸 + 뉴스레터 렌더. 공개면·내부면이 함께 쓴다.
   ES 모듈이 아니다 — file:// 에서 module 은 CORS 로 막힌다. */
window.AI4S = window.AI4S || {};

(function (A) {
  'use strict';

  A.SECTIONS = ['해외 정책·전략', '연구인프라·컴퓨팅', '과학 AI 모델·자율실험', '과학적 성과',
                '산업·투자·국제협력', '연구제도·윤리·평가', '국내 연구현장·기관'];
  A.BAR = '━━━━━━━━━━━━━━━';
  A.NONE_LINE = '▷ 금일 AI4S 관련 주요기사 없음';
  A.NONE_HEAD = '금일 주요기사 없음';
  A.PW_SECTION = 5;

  A.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  A.$ = function (sel, root) { return (root || document).querySelector(sel); };
  A.$$ = function (sel, root) { return [].slice.call((root || document).querySelectorAll(sel)); };
  A.qs = function (k) { return new URLSearchParams(location.search).get(k); };

  A.fmtDate = function (iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return p.length === 3 ? p[0] + '.' + (+p[1]) + '.' + (+p[2]) : iso;
  };
  A.md = function (iso) {           // 2026-08-30 → 8/30
    var p = String(iso || '').split('-');
    return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : iso;
  };

  /* 오늘 날짜(Asia/Seoul). toISOString() 은 UTC 라서 쓰면 안 된다 —
     발송본을 조립하는 08:20 KST 는 UTC 로 아직 전날이고, 하필 매일 쓰는 그 시각에 하루가 어긋난다. */
  A.todayKST = function () {
    var d = new Date(Date.now() + 9 * 3600 * 1000);
    return d.getUTCFullYear() + '-'
      + String(d.getUTCMonth() + 1).padStart(2, '0') + '-'
      + String(d.getUTCDate()).padStart(2, '0');
  };

  /* 테마 토글. 세 상태를 돈다 — 시스템 → 라이트 → 다크 → 시스템.
     localStorage 는 사생활 보호 모드에서 던지므로 반드시 감싼다. */
  A.initTheme = function () {
    var K = 'ai4s-theme';
    var cur = '';
    try { cur = localStorage.getItem(K) || ''; } catch (e) { cur = ''; }
    if (cur) document.documentElement.setAttribute('data-theme', cur);
    var btn = A.$('#themetog');
    if (!btn) return;
    var label = function () {
      var v = document.documentElement.getAttribute('data-theme') || '';
      btn.textContent = v === 'light' ? '라이트' : v === 'dark' ? '다크' : '시스템';
    };
    label();
    btn.addEventListener('click', function () {
      var v = document.documentElement.getAttribute('data-theme') || '';
      var next = v === '' ? 'light' : v === 'light' ? 'dark' : '';
      if (next) document.documentElement.setAttribute('data-theme', next);
      else document.documentElement.removeAttribute('data-theme');
      try { next ? localStorage.setItem(K, next) : localStorage.removeItem(K); } catch (e) { /* 무시 */ }
      label();
    });
  };

  /* 발송본 조립. newsletter.py 와 글자 단위로 같은 결과를 내야 한다 —
     담당자가 화면에서 보는 것과 붙여넣는 것이 다르면 화면을 믿지 않게 된다. */
  A.buildEdition = function (date, cands, approvedIds, opens, meta) {
    meta = meta || {};
    var picked = cands.filter(function (c) { return approvedIds.indexOf(c.id) >= 0; });
    picked.sort(function (a, b) {
      return (a.sec - b.sec)
        || ((b.pw ? 1 : 0) - (a.pw ? 1 : 0))
        || ((b.K + b.N + b.C + b.M) - (a.K + a.N + a.C + a.M));
    });
    var out = [A.BAR, '[' + A.md(date) + ' 조간] AI for Science 주요동향', A.BAR];
    /* 빈 섹션은 내보내지 않고, 워치리스트도 발송본에 넣지 않는다 (2026-08-31 지시).
       newsletter.py 와 글자 단위로 같아야 하므로 두 곳을 반드시 같이 고친다.
       워치리스트는 없어진 것이 아니라 A.watchList() 가 그리는 관리용 패널로 옮겼다. */
    A.SECTIONS.forEach(function (name, idx) {
      var i = idx + 1;

       상한만 지키면 마지막이 한 줄짜리 토막으로 남아 지면이 너덜너덜해진다.
       내려서 마지막 문단이 상한을 넘게 되면 멈춘다. */
    while (groups.length > 1) {
      var last = groups[groups.length - 1], prev = groups[groups.length - 2];
      if (glen(last) >= 80 || prev.length < 2) { break; }
      if (glen(last) + 1 + prev[prev.length - 1].length > LIM) { break; }
      last.unshift(prev.pop());
    }
    return groups.map(function (g) { return g.join(' '); });
  };

  /* 유료 지면 판정 (2026-09-09 지시).

     **유료 소스는 보조 출처로 달지 않는다** — 눌러도 못 읽는 링크는 없느니만 못하고,
     그 매체에서만 나온 서술은 근거가 없는 것과 같다. 그래서 원문이 따로 열리는데
     보조로 붙인 유료 보도는 출처 표기에서도 링크에서도 뺀다(check.py 가 막는다).

     예외는 **그 기사 자체가 항목이고 유료 지면이 유일한 확인 경로일 때**다.
     네이처·사이언스 뉴스면이 그렇다. 그때는 링크를 두되 [유료] 표를 붙여
     **누르기 전에** 알 수 있게 한다.

     목록은 config.paywall 에 있다 — 새 매체가 생기면 코드가 아니라 그 파일을 고친다.
     주소의 일부만 유료인 곳이 있어(네이처는 뉴스면 d41586 만 유료, 오픈액세스
     학술지는 아니다) 도메인이 아니라 **주소 조각**으로 적는다. */
  A.isPaywalled = function (u) {
    var list = (A.config && A.config.paywall) || [];
    var s = String(u || '').toLowerCase();
    if (!s) { return false; }
    for (var i = 0; i < list.length; i++) {
      if (s.indexOf(String(list[i]).toLowerCase()) >= 0) { return true; }
    }
    return false;
  };

  /* 상세면 한 장. x 는 items[] 의 항목이고 opt.date 는 그 항목이 실린 호다. */
  A.detailHTML = function (x, opt) {
    opt = opt || {};
    var sec = A.SECTIONS[(x.sec || 0) - 1] || '';
    var sp = A.splitKorea(x.body || '');
    /* 상세면은 일반 독자가 읽는 자리다 (2026-09-09 지시). 실무용 서술을 그대로 두면
       용어에서 막히므로 **쉬운 요약(ez)이 있으면 그것을 그린다.** body 는 카톡
       발송본과 내부 화면이 지는 기록이라 그대로 두고, 지면에서 갈아 끼우기만 한다. */
    var ps = A.paras(x.ez || sp.facts);
    /* 메타표는 「자료발표일 + 출처」 둘로 끝낸다 (2026-09-09 지시).
       수록 호는 위 도구막대가, 분류는 제목 위 눈썹줄이 이미 지고 있고,
       핵심요약은 바로 아래 상세요약이 같은 말을 더 길게 한다 — 다 뺐다.
       주소도 따로 줄 세우지 않는다. **출처 조각마다 링크가 걸리므로**
       「원문 · 문서 · 보도」를 눌러 그대로 들어간다(A.srcHTML). */
    var meta = [];
    meta.push(['자료발표일',
      x.pd ? A.esc(A.fmtDate(x.pd)) : '<span class="pd warn">확인 못 함</span>']);
    if (x.src) {
      meta.push(['출처', A.srcHTML(x)]);
    } else if (x.url || x.durl || x.murl) {
      /* src 가 비면 걸 자리가 없어 링크가 통째로 사라진다. 그때만 주소를 직접 세운다. */
      meta.push(['원문링크', [['원문', x.url], ['문서', x.durl], ['보도', x.murl]]
        .filter(function (r) { return r[1]; })
        .map(function (r) {
          return '<a class="src-link" href="' + A.esc(r[1]) + '" target="_blank" '
            + 'rel="noopener">' + r[0] + '</a>';
        }).join(' · ')]);
    }

    var h = '<article class="detail" data-sec="' + (x.sec || 0) + '">';
    h += '<div class="dhead"><div class="dsec">' + A.esc(sec) + '</div>'
      + '<h2 class="dtt">' + A.esc(x.t || '') + '</h2></div>';

    h += '<dl class="dmeta">' + meta.map(function (r) {
      return '<div><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>';
    }).join('') + '</dl>';

    if (ps.length) {
      h += '<section class="aibox"><div class="aih"><span class="aim">AI</span>상세요약</div>'
        + ps.map(function (t) { return '<p>' + A.esc(t) + '</p>'; }).join('')
        + '</section>';
    }
    /* 韓 연계는 우리 해석이라 표시를 달아 사실과 가른다. */
    if (sp.korea) {
      h += '<section class="aibox kor"><div class="aih"><span class="aim k">韓</span>'
        + '국내 연계 — 편집자 해석</div>'
        + A.paras(sp.korea).map(function (t) { return '<p>' + A.esc(t) + '</p>'; }).join('')
        + '</section>';
    }
    /* 하단 「원문 링크」 블록은 두지 않는다 (2026-09-09 지시) — 바로 위 메타표가
       원문링크·근거문서·보도를 이미 주소째 걸고 있어 같은 것을 두 번 세우는 꼴이다. */
    return h + '</article>';
  };

  /* 상세면 설치. 목록을 그리는 화면이 이 함수를 부르면 해시가 바뀔 때마다 목록과 상세를
     갈아 끼운다. 되돌아올 때 보던 자리로 가도록 스크롤 위치도 되살린다.

       A.installDetail({ mount, panes:[{el,on}], chrome:[el], lookup: fn(key) }) */
  A.installDetail = function (cfg) {
    var mount = cfg.mount, panes = cfg.panes || [], top = 0;

    function paint() {
      var m = /^#a\/([^\/?&]+)$/.exec(location.hash || '');
      var found = m ? cfg.lookup(decodeURIComponent(m[1])) : null;
      if (!found) {
        mount.hidden = true;
        mount.innerHTML = '';
        panes.forEach(function (p) { p.el.hidden = !p.on(); });
        (cfg.chrome || []).forEach(function (c) { c.hidden = false; });
        if (top) { window.scrollTo(0, top); top = 0; }
        return;
      }
      top = window.pageYOffset || 0;
      panes.forEach(function (p) { p.el.hidden = true; });
      (cfg.chrome || []).forEach(function (c) { c.hidden = true; });
      /* 그리는 방식만 화면마다 다르다 — 기사 상세와 리포트 상세가 같은 뼈대를 쓴다. */
      mount.innerHTML = '<div class="toolbar">'
        + '<button class="act ghost" type="button" id="dback">← 목록으로</button>'
        + '<span class="count">'
        + A.esc(found.label || (A.fmtDate(found.date) + ' 조간')) + '</span></div>'
        + (cfg.render ? cfg.render(found) : A.detailHTML(found.x, { date: found.date }));
      mount.hidden = false;
      window.scrollTo(0, 0);
      var b = document.getElementById('dback');
      if (b) {
        b.addEventListener('click', function () {
          if (history.length > 1) { history.back(); } else { location.hash = ''; }
        });
      }
    }

    window.addEventListener('hashchange', paint);
    paint();
    return paint;
  };

  /* 클립보드. file:// 나 비 HTTPS 에서는 API 가 막힌다.
     실패를 삼키지 말고 텍스트를 선택 상태로 만들어 직접 복사하게 한다. */
  A.copy = function (el, msgEl) {
    var txt = el.textContent;
    var done = function (m) {
      if (msgEl) { msgEl.textContent = m; setTimeout(function () { msgEl.textContent = ''; }, 4000); }
    };
    var fallback = function () {
      try {
        var r = document.createRange(); r.selectNodeContents(el);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        done('자동 복사가 막혀 있습니다. 선택된 영역을 Ctrl+C 로 복사하세요.');
      } catch (e) { done('복사에 실패했습니다. 텍스트를 직접 선택해 주세요.'); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt)
        .then(function () { done('복사했습니다. 카톡에 붙여넣으세요.'); })
        .catch(fallback);
    } else { fallback(); }
  };

  /* 공통 머리·꼬리. 페이지마다 같은 마크업을 복사하지 않게 한다. */
  A.header = function (opts) {
    var c = A.config || {};
    var nav = (opts.nav || []).map(function (it) {
      var cur = it.href === opts.here ? ' aria-current="page"' : '';
      return '<a href="' + it.href + '"' + cur + '><span class="n">' + it.n + '</span>' + it.label + '</a>';
    }).join('');
    /* 머리글 첫 줄은 **발행처 · 수신처** 두 조각이다 (2026-09-03 재지시).
       누가 내고 누구에게 가는 지면인지가 첫 줄에서 끝나야 한다.
       셋째 줄에서는 수신처를 빼 둔 상태다 — 같은 이름을 두 줄에 되풀이하지 않는다.
       opts.eyebrow 로 덮어쓸 수 있다. */
    var eyebrow = opts.eyebrow != null ? opts.eyebrow
      : (c.publisher || '(발행처 미정)') + ' · ' + (c.audience || '');
    return '<div class="top">'
      + '<div class="grow">'
      + '<p class="eyebrow">' + A.esc(eyebrow) + '</p>'
      + '<h1>' + A.esc(opts.title) + '</h1>'
      + '<p class="subline">' + A.esc(opts.sub || '') + '</p>'
      + '</div>'
      + '<div style="display:flex;gap:8px;align-items:center">'
      + (opts.internal ? '<span class="internal-badge">내부용</span>' : '')
      + '<button class="themetog" id="themetog" type="button">시스템</button>'
      + '</div></div>'
      + '<nav class="tabs">' + nav + '</nav>';
  };

  A.footer = function (extra) {
    var c = A.config || {};
    return (c.publisher || '(발행처 미정)') + ' · ' + (c.title || 'AI4S 데일리') + ' · '
      + (extra || '데이터는 .js 전역 할당 — 갱신 시 배열만 교체한다');
  };

  A.PUBLIC_NAV = [
    { n: '01', label: '홈', href: 'index.html' },
    { n: '02', label: '아카이브', href: 'archive.html' },
    { n: '03', label: '리포트', href: 'reports.html' },
    { n: '04', label: '체계 소개', href: 'about.html' }
  ];
  A.INTERNAL_NAV = [
    { n: '00', label: '내부 홈', href: 'index.html' },
    { n: '01', label: '후보풀·승인', href: 'pool.html' },
    { n: '02', label: '레퍼런스', href: 'shelf.html' },
    { n: '03', label: '미확정(OPEN)', href: 'open.html' },
    { n: '04', label: '스레드', href: 'threads.html' },
    { n: '05', label: '이슈 도출', href: 'issues.html' },
    { n: '06', label: '리포트 파이프라인', href: 'pipeline.html' },
    { n: '07', label: '체계도', href: 'system.html' }
  ];

  /* 페이지 뼈대를 한 번에 그린다. 각 페이지는 render() 만 채우면 된다. */
  A.page = function (opts, render) {
    document.addEventListener('DOMContentLoaded', function () {
      var wrap = A.$('#app');
      wrap.insertAdjacentHTML('afterbegin', A.header(opts));
      A.initTheme();
      try {
        render(A.$('#body'));
      } catch (e) {
        A.$('#body').innerHTML = '<div class="note warn"><span class="lbl">렌더 오류</span>'
          + A.esc(e.message) + '<br>데이터 파일을 확인하라 — <code>python scripts/check.py --root .</code></div>';
        throw e;
      }
      var f = A.$('#foot');
      if (f) f.textContent = A.footer(opts.footNote);
    });
  };
})(window.AI4S);

</script>
