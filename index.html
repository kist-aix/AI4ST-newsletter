<!-- 자립형 배포본 · 2026-09-18 08:07 생성 · 더블클릭하면 열립니다 -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* ══════════════════════════════════════════════════════════════
   디자인 토큰 — 세 상태를 모두 정의한다.
   :root 에 완전한 라이트 팔레트, 미디어 쿼리와 [data-theme]에서 재정의.
   미디어 쿼리 안에서만 정의되는 색이 하나라도 있으면,
   시스템 기본(스탬프 없음) 상태에서 그 색이 사라져 글자가 배경에 묻힌다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --bg:#EDF0EE; --surface:#FBFCFB; --surface2:#F1F4F2; --panel:#16211D;
  --ink:#131C19; --ink2:#2C3A35; --muted:#5A6A63; --line:#D2DAD5; --line2:#E3E9E5;
  --accent:#0D6A56; --accent-soft:#DCEBE5; --gov:#2A4B7C; --gov-soft:#DFE7F2;
  --warn:#95441A; --warn-soft:#F2E3D8; --panel-ink:#DCE7E2; --panel-dim:#7E948C;
  --ok:#0D6A56; --ok-soft:#DCEBE5; --crit:#8E2F2F; --crit-soft:#F4DFDF;
  --pw-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1211; --surface:#141C19; --surface2:#1A2421; --panel:#0A100E;
    --ink:#E4EBE7; --ink2:#C3D0CA; --muted:#8FA098; --line:#26332F; --line2:#1E2A26;
    --accent:#4CC5A2; --accent-soft:#12302A; --gov:#84AADE; --gov-soft:#16233A;
    --warn:#DE9364; --warn-soft:#2E2019; --panel-ink:#D5E2DC; --panel-dim:#71877F;
    --ok:#4CC5A2; --ok-soft:#12302A; --crit:#E08585; --crit-soft:#331B1B;
    --pw-ink:#0D1211;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1211; --surface:#141C19; --surface2:#1A2421; --panel:#0A100E;
  --ink:#E4EBE7; --ink2:#C3D0CA; --muted:#8FA098; --line:#26332F; --line2:#1E2A26;
  --accent:#4CC5A2; --accent-soft:#12302A; --gov:#84AADE; --gov-soft:#16233A;
  --warn:#DE9364; --warn-soft:#2E2019; --panel-ink:#D5E2DC; --panel-dim:#71877F;
  --ok:#4CC5A2; --ok-soft:#12302A; --crit:#E08585; --crit-soft:#331B1B;
  --pw-ink:#0D1211;
}

*{box-sizing:border-box}
html{color-scheme:light dark}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  font-size:14.5px; line-height:1.72; -webkit-font-smoothing:antialiased;
  /* 낱말과 어미가 줄 끝에서 쪼개지지 않게 한다 (2026-09-14 사용자 지시).
     기본값(word-break:normal)은 한글을 **음절 단위**로 끊어서 「자율실험」이
     「자율실」+「험」으로, 「개설했다」가 「개설했」+「다」로 갈린다 — 읽는 눈이
     거기서 한 번 걸린다. keep-all 은 어절(낱말+조사·어미)을 통째로 넘긴다.
     주소·긴 영문처럼 어절 자체가 줄보다 길면 overflow-wrap 이 받아 준다.
     예외가 필요한 자리(명령문·주소 상자)는 각자 다시 선언한다. */
  word-break:keep-all; overflow-wrap:break-word;
}
h1,h2,h3{font-family:'Gowun Batang','Noto Serif KR',Georgia,serif; margin:0; text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
img{max-width:100%}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px 90px}

/* ── 머리 ── */
.top{padding:30px 0 0; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start}
.top .grow{flex:1 1 300px}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); font-weight:600}
h1{font-size:clamp(24px,4.4vw,36px); font-weight:700; margin-top:10px; line-height:1.2}
.subline{color:var(--muted); font-size:13px; margin-top:9px;
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums}

/* 내부면 표식. 화면 캡처가 밖으로 나갔을 때 구분되어야 하므로 숨기거나 접지 않는다. */
.internal-badge{
  display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  letter-spacing:.1em; padding:3px 9px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn);
}
.themetog{
  appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 10px; border-radius:2px;
  cursor:pointer;
}
.themetog:hover{color:var(--ink); border-color:var(--ink)}
.themetog:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── 내비 ── */
nav.tabs{display:flex; gap:0; margin-top:24px; border-bottom:2px solid var(--ink); overflow-x:auto}
nav.tabs a, nav.tabs button{
  appearance:none; text-decoration:none; display:block;
  border:1px solid var(--line); border-bottom:none; background:var(--surface2);
  color:var(--muted); font-family:'Noto Sans KR',sans-serif; font-size:13.5px; font-weight:500;
  padding:9px 15px; cursor:pointer; white-space:nowrap; margin-right:-1px; border-radius:2px 2px 0 0;
}
nav.tabs .n{font-family:'IBM Plex Mono',monospace; font-size:11px; margin-right:7px; opacity:.75}
nav.tabs a:hover, nav.tabs button:hover{background:var(--surface); color:var(--ink)}
nav.tabs a[aria-current="page"], nav.tabs button[aria-selected="true"]{
  background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700}
nav.tabs a:focus-visible, nav.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.pane{padding:30px 0 0}
.pane[hidden]{display:none}

h2{font-size:21px; font-weight:700; margin:34px 0 6px}
h2:first-child{margin-top:0}
h3{font-size:15.5px; font-weight:700; margin:24px 0 10px}
.dek{color:var(--muted); font-size:13.5px; margin-bottom:16px; max-width:72ch}

/* ── 표 ── */
.scroll{overflow-x:auto; border:1px solid var(--line); background:var(--surface); margin:16px 0}
table{border-collapse:collapse; width:100%; min-width:540px; font-size:13px}
th,td{padding:9px 11px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line2)}
thead th{background:var(--surface2); font-family:'IBM Plex Mono',monospace; font-weight:600;
  font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--line); white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
td.n{font-variant-numeric:tabular-nums; font-family:'IBM Plex Mono',monospace; white-space:nowrap}

/* ── 칩·등급 ── */
.chip{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:2px 6px; border-radius:2px; border:1px solid var(--line); background:var(--surface2);
  color:var(--ink2); margin:1px 2px 1px 0; white-space:nowrap}
.chip.a{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.chip.b{background:var(--gov-soft); border-color:var(--gov); color:var(--gov)}
.chip.c{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.sig{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  font-weight:600; padding:2px 6px; border-radius:2px; white-space:nowrap}
.sig.s1{background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok)}
.sig.s2{background:var(--gov-soft); color:var(--gov); border:1px solid var(--gov)}
.sig.s3{background:var(--surface2); color:var(--muted); border:1px solid var(--line)}
.sig.s4{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn)}

/* ── 도구막대·버튼 ── */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0;
  padding:12px 14px; background:var(--surface); border:1px solid var(--line)}
.toolbar .count{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--muted);
  font-variant-numeric:tabular-nums}
.toolbar .count b{color:var(--accent); font-size:15px}
button.act, a.act{
  appearance:none; text-decoration:none; display:inline-block;
  border:1px solid var(--ink); background:var(--ink); color:var(--bg);
  font-family:'Noto Sans KR',sans-serif; font-size:13px; font-weight:600; padding:7px 14px;
  border-radius:2px; cursor:pointer;
}
button.act.ghost, a.act.ghost{background:transparent; color:var(--ink)}
button.act:hover, a.act:hover{opacity:.86}
button.act:focus-visible, a.act:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
select, input[type=search], input[type=text]{
  font-family:'Noto Sans KR',sans-serif; font-size:13px; padding:6px 9px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:2px;
}
select:focus-visible, input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* ── 후보풀 ── */
table.pool td{vertical-align:middle}
table.pool tr.on{background:var(--accent-soft)}
table.pool input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer}
.sc{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:12px}
.sc b{font-size:13.5px; color:var(--accent)}
.ttl{font-weight:500; line-height:1.5}
.src{font-size:11.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace}
/* 검증 경위 — 내부 후보풀 화면에만 나온다(2026-09-04). 무엇을 확보하지 못했는지를
   승인 전에 보이게 하되, 제목보다 뒤로 물러서게 해서 사실과 섞이지 않게 한다. */
.vnote{margin-top:5px; font-size:11.5px; line-height:1.55; color:var(--muted);
  border-left:2px solid var(--line); padding:3px 0 3px 8px}
.vnote .lbl{display:inline-block; margin-right:6px; font-weight:600; color:var(--warn,#a15c00)}
.pw{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600;
  padding:1px 5px; border-radius:2px; background:var(--gov); color:var(--pw-ink);
  margin-right:5px; vertical-align:1px}

/* ── 발송본 패널 ── */
.out{background:var(--panel); color:var(--panel-ink); padding:20px 18px; margin-top:14px;
  overflow-x:auto; border-radius:2px}
.out pre{margin:0; font-family:'IBM Plex Mono','D2Coding',monospace; font-size:12px;
  line-height:1.9; white-space:pre-wrap; word-break:keep-all; overflow-wrap:break-word}

/* ── 노트 ── */
.note{background:var(--surface); border-left:3px solid var(--accent); padding:14px 16px;
  margin:16px 0; font-size:13.5px; color:var(--ink2)}
.note.warn{border-left-color:var(--warn)}
.note .lbl{display:block; font-family:'IBM Plex Mono',monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:600;
  margin-bottom:5px}
.note.warn .lbl{color:var(--warn)}

/* ── REF 카드 ── */
.refs{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:12px; margin-top:14px}
.ref{border:1px solid var(--line); background:var(--surface); padding:13px 14px}
.ref .rid{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); letter-spacing:.06em}
.ref .rt{font-weight:700; font-size:14px; margin:5px 0 6px; line-height:1.45}
.ref .rm{font-size:12.5px; color:var(--muted); margin-bottom:8px}
.ref .rk{font-size:12.5px; color:var(--ink2); margin-top:8px; padding-top:8px;
  border-top:1px dashed var(--line)}
.filters{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0}
.filters button{appearance:none; font-family:'IBM Plex Mono',monospace; font-size:11.5px;
  padding:4px 9px; border:1px solid var(--line); background:var(--surface); color:var(--muted);
  cursor:pointer; border-radius:2px}
.filters button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── 스레드 ── */
.thread{border:1px solid var(--line); background:var(--surface); padding:15px 16px; margin-bottom:12px}
.thread .tn{font-weight:700; font-size:15px; font-family:'Gowun Batang',serif}
.tl{list-style:none; margin:12px 0 0; padding:0 0 0 16px; border-left:2px solid var(--line)}
.tl li{position:relative; padding:0 0 10px 14px; font-size:13px}
.tl li::before{content:''; position:absolute; left:-21px; top:8px; width:7px; height:7px;
  border-radius:50%; background:var(--accent); border:2px solid var(--surface)}
.tl .d{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-right:8px}
.verdict{margin-top:12px; padding:10px 12px; background:var(--surface2);
  border-left:3px solid var(--gov); font-size:13px}
.verdict b{color:var(--gov)}

/* ── 이슈 ── */
.iss{border:1px solid var(--line); background:var(--surface); margin-bottom:14px}
.ih{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
  gap:10px; align-items:baseline}
.ih .rule{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; background:var(--ink); color:var(--bg); border-radius:2px}
.ih .it{font-weight:700; font-size:15px; font-family:'Gowun Batang',serif; flex:1 1 240px}
.ib{padding:14px 16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px}
.lbl2{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); margin-bottom:5px}
.toc{font-size:13px; margin:0; padding-left:17px}
.toc li{margin-bottom:3px}
.vfy{font-size:12.5px}
.vf{display:block; margin-bottom:4px}
.ok-i{color:var(--ok); font-weight:600}
.wn-i{color:var(--warn); font-weight:600}
.cr-i{color:var(--crit); font-weight:600}

/* ── D-day ── */
.dd{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; border-radius:2px; background:var(--surface2); border:1px solid var(--line);
  color:var(--muted)}
.dd.near{background:var(--crit-soft); border-color:var(--crit); color:var(--crit)}
.dd.mid{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}

/* ── 파이프라인 ── */
.pipe{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); margin-top:14px}
.col{background:var(--surface); padding:12px 13px; min-height:130px}
.colh{display:flex; align-items:baseline; gap:8px; margin-bottom:10px; padding-bottom:8px;
  border-bottom:1px solid var(--line2)}
.colh .cn{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--muted); font-weight:600}
.colh .cc{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600;
  color:var(--accent); margin-left:auto; font-variant-numeric:tabular-nums}
.card{background:var(--surface2); border:1px solid var(--line); padding:8px 10px;
  margin-bottom:7px; font-size:12.5px; line-height:1.5}
.card .cid{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--muted)}
.card.done{border-left:3px solid var(--ok)}
.empty{font-size:12.5px; color:var(--muted); padding:6px 0}

/* ── 리포트 ── */
.rep{border:1px solid var(--line); background:var(--surface); margin-bottom:14px}
.reph{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
  gap:10px; align-items:baseline}
.reph .no{font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
  padding:2px 7px; background:var(--accent); color:var(--surface); border-radius:2px}
.reph .rtt{font-weight:700; font-size:15.5px; font-family:'Gowun Batang',serif; flex:1 1 240px}
.repb{padding:14px 16px}
.sum{background:var(--surface2); border-left:3px solid var(--accent); padding:11px 13px;
  margin-bottom:12px; font-size:13px}
.sum span{display:block; margin-bottom:5px}
.sum span:last-child{margin-bottom:0}
.repmeta{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; font-size:12.5px}
.stg{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
  padding:2px 7px; border-radius:2px; border:1px solid var(--line); background:var(--surface2);
  color:var(--muted)}
.stg.wait{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.stg.go{background:var(--gov-soft); border-color:var(--gov); color:var(--gov)}
.stg.pub{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}

/* ── 아카이브 목록 ── */
.edlist{display:grid; gap:10px; margin-top:14px}
.edrow{display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; padding:12px 14px;
  border:1px solid var(--line); background:var(--surface); text-decoration:none; color:inherit}
.edrow:hover{border-color:var(--accent)}
.edrow .ed{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--accent);
  font-weight:600; white-space:nowrap}
.edrow .eh{flex:1 1 260px; font-size:13.5px}
.item{border-bottom:1px solid var(--line2); padding:11px 0}
.item:last-child{border-bottom:none}
.item .isec{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted);
  letter-spacing:.06em; text-transform:uppercase}
.item .itx{font-size:13.5px; margin-top:3px; line-height:1.7}
.hit{background:var(--accent-soft); border-radius:2px}

ul.tight{margin:10px 0 0; padding-left:19px}
ul.tight li{margin-bottom:6px; font-size:13.5px}
ul.tight li::marker{color:var(--accent)}
footer{margin-top:50px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted);
  font-size:12px; font-family:'IBM Plex Mono',monospace}
code{font-family:'IBM Plex Mono',monospace; font-size:.92em; background:var(--surface2);
  padding:1px 4px; border-radius:2px}
b{font-weight:700}

@media (max-width:520px){
  .wrap{padding:0 14px 70px}
  nav.tabs a, nav.tabs button{padding:8px 11px; font-size:12.5px}
}

/* ── 발표일·원문 표기 ─────────────────────────────────────────
   검색엔진이 몇 달 지난 자료를 오늘 것처럼 올려 준다. 담당자가 승인 전에
   날짜를 눈으로 보게 하려고 항목마다 붙인다. 확인 못 한 날짜는 감추지 않는다. */
.pd{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:1px 5px; border-radius:2px; border:1px solid var(--line);
  background:var(--surface2); color:var(--muted); white-space:nowrap}
.pd.warn{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.src-link{font-size:10.5px; font-family:'IBM Plex Mono',monospace;
  text-decoration:none; border-bottom:1px solid currentColor}
.src-link:hover{border-bottom-width:2px}

/* ── 워치리스트 패널 (관리용 화면 전용) ───────────────────────
   발송본에서 뺀 뒤로 이 패널이 유일한 노출 지점이다. */
ul.watch{list-style:none; margin:0; padding:0}
ul.watch li{padding:8px 0; border-bottom:1px solid var(--line2);
  font-size:13px; line-height:1.65; display:flex; gap:9px; align-items:flex-start}
ul.watch li:last-child{border-bottom:none}
ul.watch .dd{flex:0 0 auto}

/* ── 지면 서식 (뉴스레터 면 · 내부 미리보기가 함께 쓴다) ─────────
   뉴스레터 면에만 두면 관리용 후보풀 화면의 미리보기가 다른 모습으로
   그려진다. 담당자가 화면에서 본 것과 배포되는 지면은 같아야 한다. */
  /* 공유용 전용 — 결과 중심 배치. 해석·판단근거는 싣지 않는다. */
  .fact{border-left:3px solid var(--line); padding:10px 0 10px 14px; margin:0 0 2px}
  .fact + .fact{border-top:1px solid var(--line2)}
  .fact .ft{font-size:14px; font-weight:600; line-height:1.55; color:var(--ink)}
  .fact .fk{font-size:13px; line-height:1.75; color:var(--ink2); margin-top:5px}
  .fact .fm{margin-top:6px; display:flex; flex-wrap:wrap; gap:7px; align-items:center}
  /* 섹션 7개를 색으로 가른다. 번호를 세지 않고도 어느 갈래인지 눈에 들어와야 한다.
     라이트는 어두운 색, 다크는 밝은 색 — 세 테마 상태를 모두 정의한다. */
  :root{
    --s1:#2A4B7C; --s2:#0D6A56; --s3:#5B3E8E; --s4:#16607A;
    --s5:#8A5A1B; --s6:#8E3346; --s7:#4A6B22;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --s1:#8DAFE2; --s2:#4CC5A2; --s3:#B7A0E4; --s4:#74C4DF;
      --s5:#E0AC72; --s6:#E993A7; --s7:#AFD177;
    }
  }
  :root[data-theme="dark"]{
    --s1:#8DAFE2; --s2:#4CC5A2; --s3:#B7A0E4; --s4:#74C4DF;
    --s5:#E0AC72; --s6:#E993A7; --s7:#AFD177;
  }

  .secblk{margin:0 0 26px}
  .secblk h3{display:flex; align-items:baseline; gap:9px; margin:0 0 4px;
    font-size:15px; letter-spacing:-.01em;
    border-bottom:2px solid currentColor; padding-bottom:6px}
  .secblk[data-sec="1"] h3{color:var(--s1)}
  .secblk[data-sec="2"] h3{color:var(--s2)}
  .secblk[data-sec="3"] h3{color:var(--s3)}
  .secblk[data-sec="4"] h3{color:var(--s4)}
  .secblk[data-sec="5"] h3{color:var(--s5)}
  .secblk[data-sec="6"] h3{color:var(--s6)}
  .secblk[data-sec="7"] h3{color:var(--s7)}
  /* 항목 왼쪽 선도 같은 색을 옅게 물려 받아 어느 섹션 소속인지 이어 보이게 한다 */
  .secblk[data-sec="1"] .fact{border-left-color:var(--s1)}
  .secblk[data-sec="2"] .fact{border-left-color:var(--s2)}
  .secblk[data-sec="3"] .fact{border-left-color:var(--s3)}
  .secblk[data-sec="4"] .fact{border-left-color:var(--s4)}
  .secblk[data-sec="5"] .fact{border-left-color:var(--s5)}
  .secblk[data-sec="6"] .fact{border-left-color:var(--s6)}
  .secblk[data-sec="7"] .fact{border-left-color:var(--s7)}
/* ── 당일 미리보기 (내부 후보풀 화면) ─────────────────────────
   체크하는 즉시 배포될 지면이 이 안에 그려진다. 테두리를 둘러 '지면'과
   '작업 화면'을 눈으로 가른다 — 안쪽은 밖으로 나가는 것이다. */
.preview{border:1px solid var(--line); background:var(--surface);
  padding:16px 18px 6px; margin:12px 0 0}
.preview .toolbar{margin-top:0}
pre.cmd{margin:8px 0 0; padding:10px 12px; overflow-x:auto; white-space:pre-wrap;
  word-break:break-all; background:var(--surface2); border:1px solid var(--line);
  font-family:'IBM Plex Mono','D2Coding',monospace; font-size:11.5px;
  line-height:1.7; color:var(--ink2)}

/* ══════════════════════════════════════════════════════════════
   기사 상세면 (2026-09-09 신설)
   목록의 제목을 누르면 이 면이 선다 — 메타표 · AI 상세요약 · 하단 원문 링크.
   별도 파일이 아니라 같은 파일 안에서 갈아 끼우므로, 배포본 한 장으로 보내도
   그대로 눌린다. 인쇄·이미지로 구울 때는 bundle.py 가 목록만 남기고 감춘다.
   ══════════════════════════════════════════════════════════════ */

/* 목록에서 — 제목이 눌린다는 것이 보여야 한다. 밑줄 대신 오른쪽에 표를 단다. */
.fact a.ft{display:block; text-decoration:none; color:var(--ink); font-size:14px;
  font-weight:600; line-height:1.55}
.fact a.ft:hover{color:var(--accent)}
.fact a.ft:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
/* 제목 줄 — 헤드라인과 「상세 보기」를 양 끝으로 벌린다 (2026-09-09 지시).
   좁은 화면에서는 상세 보기가 아래로 떨어지되 오른쪽에 붙어 있게 한다. */
.fact .fh{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline;
  justify-content:space-between}
.fact .fh a.ft{flex:1 1 240px}
.fact .fh a.dgo{flex:0 0 auto; margin-left:auto}

/* 「상세 보기」 — 목록에서 상세면으로 가는 유일한 길이다. 발표일도 출처도
   상세면 메타표가 지므로 목록에는 이것만 둔다. */
a.dgo{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  font-weight:600; letter-spacing:.04em; padding:2px 8px; border-radius:2px;
  border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  text-decoration:none; white-space:nowrap}
a.dgo:hover{background:var(--accent); color:var(--surface)}
a.dgo:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
/* 리포트 카드 제목 옆 표는 그대로 쓴다 */
a.rtt .more{display:inline-block; margin-left:8px; vertical-align:2px;
  font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; letter-spacing:.08em;
  padding:1px 5px; border-radius:2px; border:1px solid var(--line);
  background:var(--surface2); color:var(--muted); white-space:nowrap}
a.rtt:hover .more{border-color:var(--accent); color:var(--accent);
  background:var(--accent-soft)}

/* ── 상세면 ── */
.detail{max-width:78ch}
.dhead{border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:0}
.dsec{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.11em;
  text-transform:uppercase; font-weight:600; color:var(--muted); margin-bottom:8px}
.detail[data-sec="1"] .dsec{color:var(--s1)}
.detail[data-sec="2"] .dsec{color:var(--s2)}
.detail[data-sec="3"] .dsec{color:var(--s3)}
.detail[data-sec="4"] .dsec{color:var(--s4)}
.detail[data-sec="5"] .dsec{color:var(--s5)}
.detail[data-sec="6"] .dsec{color:var(--s6)}
.detail[data-sec="7"] .dsec{color:var(--s7)}
.dtt{font-size:clamp(19px,3vw,25px); font-weight:700; line-height:1.38; color:var(--ink)}

/* 메타표 — 자료발표일·출처·원문링크. 첨부 서식과 같은 자리에 같은 것이 오게 둔다. */
.dmeta{margin:0; padding:14px 16px; background:var(--surface2);
  border:1px solid var(--line); border-top:none; display:grid; gap:7px 18px; font-size:12.5px}
.dmeta > div{display:grid; grid-template-columns:88px 1fr; gap:12px; align-items:baseline}
.dmeta dt{font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em;
  color:var(--muted); font-weight:600; padding-top:1px}
/* 출처 자리에는 **누를 대상의 이름**이 선다(2026-09-11·2026-09-14 지시). 이름을
   음절로 쪼개면 이름이 아니게 되므로 어절을 지키고, 주소가 그대로 올 때만 받아 준다. */
.dmeta dd{margin:0; color:var(--ink2); word-break:keep-all;
  overflow-wrap:anywhere; line-height:1.6}
.dmeta dd a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--line)}
.dmeta dd a:hover{border-bottom-color:currentColor}
/* 출처 조각이 곧 링크다 (2026-09-09). src-link 의 기본값(10.5px 모노)은 목록의
   좁은 줄에 맞춘 것이라 표 안에서는 읽기 어렵다 — 여기서는 본문 크기로 되돌린다. */
.dmeta dd a.src-link{font-family:inherit; font-size:13px; border-bottom-color:var(--accent)}

.dkey{margin-top:16px; padding:12px 14px; background:var(--surface);
  border-left:3px solid var(--accent); font-size:13.5px; line-height:1.75; color:var(--ink)}
.dkey .lbl2{margin-bottom:5px}

/* AI 요약 상자 */
.aibox{margin-top:16px; padding:16px 18px; background:var(--surface);
  border:1px solid var(--line); border-radius:2px}
.aibox .aih{display:flex; align-items:center; gap:8px; margin-bottom:12px;
  padding-bottom:9px; border-bottom:1px solid var(--line2);
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.09em;
  font-weight:600; color:var(--accent); text-transform:uppercase}
.aibox .aim{display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:18px; padding:0 5px; border-radius:2px;
  background:var(--accent); color:var(--surface); font-size:10px; letter-spacing:.04em}
/* **낱말과 어미를 쪼개지 않는다 (2026-09-14 사용자 지시).** 2026-09-09 에는
   양쪽 맞춤(justify)을 살리려고 기본값을 썼다 — keep-all 이면 줄 끝에 긴 어절이
   걸릴 때 그 줄을 통째로 넘기고 남은 자리를 낱말 사이 빈칸이 나눠 가져 구멍처럼
   벌어지기 때문이다. **그래서 맞춤 쪽을 버렸다.** 「개설했다」가 줄 끝에서
   「개설했」+「다」로 갈리는 것이 오른쪽 끝이 들쭉날쭉한 것보다 읽기에 나쁘다 —
   맞춤은 눈에 보기 좋자는 것이고 어절은 읽는 일 자체다.
   왼쪽 맞춤으로 두면 빈칸을 늘릴 일이 없으므로 구멍도 생기지 않는다. */
.aibox p{font-size:13.8px; line-height:1.95; color:var(--ink2); margin:0 0 11px;
  text-align:left; word-break:keep-all; overflow-wrap:break-word; hyphens:none}
.aibox p:last-child{margin-bottom:0}
/* 韓 연계 — 사실이 아니라 우리 해석이다. 색을 갈라 경계를 보이게 한다. */
.aibox.kor{background:var(--gov-soft); border-color:var(--gov)}
.aibox.kor .aih{color:var(--gov); border-bottom-color:var(--gov)}
.aibox.kor .aim.k{background:var(--gov); color:var(--pw-ink)}
.aibox.kor p{color:var(--ink)}

/* 유료 지면 표 — 누르기 전에 알 수 있어야 한다 (2026-09-09).
   유료 소스는 보조 출처로 달지 않는 것이 원칙이고, 이 표가 붙는 것은
   그 기사 자체가 항목이라 유료 지면이 유일한 확인 경로인 예외뿐이다. */
.paywall{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px;
  font-weight:600; letter-spacing:.06em; padding:1px 5px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn);
  white-space:nowrap; vertical-align:1px}

@media (max-width:520px){
  .dmeta > div{grid-template-columns:74px 1fr; gap:9px}
}

/* ══════════════════════════════════════════════════════════════
   리포트 상세면 (2026-09-09 신설)
   서가의 카드를 누르면 이 면이 선다. 기사 상세면과 같은 뼈대를 쓰되
   메타표에 자료발간일·키워드·첨부파일이 더 붙는다.
   ══════════════════════════════════════════════════════════════ */
.rep a.rtt{text-decoration:none; color:var(--ink)}
.rep a.rtt:hover{color:var(--accent)}
.rep a.rtt:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.kws{display:flex; flex-wrap:wrap; gap:5px}
.kw{display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
  padding:1px 6px; border-radius:2px; background:var(--accent-soft);
  border:1px solid var(--accent); color:var(--accent); white-space:nowrap}
a.file{display:inline-flex; align-items:center; gap:8px; text-decoration:none;
  padding:7px 11px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink2); font-size:12.5px; margin:0 6px 6px 0}
a.file:hover{border-color:var(--accent); background:var(--accent-soft)}
a.file .ext{font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600;
  letter-spacing:.06em; padding:2px 5px; border-radius:2px;
  background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn)}
a.file .ext.html{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

/* 공개 아카이브의 항목 제목 — 누르면 그 기사의 상세면이 선다 (2026-09-09) */
a.alink{color:var(--ink); text-decoration:none; font-weight:600;
  border-bottom:1px solid var(--line)}
a.alink:hover{color:var(--accent); border-bottom-color:currentColor}
a.alink:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* 상세면이 서는 동안 탭을 감춘다. nav.tabs 의 display:flex 가 브라우저 기본
   [hidden]{display:none} 을 이기므로 여기서 다시 눌러 준다 — 이걸 빼면 상세면 위에
   탭이 남고, 눌러도 뒤에 가린 목록만 바뀌어 아무 일도 안 일어난 것처럼 보인다. */
nav.tabs[hidden]{display:none !important}


/* ── 1면 상단 배너 — `banner.py` 가 만든다. 손으로 고치지 마라 ──────
   제호 블록(.top) 자체를 배너로 쓴다. 띠를 따로 세우면 제호와 띠가 같은 것을
   두 번 말하게 되고, 그림 안의 글자와 h1 이 겹쳐 보인다.

   **body.pub 으로 묶는다** — 공개 1면(newsletter.html)에만 걸고 관리용 화면에는
   걸지 않는다. 배너가 후보풀·미확정 화면까지 덮으면 작업 화면과 지면의 경계가
   흐려지고, 화면마다 그림 무게가 붙는다.

   그림이 띠를 꽉 채운다(배율 0.9818). 원본 308~552 을 잘라 썼다.

   그림은 data URI 다. 배포본이 파일 한 장이라 바깥 파일을 참조할 수 없다. */
body.pub .top{
  position:relative; margin:20px 0 0; padding:0; min-height:240px;

body.pub .top::before{content:""; position:absolute; inset:0; z-index:0;
  background:linear-gradient(90deg, rgba(10,14,13,.93) 0%, rgba(10,14,13,.84) 40%,

/* 테마 단추는 배너 오른쪽 **아래**다. 위 오른쪽은 그림의 글자 자리라 덮는다. */

  color:rgba(255,255,255,.92)}
body.pub .top .themetog:hover{border-color:#FFFFFF; color:#FFFFFF}

/* 좁은 화면 — 띠 높이를 글자에 맡긴다(min-height 를 풀면 내용만큼만 선다).
   폭 390 에서는 발행처 줄이 두 줄로 접히므로 글자 폭을 묶고 막을 넓혀
   그림이 글자 밑으로 들어오지 않게 한다. */
@media (max-width:520px){
  body.pub .top{min-height:0}
  body.pub .top .grow{padding:16px 16px 32px}
  body.pub .top .eyebrow{padding-right:78px}
  body.pub .top::after{left:16px; bottom:8px}
}

<script>
/* 공통 유틸 + 뉴스레터 렌더. 공개면·내부면이 함께 쓴다.
   ES 모듈이 아니다 — file:// 에서 module 은 CORS 로 막힌다. */
window.AI4S = window.AI4S || {};

(function (A) {
  'use strict';

  A.SECTIONS = ['해외 정책·전략', '연구인프라·컴퓨팅', '과학 AI 모델·자율실험', '과학적 성과',
                '산업·투자·국제협력', '연구제도·윤리·평가', '국내 연구현장·기관'];
  A.BAR = '━━━━━━━━━━━━━━━';
  A.NONE_LINE = '▷ 금일 AI4S 관련 주요기사 없음';
  A.NONE_HEAD = '금일 주요기사 없음';
  A.PW_SECTION = 5;

  A.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };
  A.$ = function (sel, root) { return (root || document).querySelector(sel); };
  A.$$ = function (sel, root) { return [].slice.call((root || document).querySelectorAll(sel)); };
  A.qs = function (k) { return new URLSearchParams(location.search).get(k); };

  A.fmtDate = function (iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return p.length === 3 ? p[0] + '.' + (+p[1]) + '.' + (+p[2]) : iso;
  };
  A.md = function (iso) {           // 2026-08-30 → 8/30
    var p = String(iso || '').split('-');
    return p.length === 3 ? (+p[1]) + '/' + (+p[2]) : iso;
  };

  /* 오늘 날짜(Asia/Seoul). toISOString() 은 UTC 라서 쓰면 안 된다 —
     발송본을 조립하는 08:20 KST 는 UTC 로 아직 전날이고, 하필 매일 쓰는 그 시각에 하루가 어긋난다. */
  A.todayKST = function () {
    var d = new Date(Date.now() + 9 * 3600 * 1000);
    return d.getUTCFullYear() + '-'
      + String(d.getUTCMonth() + 1).padStart(2, '0') + '-'
      + String(d.getUTCDate()).padStart(2, '0');
  };

  /* 테마 토글. 세 상태를 돈다 — 시스템 → 라이트 → 다크 → 시스템.
     localStorage 는 사생활 보호 모드에서 던지므로 반드시 감싼다. */
  A.initTheme = function () {
    var K = 'ai4s-theme';
    var cur = '';
    try { cur = localStorage.getItem(K) || ''; } catch (e) { cur = ''; }
    if (cur) document.documentElement.setAttribute('data-theme', cur);
    var btn = A.$('#themetog');
    if (!btn) return;
    var label = function () {
      var v = document.documentElement.getAttribute('data-theme') || '';
      btn.textContent = v === 'light' ? '라이트' : v === 'dark' ? '다크' : '시스템';
    };
    label();
    btn.addEventListener('click', function () {
      var v = document.documentElement.getAttribute('data-theme') || '';
      var next = v === '' ? 'light' : v === 'light' ? 'dark' : '';
      if (next) document.documentElement.setAttribute('data-theme', next);
      else document.documentElement.removeAttribute('data-theme');
      try { next ? localStorage.setItem(K, next) : localStorage.removeItem(K); } catch (e) { /* 무시 */ }
      label();
    });
  };

  /* 발송본 조립. newsletter.py 와 글자 단위로 같은 결과를 내야 한다 —
     담당자가 화면에서 보는 것과 붙여넣는 것이 다르면 화면을 믿지 않게 된다. */
  A.buildEdition = function (date, cands, approvedIds, opens, meta) {
    meta = meta || {};
    var picked = cands.filter(function (c) { return approvedIds.indexOf(c.id) >= 0; });
    picked.sort(function (a, b) {
      return (a.sec - b.sec)
        || ((b.pw ? 1 : 0) - (a.pw ? 1 : 0))
        || ((b.K + b.N + b.C + b.M) - (a.K + a.N + a.C + a.M));
    });
    var out = [A.BAR, '[' + A.md(date) + ' 조간] AI for Science 주요동향', A.BAR];
    /* 빈 섹션은 내보내지 않고, 워치리스트도 발송본에 넣지 않는다 (2026-08-31 지시).
       newsletter.py 와 글자 단위로 같아야 하므로 두 곳을 반드시 같이 고친다.
       워치리스트는 없어진 것이 아니라 A.watchList() 가 그리는 관리용 패널로 옮겼다. */
    A.SECTIONS.forEach(function (name, idx) {
      var i = idx + 1;
      var items = picked.filter(function (c) { return c.sec === i; });
      if (items.length) {
        out.push('');
        out.push('◆ ' + name + ' (' + items[0].hl + ')');
        items.forEach(function (c) { out.push('▷ ' + c.t + '… ' + c.body + ' (' + c.src + ')'); });
      }
      /* ※ picked.world 집계 줄도 발송본에서 뺐다 — 우리 작업 기록이라
         pool.html 의 필터 결과 패널에만 둔다. newsletter.py 와 같이 고칠 것. */
    });
    out.push('');
    out.push(A.BAR);
    out.push('picked.world ' + (meta.pw || 0) + '건 + 자체수집 ' + (meta.own || 0) + '건 = 후보 '
      + cands.length + '건 중 ' + picked.length + '건 승인');
    out.push((A.config && A.config.publisher) || '(발행처 미정)');
    out.push(A.BAR);
    return out.join('\n');
  };

  /* 워치리스트 — 발송본에서 빠진 뒤 이 패널이 유일한 노출 지점이다.
     '인용 금지'·'원문 미확보' 같은 내부 메모라 관리용 화면에만 그린다. */
  A.watchList = function (opens) {
    var w = (opens || []).filter(function (o) { return o.watch && o.st !== '해소'; });
    w.sort(function (a, b) {
      var x = a.due || '￿', y = b.due || '￿';
      return x < y ? -1 : x > y ? 1 : 0;

    rows.forEach(function (rw, ri) {

        return cell(i + 1, ri + 2, v, 2);
      }).join('') + '</row>';
    });

    if (cols.length) {
      xml += '<autoFilter ref="A1:' + colRef(cols.length) + (rows.length + 1) + '"/>';
    }
    xml += '</worksheet>';

    var files = [
      { name: '[Content_Types].xml',
        data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'

          + '<Default Extension="xml" ContentType="application/xml"/>'
          + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
          + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
          + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'

      { name: '_rels/.rels',

          + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
          + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
          + '</Relationships>' },
      { name: 'xl/workbook.xml',
        data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
          + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
          + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
          + '<sheets><sheet name="' + xesc(sheet) + '" sheetId="1" r:id="rId1"/></sheets></workbook>' },
      { name: 'xl/_rels/workbook.xml.rels',
        data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
          + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
          + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
          + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
          + '</Relationships>' },
      { name: 'xl/styles.xml',
        data: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
          + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
          + '<fonts count="2">'
          + '<font><sz val="10"/><name val="맑은 고딕"/></font>'
          + '<font><b/><sz val="10"/><name val="맑은 고딕"/></font></fonts>'
          + '<fills count="2"><fill><patternFill patternType="none"/></fill>'
          + '<fill><patternFill patternType="gray125"/></fill></fills>'
          + '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
          + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
          + '<cellXfs count="3">'
          + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
          + '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'
          + '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1">'
          + '<alignment vertical="top" wrapText="1"/></xf>'
          + '</cellXfs>'
          + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
          + '</styleSheet>' },

    ];

    var blob = zipStore(files);
    var fname = (opts.file || 'export') + '.xlsx';
    if (window.navigator && navigator.msSaveBlob) { navigator.msSaveBlob(blob, fname); return; }
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = fname; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      if (a.parentNode) { a.parentNode.removeChild(a); }

window.AI4S.editions = [{"date": "2026-09-18", "items": [{"sec": 1, "t": "美 에너지부, 과학용 내결함성 양자컴퓨터 개발 공모 개시", "k": "제네시스 미션의 양자 축이 2억 1,500만 달러 규모 공모로 구체화됐다", "ez": "양자컴퓨터는 계산 도중 오류가 쌓이는 문제로 실제 연구에 쓰기 어려웠음. 오류를 스스로 바로잡는 「내결함성」 단계에 올라서야 과학 문제를 풀 수 있고, 미 에너지부가 목표로 삼은 것이 그 단계임.\n\n에너지부 과학국이 9월 17일 그 개발을 맡을 기업을 뽑는 공모를 열었음. 총 2억 1,500만 달러를 걸고 10곳 안팎을 선정하며 마감은 10월 19일임. 대상은 미국 내 영리기업이고 건당 상한은 2억 달러임.\n\n이 공모는 제네시스 미션의 양자 축에 해당함. 에너지부는 6월에 `Quantum Genesis` 이니셔티브를 발표하면서 2028년까지 논리 큐비트 수백 개 규모를 시연하고 화학·재료과학·플라즈마물리에 적용하겠다고 밝힌 바 있음. 공고문은 불참하거나 목표를 채우지 못해도 이후 협력에서 배제하지 않는다고 적었음.", "body": "美 에너지부 과학국이 9월 17일 내결함성 양자컴퓨터 개발 공모 `DE-FOA-0003657` 을 개시했음, 공고명은 `The DOE Quantum Genesis Q Competition` 이고 마감은 10월 19일이며 정보 설명회는 9월 25일로 제시됨, 총 예산은 2억 1,500만 달러(약 2,900억 원)이고 선정 예상 건수는 10건이며 건당 상한은 2억 달러·하한은 25만 달러로 적혔음, 신청 자격은 미국 내 영리기업이고 중소기업이 포함되며 지원 수단은 보조금이 아니라 그 밖의 방식으로 분류됐음, 공고문은 과학적으로 유의미한 내결함성 양자컴퓨팅(`SRQC`) 능력을 세계 최초로 개발·배치하는 것을 목표로 제시하고 이를 제네시스 미션의 기초 기둥으로 규정했음, 경쟁은 두 단계로 구성된 것으로 보도됐고 1단계는 초기 마일스톤에 신청자당 최대 150만 달러, 2단계는 논리 큐비트 100개를 달성한 기업이 나누는 일반 인센티브 1억 달러이며 논리 큐비트 150개와 200개에 각각 5,000만 달러의 보너스가, 하드웨어 중립 검증 테스트베드에 4,500만 달러가 별도로 제시됐음, 다만 보도가 전한 단계별 금액의 합은 공고문의 총액과 맞지 않으므로 배분 구조는 공고문 본문으로 다시 확인해야 함, 다리오 힐 에너지부 차관은 논리 큐비트 100개 달성 시점을 2028년 초로 제시했고 평가에서 규모 확장으로 가는 실질적 경로를 증명하도록 요구한다고 밝힌 것으로 전해짐, `Quantum Genesis` 이니셔티브 자체는 6월 23일 발표됐고 2028년까지 논리 큐비트 수백 개 규모의 시연을 목표로 화학·재료과학·플라즈마물리·고에너지물리 적용을 제시한 바 있음, 공고문은 불참하거나 마일스톤을 완수하지 못해도 향후 협력이나 조달에서 배제되지 않는다고 명시했음", "src": "美 에너지부 과학국 공고 9.17 · grants.gov 공고문 · FedScoop 보도 9.17", "pd": "2026-09-17", "url": "https://science.osti.gov/Funding-Opportunities", "durl": "https://www.grants.gov/search-results-detail/363869", "murl": "https://fedscoop.com/quantum-genesis-q-competition-energy-department/"}, {"sec": 3, "t": "노화 연구 특화 언어모델과 17개 평가 과제 공개", "k": "분야에 맞춘 모델이 범용 최상위 모델을 앞서는 영역이 수치로 제시됐다", "ez": "사람마다 실제 나이와 몸의 상태가 다르다는 것은 오래 알려진 사실이나, 노화가 무엇인지 연구계가 아직 한 가지로 정의하지 못했음. 그래서 노화 연구에 인공지능을 쓰려 해도 무엇을 잘하는 것이 잘하는 것인지 정할 기준이 없었음.\n\n이번에 공개된 체계는 그 기준을 함께 제시했음. 노화 생물학 자료로 학습한 언어모델과 성능을 재는 17개 과제, 그리고 이용 창구 셋으로 구성됨. 저자들이 이 기준으로 측정한 결과 노화에 맞춘 모델이 훨씬 큰 범용 상용 모델을 여러 시험에서 앞섰음.\n\n다만 모든 시험에서 앞선 것은 아니며, 노화의 정의가 서 있지 않다는 근본 문제는 그대로 남아 있음.", "body": "`Nature` 가 9월 17일 노화 생물학 연구를 겨냥한 인공지능 체계를 소개했음, 근거 논문은 Zhavoronkov 등이 `Nature Biotechnology` 에 게재한 것이며 식별자는 `10.1038/s41587-026-03286-y` 임, 체계는 셋으로 구성되고 노화 생물학 자료로 학습한 대형 언어모델, 성능을 재는 17개 과제 벤치마크, 이용 인터페이스임, 저자들은 자체 벤치마크로 특화 모델과 OpenAI·DeepSeek 등이 낸 대형 상용 모델을 함께 평가했고 전부는 아니나 다수 시험에서 노화 연구에 맞춘 모델이 더 나은 결과를 냈다고 제시했음, 하버드 의대 Marinka Zitnik 은 이 연구에 참여하지 않았으며 차세대 인공지능 모델 개발에 시사점을 준다고 평가했음, 다만 기사는 노화라는 개념 자체가 연구계에서 아직 정의되지 않아 암처럼 과제를 명확히 규정하기 어렵다는 점을 한계로 적었고, 생물학적 나이를 재는 여러 「시계」가 정교해지고 있으나 결과를 해석할 기준이 서 있지 않다는 점도 함께 제시했음", "src": "Nature · Nature Biotechnology", "pd": "2026-09-17", "url": "https://www.nature.com/articles/d41586-026-02913-7", "durl": "https://doi.org/10.1038/s41587-026-03286-y"}, {"sec": 3, "t": "스탠퍼드대, 에이전트 3만 7,000개로 신약 후보 발굴하는 체계 공개", "k": "임상시험 5만여 건을 분석해 폐암 표적과 공격 전략까지 제시했다", "ez": "신약 개발은 표적을 정하고 물질을 찾고 시험을 설계하는 여러 단계로 나뉘며, 단계마다 다른 전문성이 필요함. 그래서 인공지능을 쓰더라도 한 모델이 전 과정을 맡기는 어려웠음.\n\n스탠퍼드대 연구팀이 `Science` 에 발표한 `Virtual Biotech` 는 그 구조를 회사 조직처럼 나눈 것임. 최대 3만 7,000개의 에이전트가 부서별로 배치되고 최고과학책임자 역할의 에이전트가 이들을 지휘함. 연구팀은 임상시험 5만 5,000건 이상을 분석하게 했고, 특정 세포 유형에서 활성인 단백질을 겨냥한 약물이 시장에 도달할 확률이 약 50% 높다는 결과를 얻었음.\n\n폐암 시연에서는 단백질 `CD276` 을 표적으로 확인하고 항체에 항암제를 결합하는 전략까지 제시했음. 다만 이 예측은 실험으로 확인되지 않았고 실제 개발 현장에서 검증된 바도 없음.", "body": "스탠퍼드대 제임스 저우 교수 연구팀이 신약 발굴을 수행하는 에이전트 체계 `Virtual Biotech` 를 9월 17일 `Science` 에 게재했음, 제1저자는 Zhang, H. G. 이고 공동저자에 어제 지면에 오른 `Paper2Agent` 의 제1저자 자청 먀오가 포함됨, 체계는 최대 3만 7,000개 에이전트로 구성되고 최고과학책임자 역할의 에이전트가 표적 발굴·임상시험 설계 등 부서별 에이전트를 지휘하는 생명공학기업 조직을 본떴음, 기반 모델로는 앤트로픽의 `Claude` 계열을 썼고 연구팀은 연구자가 자체 전산자원에서 구동하는 공개 가중치 모델을 포함해 성능이 높은 어떤 대형 언어모델이라도 쓸 수 있다고 밝혔음, 검증에서는 여러 질환의 약물을 대상으로 수행된 임상시험 5만 5,000건 이상의 공개 결과를 분석하게 했고, 특정 세포 유형에서 활성인 단백질을 표적으로 삼은 약물이 그 밖의 약물보다 시장 진입 확률이 약 50% 높다는 결과를 얻었음, 별도 시연에서는 폐암 표적으로 단백질 `CD276` 의 적합성을 조사하도록 지시했고 체계는 기존 자료로 후보를 확인한 뒤 `CD276` 을 인식하는 항체에 항암제를 결합하는 공격 전략을 제시했으며 외부 검토자의 검토를 거쳐 유망한 경로로 결론지었음, 다만 이 체계는 실제 신약 발굴 현장에서 검증된 바 없고 제시한 예측이 실험으로 확인되지 않았으며 임상시험은 수행되지 않았음", "src": "Nature · Science", "pd": "2026-09-17", "url": "https://www.nature.com/articles/d41586-026-02954-y", "durl": "https://doi.org/10.1126/science.aeg6779"}, {"sec": 6, "t": "OpenAI 난제 해결 주장을 둘러싸고 공로 귀속 논쟁 확산", "k": "연구자가 챗봇에 올린 착상의 몫을 어떻게 적을지가 쟁점이 됐다", "ez": "수학에서는 논의 과정에서 얻은 착상에도 공로를 인정해 왔음. 그런데 그 논의 상대가 사람이 아니라 챗봇이면 착상이 어디서 왔는지 되짚을 방법이 없음.\n\nOpenAI 가 9월 8일 유체역학의 오랜 난제인 나비에·스토크스 문제를 인공지능으로 풀었다고 발표하면서 이 물음이 드러났음. 같은 문제를 OpenAI 와 앤트로픽의 도구로 연구하던 뉴욕대·하버드대 수학자들이 회사 모델이 자신들의 대화에서 배웠을 수 있다고 제기했고, OpenAI 는 7월 3일 이후의 사용자 입력이 영향을 줄 수 없었다고 답했음.\n\n제기한 연구자는 자신의 챗봇 계정 세 개 가운데 두 개에서만 대화를 학습에 쓰지 않도록 설정해 두었다고 밝혔음. 필즈상 수상자 25명도 공개서한에서 공로 귀속이 흐려진다고 지적했음.", "body": "`Nature` 가 9월 17일 OpenAI 의 나비에·스토크스 문제 해결 주장을 둘러싼 공로 귀속 논쟁을 보도했음, OpenAI 는 9월 8일 인공지능 모델로 이 유체역학 난제를 풀었다고 발표했음, 같은 문제의 한 측면을 OpenAI 와 앤트로픽의 도구를 써서 연구하던 뉴욕대 트리스탄 벅마스터와 하버드대 레벤트 알푀게가 있었고, 벅마스터는 회사가 자신들의 연구를 전해 듣고 이 문제에 뛰어들었으며 모델이 자신들의 챗봇 대화에서 학습했을 가능성이 있다고 사회관계망에 적었음, OpenAI 대변인은 조사 결과 7월 3일 이후의 어떤 사용자 입력도 이 체계에 영향을 줄 수 없었다고 확신한다고 `Nature` 에 밝혔고 9월 1일 작업을 시작했으며 어떤 경로로도 그들의 연구를 보지 않았다고 답했음, 벅마스터는 자신이 OpenAI 챗봇 계정 세 개를 쓰고 있었고 그 가운데 두 개에서만 대화를 학습에 쓰지 않도록 설정했다고 밝혔음, 필즈상 수상자 25명은 인공지능 기업의 수학 난제 진입을 비판하는 공개서한에서 인공지능 도구가 적절한 공로 귀속을 흐린다고 적었음, 런던정경대 지식재산권법 연구자 루크 맥도나는 학술 연구자들이 개인 인공지능 계정에 자료와 지식을 올리는 일의 결과를 충분히 파악하지 못했을 수 있다고 지적했음, 클레이수학연구소가 이 문제에 100만 달러의 상금을 걸어 두었고 해결이 독립적으로 확인된다면 수학계가 공로와 상금을 어떻게 배분할지가 남은 문제로 제시됐음", "src": "Nature", "pd": "2026-09-17", "url": "https://www.nature.com/articles/d41586-026-02910-w"}]}, {"date": "2026-09-17", "items": [{"sec": 3, "t": "스탠퍼드대, 논문을 대화형 AI 에이전트로 자동 변환하는 체계 발표", "k": "논문에 담긴 방법을 설치 과정 없이 자기 자료에 적용할 수 있게 된다", "ez": "연구 논문은 독자가 내용을 직접 해석해 자신의 연구에 적용해야 하는 문서임. 논문에 수반된 프로그램을 활용하려면 실행 환경을 구성하고 사용법을 습득해야 하므로, 방법이 공개돼 있어도 실제 활용까지 상당한 시간이 소요됨.\n\n스탠퍼드대 연구진이 제시한 것은 이 과정을 자동화하는 프로그램 Paper2Agent 임. 논문과 이에 수반된 코드를 분석해, 논문이 제공하는 기능을 외부에서 호출할 수 있는 형태로 표준화함. 이렇게 구성한 결과물을 대화형 인공지능에 연결하면 사용자는 일상 언어로 해당 논문의 방법을 자신의 데이터에 적용하도록 요청할 수 있음.\n\n검증에는 유전체 해석 도구 AlphaGenome 과 단일세포·공간 전사체 분석 도구 Scanpy·TISSUE 를 다룬 논문을 사용했고, 원 논문이 제시한 결과가 그대로 재현됨. 연구진은 이렇게 생성한 도구를 상호 연결해 주의력결핍 과잉행동장애와 연관된 새로운 유전자 변이를 확인했다고 밝힘.", "body": "스탠퍼드 의대가 연구논문을 대화형 AI 에이전트로 자동 변환하는 프로그램 페이퍼투에이전트를 개발했다고 9월 16일 밝히고 같은 날 Nature 에 논문을 게재함, 제1저자는 자청 먀오 박사후연구원이고 교신저자는 제임스 저우 생의료데이터과학 부교수이며 공동저자 소속은 스탠퍼드대 유전학과·생의료데이터과학과·전기공학과·생물학과·컴퓨터과학과임, 변환된 에이전트는 논문의 가상 교신저자 역할을 하며 원고·보충자료·데이터셋·코드·작업흐름을 정적 텍스트가 아니라 에이전트가 직접 호출할 수 있는 지식으로 노출함, 변환 절차는 복수의 작업 에이전트가 논문과 그에 딸린 코드·데이터를 가상 환경에서 처음부터 재현해 보면서 시약·실험 구성·실행 방법처럼 독자가 직접 찾아내야 했던 요령을 포착하고 그 지식을 모델 컨텍스트 프로토콜 서버로 저장한 뒤 시험을 생성·실행해 견고성을 높이는 방식임, 검증 사례는 유전체 변이를 해석하는 알파지놈 기반 에이전트와 단일세포·공간 전사체를 분석하는 스캔파이·티슈 기반 에이전트이고 원 논문의 결과를 재현하면서 새로운 질의도 수행함, 게재본은 여러 에이전트가 협력해 건선의 원인 유전자를 우선순위화한 사례를 제시하고 발표문은 주의력결핍 과잉행동장애 유전체 연구 에이전트와의 협력으로 MPHOSPH9 유전자 부근의 보고되지 않았던 변이를 확인한 사례를 제시함, 지금까지 만들어진 논문 에이전트는 100개가 넘으며 저우는 궁극적으로 대부분의 원고가 짝이 되는 논문 에이전트를 갖기를 기대한다고 밝힘", "src": "스탠퍼드 의대 발표 9.16 · Nature 게재 9.16 · TechXplore 보도 9.16", "pd": "2026-09-16", "url": "https://med.stanford.edu/news/all-news/2026/09/ai-agents-talk.html", "durl": "https://www.nature.com/articles/s41586-026-11044-y", "murl": "https://techxplore.com/news/2026-09-manuscripts-ai-agents-discoveries.html"}, {"sec": 5, "t": "노보노디스크, 신약 연구개발 공정에 앤트로픽 AI 도입", "k": "제약사가 연구 판단의 일부를 인공지능 에이전트에 맡기기 시작했다", "ez": "신약 개발은 후보 물질을 선별하고 실험으로 검증하는 과정을 장기간 반복하는 작업임. 노보노디스크는 이 과정의 일부를 인공지능에 위임하기로 하고 앤트로픽과 협력한다고 밝힘.\n\n적용 대상은 자사 연구진이 직접 선정한 과제임. 유전체나 단백질 데이터를 해석하고 실험 설계를 보완하는 것처럼 생물학적 추론이 필요한 작업에 인공지능을 적용하고, 해당 작업에 맞춘 도구를 공동 개발하기로 함. 활용 도구는 앤트로픽이 6월 공개한 연구자용 작업대 Claude Science 임.\n\n다만 공개된 범위는 협력 사실까지임. 계약 금액과 기간, 자사 연구데이터의 활용 범위는 밝히지 않음. 노보노디스크는 올해 이미 다른 인공지능 기업과도 계약했고 앤트로픽 역시 다른 제약사와 유사한 계약을 체결한 바 있어, 제약사와 인공지능 기업의 제휴가 이어지고 있음.", "body": "덴마크 제약기업 노보노디스크가 9월 16일 앤트로픽과 협력해 자사 연구개발 공정에 앤트로픽의 AI 모델과 과학 연구용 작업대 클로드 사이언스를 도입한다고 밝힘, 클로드 사이언스는 앤트로픽이 6월 30일 공개한 연구자용 도구로 총괄 조정 에이전트가 유전체·단일세포 분석·프로테오믹스·구조생물학·케모인포매틱스에 맞춰 준비된 60개 이상의 기능과 연결기를 호출하는 구조이며 별도의 검토 에이전트가 인용과 계산을 확인하고 수행한 코드·실행환경·작업 이력을 감사 가능한 형태로 남긴다고 밝힌 바 있고 현재 베타 단계임, 적용 범위는 노보노디스크의 과학자와 전산 연구팀이 지목한 신약 발견 과제이며 생물학적 추론을 지원하는 특정 과학 문제와 작업 흐름에 맞춘 해법을 함께 개발하기로 함, 소프트웨어 개발 역량 강화도 협력 범위에 포함됨, 마이크 두스타르 최고경영자는 AI 가 연구개발 생산성을 높이고 연구에서 시판까지의 경로를 단축할 수 있다고 밝힘, 다리오 아모데이 앤트로픽 최고경영자는 AI 능력의 향상이 한 세기 분량의 생물·의학 혁신을 10년으로 압축할 잠재력을 가져온다고 밝힘, 계약 규모와 기간, 재정 조건은 공개되지 않음, 노보노디스크는 같은 해 앞서 오픈AI 와도 계약했고 아마존웹서비스와 AI 거점을 설립한 바 있으며 앤트로픽은 브리스톨마이어스스퀴브와 유사한 계약을 맺은 바 있음", "src": "노보노디스크 발표 9.16 · 앤트로픽 제품 발표문 · Euronews 보도 9.16", "pd": "2026-09-16", "url": "https://www.novonordisk.com/news-and-media/news-and-ir-materials/news-details.html?id=916768", "durl": "https://www.anthropic.com/news/claude-science-ai-workbench", "murl": "https://www.euronews.com/health/2026/09/16/danish-pharma-giant-novo-to-use-anthropics-claude-to-advance-ai-drug-discovery"}, {"sec": 4, "t": "오크리지국립연구소, 생성 AI 로 양자 최적화 회로 직접 생성", "k": "문제 규모가 커져도 계산 시간이 늘지 않는 구조로 바뀌었다", "ez": "양자컴퓨터로 최적화 문제를 해결할 때는 계산 회로를 구성한 뒤 변수를 조금씩 조정하며 실행과 측정을 반복해 최적 설정을 탐색함. 이 반복이 병목이어서, 분할한 부분문제의 규모가 커질수록 소요 시간이 급격히 증가하는 것이 제약이었음.\n\n연구진은 이 조정 과정을 제거함. 사전 학습한 생성모델이 회로를 직접 생성하도록 하고, 생성된 후보를 정해진 수만큼만 평가해 선택하는 방식으로 전환함.\n\n결정변수 100개 규모의 문제로 시험한 결과 계산 비용이 크게 감소했고, 부분문제가 클수록 이득이 확대됨. 회로 생성부터 평가까지 전 과정을 합산한 시간이 문제 규모와 거의 무관하게 일정하게 유지됨. 다만 이번 시험은 실제 양자장치가 아니라 고성능 GPU 로 양자 동작을 모사한 환경에서 수행됨.", "body": "아이온큐가 9월 16일 오크리지국립연구소·엔비디아·테네시대 녹스빌과 함께 생성형 AI 가 양자 최적화 회로를 직접 작성하는 방법을 제시했다고 밝힘, 연구의 제1기관은 오크리지국립연구소 국립계산과학센터이고 제1저자는 김성민이며 아이온큐는 공동저자로 참여함, 방법의 이름은 디쿠아오아지피티이고 큰 최적화 문제를 부분문제로 쪼개는 분산 양자근사최적화알고리즘에 지피티 기반 회로 생성을 결합한 것임, 기존 방식은 회로의 매개변수를 실행·측정·조정하며 되풀이해야 해서 부분문제가 커질수록 변분 루프가 병목이 되는 구조였음, 새 방법은 학습된 생성모델이 부분문제마다 회로를 바로 만들어 내고 후보를 정해진 수만큼만 평가해 반복 조정을 대체함, 시험 대상은 결정변수 100개 규모의 조밀한 고차 이진최적화 문제이며 논문은 계산비용이 크게 줄고 해의 품질은 경쟁력을 유지했으며 부분문제가 클수록 가속이 커졌다고 밝힘, 보고된 실행시간에는 그래프 사영·임베딩 계산·토큰 생성·생성된 후보 회로 시뮬레이션·재평가까지 전 과정이 포함되며 부분문제 크기가 커져도 거의 일정하게 유지됨, 실행 환경은 엔비디아 에이치200 그래픽처리장치 8기를 얹은 에이치피이 크레이 노드에서 쿠다-큐 개발도구와 큐퀀텀 백엔드로 수행한 시뮬레이션이며 양자 하드웨어에서 실행한 결과가 아님, 논문은 7월 22일 arXiv 에 공개됐고 9월 13일부터 18일까지 토론토에서 열린 아이트리플이 퀀텀위크에서 발표돼 최우수논문상을 받음", "src": "아이온큐 발표 9.16 · 오크리지국립연구소 등 논문 7.22 · The Quantum Insider 보도 9.16", "pd": "2026-09-16", "url": "https://www.ionq.com/news/ionq-ornl-nvidia-and-the-university-of-tennessee-knoxville-show-ai-method-reduces-quantum-optimization-trade-off", "durl": "https://arxiv.org/abs/2607.20225", "murl": "https://thequantuminsider.com/2026/09/16/ionq-ornl-nvidia-tennessee-ai-quantum-optimization-tradeoff/"}, {"sec": 4, "t": "시티오브호프, 혈액 지표 통합 AI 점수로 췌장암 조기 검출 국제 검증", "k": "수술이 가능한 초기 단계에서 췌장암을 찾아낼 길이 넓어졌다", "ez": "췌장암은 초기 증상이 거의 없어 발견 시점에는 수술이 어려운 경우가 많음. 혈액으로 조기에 검출하려는 시도가 이어졌으나 단일 지표만으로는 정확도가 충분하지 않았음.\n\n이번에 검증한 PANXEON 은 혈액에서 성격이 다른 지표를 동시에 측정함. 세포가 분비하는 짧은 유전물질인 마이크로RNA 열 종류와, 기존 검진에 사용하던 단백질 지표 CA19-9 임. 인공지능이 이 측정값을 통합해 환자별 위험도를 단일 점수로 산출함.\n\n4개국 1,785명을 대상으로 확인한 결과 초기 단계인 1·2기 췌장암의 86.8%를 검출함. 암이 없는데 있다고 판정한 비율은 일반 위험군 3.2%, 고위험군 15.6%였음. 암으로 진행하기 전 단계의 이상 조직도 64.3% 판별함. 연구진은 이 검사가 기존 영상검사를 대체하는 것이 아니라 정밀검사 대상자를 사전에 선별하는 용도라고 밝힘.", "body": "미국 시티오브호프가 주도한 국제 공동연구가 췌장암 조기 검출용 혈액검사 판시온의 검증 결과를 9월 16일 Nature Medicine 에 게재함, 교신저자는 시티오브호프 분자진단·실험치료학과 학과장 아제이 고엘이고 제1저자는 카이밍 쉬이며 저자는 33명임, 판시온은 혈액 속 마이크로리보핵산 10종의 신호에 췌장암 단백질 지표 씨에이19-9 를 통합해 하나의 복합점수를 내는 구조이고 세 종류의 지표를 한 검사로 묶은 것은 처음으로 제시됨, 시험은 네 개 나라 1,785명을 대상으로 한 국제 다기관 전향적 관찰연구임, 마이크로리보핵산 신호만으로는 시험군에서 곡선하면적 88.6%와 조기 췌장암 민감도 83.8%를 보였고 다른 소화기암과의 교차반응은 미미했음, 씨에이19-9 를 결합한 최종 검사는 1·2기 췌장암 민감도 86.8%, 위양성률은 저위험 대조군 3.2%·고위험 대조군 15.6%였음, 고위험 췌장낭종 보유자의 고등급 이형성증은 64.3% 검출함, 19명 코호트에서는 수술 전 항암치료 중과 수술 뒤에 신호가 낮아지고 재발 전에 높아짐, 임상시험 등록번호는 NCT06388967 임, 발표문은 췌장암이 모든 암 가운데 생존율이 가장 낮아 진단 뒤 5년 생존 환자가 14%에 그치고 환자의 약 90%가 이미 전이된 진행 단계에서 종양이 발견된다고 밝힘, 검사가 겨냥하는 대상은 유전적 위험이나 가족력이 있는 사람과 췌장낭종·만성췌장염 보유자이며 현재 이들에게 쓰이는 영상검사가 침습적이고 비용이 크며 초기 검출에 한계가 있다는 점을 근거로 듦, 연구진은 영상검사나 확진검사를 대체하는 것이 아니라 추가 정밀검사가 필요한 고위험군을 선별하는 용도를 제시했고 대규모 전향연구가 더 필요하다고 밝힘", "src": "Nature Medicine 게재 9.16 · 시티오브호프 보도자료 · 동아사이언스 보도 9.17", "pd": "2026-09-16", "url": "https://www.nature.com/articles/s41591-026-04625-x", "durl": "https://www.cityofhope.org/research/research-news/new-study-blood-test-shows-promise-for-detecting-pancreatic-cancer-at-its-earliest-stages", "murl": "https://www.dongascience.com/ko/news/79946"}, {"sec": 6, "t": "미국 연구자들, 국립보건원 연구비 낱말 심사에 위헌 소송 제기", "k": "연구 주제를 금지어로 걸러 온 심사 방식이 법정에서 다투어진다", "ez": "미국 국립보건원은 보건 분야 세계 최대의 연구비 지원 기관임. 연구자가 제출한 계획서를 심사해 지원 여부를 결정하는데, 이 과정에서 특정 용어가 포함된 계획서를 별도로 선별해 왔다는 것이 이번 소송의 요지임.\n\n소장에 따르면 선별 기준이 된 용어는 235개임. 형평·다양성·성별·기후변화 등이 포함됐고, 해당 용어가 포함되면 과제 기술 방식을 수정하도록 요구받았다고 함.\n\n원고는 연구자 3인으로 각각 알츠하이머병과 성 평등, 신장질환을 연구함. 이들은 연구의 학술적 수준이 아니라 다루는 주제와 사용하는 표현으로 지원 여부가 결정되는 것은 표현의 자유를 침해하며, 우수성에 따라 연구비를 배분하도록 한 법의 취지에도 배치된다고 주장함.", "body": "미국시민자유연맹이 9월 16일 연구자들을 대리해 미국 국립보건원의 연구비 심사 방식에 대한 집단소송을 제기했다고 밝힘, 원고는 피츠버그대 정신의학과 부교수 앤 코언, 스탠퍼드대 의학과 임상부교수 아르가반 살레스, 펜실베이니아주립대 사회학·인구통계학 교수 조너선 카일 도 세 명임, 소송의 핵심 주장은 국립보건원이 금지 낱말 235개를 기준으로 연구계획서를 선별하고 과제 기술 방식의 변경을 요구해 왔다는 것이며 이것이 수정헌법 제1조의 표현의 자유와 과학적 우수성에 따라 연구비를 배분하도록 한 의회의 지시에 어긋난다고 주장함, 예시로 제시된 낱말은 형평·다양성·성별·기후변화·임신한 사람 등임, 소장은 과제 종료 요건에 관한 규정을 어겼고 심사 절차가 자의적이라는 주장도 함께 담음, 대리인단은 미국시민자유연맹과 북캘리포니아 지부·프로텍트 데모크라시·공익과학센터·제이컵슨 법률그룹임, 영향을 받은 연구비 규모와 과제 수는 보도자료에 제시되지 않음", "src": "미국시민자유연맹 발표 9.16 · 소장", "pd": "2026-09-16", "url": "https://www.aclu.org/press-releases/researchers-challenge-nih-screening-of-grants-for-disfavored-viewpoints", "durl": "https://www.aclu.org/documents/nih-class-action-complaint"}, {"sec": 6, "t": "Nature, AI 도구의 선행연구 인용 기준을 연구계와 함께 세울 것 요구", "k": "인공지능이 낸 성과에서 앞선 연구의 몫을 어떻게 적을지가 쟁점이 됐다", "ez": "인공지능이 연구 결과를 산출하는 사례가 늘면서, 그 결과가 어떤 선행 연구에 의존하고 있는지를 밝히는 문제가 제기됨. 연구자가 논문을 작성할 때는 참고한 연구를 인용으로 명시하지만, 인공지능 도구가 산출한 결과에는 그러한 장치가 없음.\n\n이 사설은 한 인공지능 기업이 9월 8일 오랜 수학 난제를 해결했다고 발표한 사안을 계기로 작성됨. 발표 12시간 전 두 수학자가 해당 기업과 다른 기업의 인공지능 도구를 활용해 그 문제의 부분해를 얻었다고 공개함. 이들은 자신들이 해당 기업의 도구와 주고받은 상호작용이 회사의 성과에 결정적이었을 수 있다고 밝혔고, 회사는 이를 부인함.\n\n사설이 지목한 근본 원인은 인공지능이 무엇을 어디서 학습했는지 자체적으로 기록하지 않는다는 점임. 그 결과 성과가 산출돼도 최초의 단서가 어디서 비롯됐는지 확인할 방법이 없음. 기준을 기업이 단독으로 정하지 말고 연구계와 공동으로 수립해야 한다는 것이 사설의 요구임.", "body": "국제학술지 Nature 가 9월 16일 AI 기업이 연구 커뮤니티와 협력해 성과 귀속을 보호해야 한다는 사설을 실음, 계기는 오픈AI 가 9월 8일 밀레니엄 문제의 하나인 나비에·스토크스 문제를 풀었다고 발표하면서 이 방정식이 특정 조건에서 붕괴할 수 있어 실제 유체에 신뢰할 수 없음을 보였다고 주장한 건임, 사설은 오픈AI 가 수백만 달러를 들인 이 결과를 수학계의 엄밀성 기준이 되어 가는 자동 검증 방식으로 확인했다고 밝혔음을 전하면서도 발표가 논문이 아니라 보도자료로 이루어진 점을 문제로 지적함, 발표 12시간 전 뉴욕대 수학자 트리스탄 버크마스터가 앤트로픽 소속 수학자 레번트 알푀게와 함께 오픈AI 와 앤트로픽의 AI 도구를 써서 같은 문제의 부분해를 얻었다고 사회연결망에 올렸고, 버크마스터는 두 사람이 오픈AI 의 코딩 에이전트 코덱스와 주고받은 상호작용이 회사의 성과에 결정적이었을 수 있다고 밝혔으며 오픈AI 는 이를 부인함, 사설이 지목한 구조적 원인은 신경망이 무엇을 어디서 어떻게 학습했는지를 스스로 기록하지 않는 블랙박스여서 성과의 단서가 어디서 왔는지를 확인하는 일이 사실상 불가능하다는 점임, 사설은 기술기업 안팎의 연구가 AI 모델을 똑똑하게 만든 이들에게 정당한 몫을 돌리지 않으면 과학 절차의 무결성이 위태로워진다고 밝힘", "src": "Nature 사설 9.16", "pd": "2026-09-16", "url": "https://www.nature.com/articles/d41586-026-02886-7"}]}, {"date": "2026-09-16", "items": [{"sec": 3, "t": "이화여대, 국내 대학 최대 규모 자율실험실 구축", "k": "AI와 로봇이 24시간 실험을 수행하는 소재 연구 설비가 대학에 집적된다", "ez": "이화여대가 신소재를 찾는 실험을 사람 대신 기계가 맡는 연구공간을 교내에 세운다고 밝힘. 규모는 약 1,920제곱미터로 농구장 네 개를 합친 넓이이며, 국내 대학이 갖춘 같은 종류의 설비 가운데 가장 크다고 설명함.\n\n작동 방식은 순환 구조임. 인공지능이 어떤 조건에서 실험할지 정하면 로봇이 재료를 섞어 물질을 만들고 분석 장비에 넣음. 그 결과를 인공지능이 다시 읽어 다음 실험 조건을 고쳐 잡는 과정이 하루 종일 끊기지 않고 이어짐.\n\n다루는 분야는 다섯이며, 구멍이 많아 기체를 가두는 물질과 전지 안에서 이온을 빠르게 옮기는 물질 등이 포함됨. 전고체전지 시제품을 사람 손을 거치지 않고 제조할 수 있는 건조실도 함께 들어섬.", "body": "이화여대가 9월 15일 교내 산학협력관에 약 1,920㎡ 규모의 AI·로봇 기반 자율실험실을 구축한다고 밝힘, 멀티스케일 물질 및 시스템 연구소(IMMS)의 핵심 인프라이며 이 연구소는 국가연구소 사업(NRL 2.0)에 선정돼 10년간 운영됨, 작동 방식은 AI 가 실험 조건을 설계하면 로봇이 합성과 분석을 수행하고 그 결과가 다시 설계로 되돌아가는 24시간 폐루프 구조임, 대상은 금속유기골격체·카이랄 나노입자·초이온전도체·전도성 고분자·카이랄 초분자 조립체 다섯 갈래이며 화학·공정·시간 규모가 서로 다른 소재 연구를 한 플랫폼에서 수행하는 것을 목표로 함, 전고체전지 셀을 자율적으로 제조할 수 있는 드라이룸을 포함함, 이향숙 총장은 반도체·차세대 전지·저가 수소 기술 개발을 목표로 제시함", "src": "이화여대 발표 9.15 · 파이낸셜뉴스 보도 9.15", "pd": "2026-09-15", "url": "http://www.ewha.ac.kr/ewha/news/ewha-news.do?mode=view&articleNo=366929&article.offset=0&articleLimit=10", "murl": "https://www.fnnews.com/news/202609151531500667"}, {"sec": 7, "t": "GIST·성균관대, 110억 원 규모 의료 AI 원천기술 개발 착수", "k": "질병 발견부터 일상 건강관리까지 단계별로 다른 AI를 하나로 잇는다", "ez": "광주과학기술원이 성균관대와 함께 의료 분야 인공지능의 바탕 기술을 개발하는 과제에 선정됐다고 밝힘. 정부가 지원하는 연구비는 110억 원이고 기간은 2026년 7월부터 2031년 12월까지임.\n\n핵심은 인공지능 하나로 모든 것을 처리하지 않고 쓰이는 자리에 따라 셋으로 나눈 점임. 첫째는 연구용으로, 유전자와 단백질 정보, 의료영상 같은 자료를 분석해 암과 뇌질환이 생기는 원리를 밝히고 새로운 치료 표적을 발굴함. 둘째는 진료용으로, 병원이나 장비가 달라져도 흔들리지 않게 진단과 치료 반응을 예측하고 그 근거와 불확실한 정도까지 함께 제시함. 셋째는 생활용으로, 손목시계형 기기와 집 안 센서가 모은 수면·활동 기록을 오래 분석해 이상 신호를 일찍 발견함.\n\n연구진은 개발한 기술을 병원·기업과 함께 실제 의료현장에서 검증하고 시제품까지 제작할 계획임.", "body": "광주과학기술원이 9월 15일 과학기술정보통신부와 정보통신기획평가원이 추진하는 2026년도 AI 최고급 신진연구자 지원사업의 학제연계형 과제에 선정됐다고 밝힘, GIST 가 주관하고 성균관대가 공동연구개발기관으로 참여하며 연구기간은 2026년 7월부터 2031년 12월까지 5년 6개월, 정부지원 연구개발비는 110억 원임, 개발 목표는 의료 상황에 따라 역할이 갈리는 세 가지 AI 를 하나로 잇는 마인드(MIND) 원천기술임, 과학자 AI 는 유전체·단백질 등 생체정보와 의료영상·단일세포 데이터를 분석해 암과 뇌질환의 발병 기전을 규명하고 새로운 생체지표와 치료표적을 발굴함, 임상의 AI 는 병원·환자·의료장비·검사 방식이 달라져도 안정적으로 작동하면서 진단·예후·치료반응을 예측하고 판단 근거와 불확실성을 함께 제시함, 일상 주치의 AI 는 웨어러블과 가정 내 센서가 수집한 수면·활동·행동 데이터를 장기간 분석해 건강 이상 신호를 조기에 발견함, 삼성서울병원·뷰노·뉴로핏과 다기관 임상검증 및 시제품화를 추진함, 연구책임자는 GIST AI학과 이현주 교수이고 공동연구책임자는 성균관대 박현진 교수이며 신진연구자 여섯 명이 참여연구원이 아니라 독립 프로젝트 책임자로 연구를 이끄는 구조임", "src": "GIST 발표 9.15", "pd": "2026-09-15", "url": "https://www.gist.ac.kr/kr/html/sub07/070103.html?mode=V&no=223701"}, {"sec": 6, "t": "Nature 논평, 기후평가 보고서의 AI 사용 이력 공개 의무화 요구", "k": "문헌을 고르는 단계에서 AI가 개입하면 보고서 결론이 이미 달라진다", "ez": "기후변화 보고서를 만들 때 인공지능을 쓰기 시작했는데 그 흔적을 남기게 하자는 주장이 국제학술지에 실림.\n\n문제로 삼은 지점은 글을 쓰는 단계가 아님. 보고서를 쓰기 전에 수만 편의 논문 가운데 무엇을 읽을지 고르는 작업이 먼저 있는데 여기에 인공지능이 들어감. 어떤 논문이 드러나고 어떤 논문이 묶이는지가 이 단계에서 정해지므로, 저자가 첫 문장을 적기도 전에 결론의 방향이 좁아질 수 있음.\n\n기후변화에 관한 정부간 협의체는 2026년 3월 문헌 검토와 심사 의견 처리에 인공지능 도구를 개발하고 있다고 밝힌 바 있음. 논평이 요구한 것은 두 가지임. 자료를 넣는 단계에서 인공지능을 썼는지 공개하도록 의무를 두고, 평가 절차에 맞춘 점검 규약을 표준으로 만들라는 것임.", "body": "국제학술지 Nature 가 9월 15일 기후변화 평가에 AI 를 도입하기에 앞서 추적 가능성을 확보해야 한다는 논평을 실음, 기후변화에 관한 정부간 협의체(IPCC)가 2026년 3월 문헌검토와 검토의견 처리에 AI 지원 도구를 개발하고 있다고 밝힌 데 따른 것임, 논평은 AI 도구가 어떤 근거를 드러나게 하고 어떤 연구를 묶으며 어떤 신호를 저자에게 도달시킬지를 바꾸므로 보고서의 한 문장이 쓰이기 전에 이미 결론에 영향을 준다고 지적함, 요구 사항은 둘이며 자료 수집 단계의 AI 사용 이력 공개 의무와 평가 절차 전용 감사 규약의 표준화임", "src": "Nature 논평 9.15", "pd": "2026-09-15", "url": "https://www.nature.com/articles/d41586-026-02905-7"}, {"sec": 7, "t": "과학기술인연우회, 은퇴 연구자 활용 국가 플랫폼 구축 제안", "k": "은퇴한 연구자를 일자리 알선이 아니라 국가 자산으로 관리하자는 요구가 나왔다", "ez": "은퇴한 과학기술인을 어떻게 다시 활용할 것인가를 두고 국회에서 정책포럼이 열림. 과학기술인연우회가 제안한 것은 이들을 산업체와 연구기관, 지역의 필요와 이어 주는 창구를 국가 차원에서 하나로 구축하자는 것임.\n\n지금까지의 방식과 다른 점은 범위임. 일자리를 한 번 소개하고 끝내는 것이 아니라, 어떤 경력을 쌓아 왔고 앞으로 어디에 적합한지를 계속 관리하는 방향으로 넓히자는 것임. 연결 작업에는 인공지능을 활용하겠다는 구상임.\n\n2027년 추진 과제로 네 가지를 제시함. 통합 창구 시범 운영, 수요에 맞춘 경력 전환 지원, 기업의 문제를 해결하는 전문가 배치, 그리고 수도권 밖 두세 지역에 전략산업을 담당할 팀을 두는 것임. 시범 단계에서는 전문가 20~30명이 서너 달 동안 30~50개 과제를 담당하는 규모로 제시함.", "body": "과학기술인연우회가 9월 15일 국회의원회관에서 「국가전략자산으로서 고경력 과학기술인 활용 방안」 정책포럼을 열고 은퇴 연구자를 산업·연구기관·지역 수요와 잇는 AI 기반 국가통합 플랫폼을 제안함, 황정아·조승래 의원과 한국과학기술단체총연합회가 공동 주최함, 제안의 범위는 단순 일자리 알선이 아니라 경력 전주기 관리이며 2027년 추진 과제로 AI 기반 국가통합 플랫폼 시범사업, 수요 연계형 경력전환·배치 프로그램, 한국형 산학협력 디렉터 문제해결 사업, 수도권 밖 2~3개 지역의 전략산업 미션팀 넷을 제시함, 시범 단계 규모는 디렉터 20~30명이 3~6개월간 30~50개 과제를 수행하는 것으로 제시됨, 박인서 정책연구센터장은 고경력 과학기술인이 연구경험과 산업 전문성, 넓은 네트워크를 함께 갖췄다고 밝힘, 과학기술정보통신부는 개정 엔지니어링산업 진흥법에 경력개발·배치 지원의 법적 근거가 있음을 확인함", "src": "대덕넷 보도 9.15", "pd": "2026-09-15", "url": "http://www.hellodd.com/news/articleView.html?idxno=113179"}, {"sec": 6, "t": "Nature 논평, 미 국립보건원 연구성과 지표 개편에 우려 제기", "k": "무엇으로 성과를 측정하느냐가 세계 연구자의 행동을 바꾼다", "ez": "미국 국립보건원은 세계에서 보건 연구에 예산을 가장 많이 투입하는 기관임. 이 기관이 연구 성과를 무엇으로 측정하고 어떻게 보상할지 다시 정하기로 하고, 관계자들에게 의견을 묻는 절차를 진행 중임.\n\n국제학술지에 실린 논평은 이 절차를 두고 우려를 나타냄. 지금의 평가가 논문 수와 인용 횟수 같은 개인 실적 지표에 치우쳐 있다는 것이 문제의식임.\n\n한 나라의 기관이 정하는 일이지만 영향은 그 나라에 머무르지 않음. 이 기관이 어떤 기준을 고르느냐에 따라 세계 연구자들이 무엇을 목표로 연구할지가 함께 움직이기 때문임. 논평은 이런 기회가 자주 오지 않으며 시한도 정해져 있다고 지적함.", "body": "국제학술지 Nature 가 9월 15일 미국 국립보건원(NIH)의 연구성과 측정·보상 방식 개편을 두고 논평을 실음, NIH 는 연구 영향을 어떻게 측정하고 보상할 것인지에 관해 이해관계자 의견을 묻는 정보요청(RFI)을 진행 중임, 논평은 세계 최대 보건연구 재정기관의 결정이 전 세계 연구 생태계로 파급되므로 드물고 시한이 정해진 기회라고 규정하고 이를 놓칠 것을 우려함, 현행 평가가 논문 수와 인용 지표 같은 개인 생산성 지표에 치우쳐 있다는 점을 문제로 지적함", "src": "Nature 논평 9.15", "pd": "2026-09-15", "url": "https://www.nature.com/articles/d41586-026-02906-6"}]}, {"date": "2026-09-15", "items": [{"sec": 1, "t": "英 원자력청·美 프린스턴연구소, 융합 연구용 인공지능 슈퍼컴 연계 합의", "k": "서로 다른 실험장치에서 나온 데이터로 같은 모델을 훈련할 길이 열렸다", "ez": "영국과 미국이 핵융합 연구에 쓰는 인공지능 슈퍼컴퓨터 두 대를 서로 연결하기로 9월 14일 런던에서 합의했음. 영국 쪽은 SUNRISE, 미국 쪽은 프린스턴플라즈마물리연구소의 STELLAR-AI 이며, 영국 정부는 SUNRISE 구축에 4,500만 파운드를 지원했음. 핵융합은 태양이 에너지를 내는 방식을 지상에서 재현하려는 연구임. 실험장치마다 조건이 달라 한 곳의 데이터만으로는 인공지능을 충분히 훈련하기 어려움. 두 기관의 장치는 모양이 같은 계열이어서 실험 결과를 함께 학습에 쓸 수 있고, 계산은 그 작업에 더 알맞은 기계에서 수행할 수 있음. 미국 연구소는 이 협력이 에너지부의 인공지능 과학사업 「제네시스 미션」의 일부라고 밝혔음. 다음 단계로는 실제 장치를 컴퓨터 안에 그대로 옮겨 놓는 디지털 트윈 개발이 거론됐으나 시기와 예산은 제시되지 않았음.", "body": "영국 원자력청(UKAEA)과 美 에너지부 프린스턴플라즈마물리연구소(PPPL)가 9월 14일 런던 맨션하우스에서 열린 세계 융합정책 정상회의에서 두 기관의 융합 연구용 인공지능 슈퍼컴퓨터를 연결하는 의향 공동선언에 서명했음, 대상은 영국 최초의 융합 전용 인공지능 슈퍼컴퓨터 SUNRISE 와 프린스턴연구소가 이끄는 STELLAR-AI 플랫폼이며 두 기관은 이 연결을 SUNRISE-STELLAR-AI 연합으로 부름, 영국 정부는 SUNRISE 에 4,500만 파운드를 지원했다고 밝혔음, 연합의 목표는 양측 연구자가 실험 데이터를 공유하고 서로 다른 두 융합 실험장치의 결과로 인공지능을 훈련하며 과제에 가장 적합한 기계에서 모델을 실행하도록 하는 것임, 두 실험장치는 모두 자기장으로 플라스마를 가두는 구형 토카막임, 두 기관은 6월 고등컴퓨팅·인공지능 공동사업의 틀이 되는 양해각서를 맺었고 이번 선언은 그 틀 위에서 이뤄졌음, PPPL 보도자료는 美 측 참여가 에너지부 제네시스 미션의 일부라고 밝혔으나 영국 정부 발표문에는 그 언급이 없음, PPPL 수석과학자 조너선 메나드는 융합발전소는 한 연구소나 한 나라가 설계할 수 없다며 두 플랫폼을 연합하면 선도 실험시설 두 곳의 데이터로 인공지능을 훈련하고 융합 연구용으로 설계된 두 계산체계에서 같은 착상을 검증할 수 있다고 밝혔음, 영국 정부 발표는 다음 단계로 디지털 트윈 개발 검토를 들었으나 시기와 예산은 제시하지 않았음, 두 슈퍼컴퓨터의 연산성능과 가속기 수량은 양측 발표 어디에도 제시되지 않았음", "src": "英 정부 발표 9.14 · PPPL 보도자료", "pd": "2026-09-14", "url": "https://www.gov.uk/government/news/uk-and-us-fusion-supercomputers-to-be-linked-across-atlantic", "durl": "https://www.newswise.com/articles/pppl-and-ukaea-experts-make-a-plan-to-connect-research-on-two-fusion-supercomputers-across-the-atlantic"}, {"sec": 6, "t": "美 랜드연구소, 공개가중치 인공지능의 생물학 오용 위험 평가보고서 발간", "k": "안전장치를 제거하는 일이 성능을 높이는 일보다 훨씬 쉬운 것으로 나타났다", "ez": "가중치를 공개한 인공지능 모델은 누구나 내려받아 고칠 수 있음. 미국 랜드연구소가 이 점을 이용해 생물학 분야에서 나쁜 쓰임이 가능한지 실제로 시험한 보고서를 9월 14일 냈음. 85쪽 분량임. 시험 대상은 세 가지 변형임. 답변을 거부하는 기능을 학습으로 지워 낸 것, 생물학 실력 자체를 강화학습으로 높인 것, 그리고 이미 인터넷에 공개돼 있는 검열 해제판임. 결과는 둘로 갈렸음. 안전장치를 제거하는 일은 매우 쉬웠던 반면 생물학 실력을 실제로 높이는 일은 훨씬 어려웠음. 다만 안전장치를 제거하는 것만으로도 현실적인 위협 경로 하나를 도울 수 있다고 보고서는 적었음. 연구진은 악용될 수 있는 구체적 절차를 보고서에서 제외했다고 밝혔음.", "body": "美 랜드연구소가 9월 14일 연구보고서 「Open-Weight AI Models May Increase Biological Misuse Risks」(RR-A5112-1, 85쪽)를 발간함, 보고서는 가중치가 공개된 대규모 언어모델을 공개 후 세 가지 방식으로 변형했을 때 생물학 분야의 오용 위험이 어떻게 달라지는지 평가한 것임, 세 방식은 거부응답 제거를 겨냥한 지도학습 미세조정, 강화학습 기반 역량 강화, 허깅페이스에 이미 공개돼 있는 검열 해제판 사용임, 평가 결과 안전 훈련을 제거하는 일은 매우 용이한 반면 생물학 역량 자체를 높이는 일은 더 어려운 것으로 나타났고 안전장치 제거만으로도 현실적인 위협 경로 하나를 지원할 수 있다고 적었음, 평가는 생물안보 관련 지식 문항과 에이전트 과제, 거부 우회 시험, 인플루엔자 경로를 겨냥한 자체 평가로 구성됐으며 변형하지 않은 공개가중치 모델과 폐쇄형 최전선 모델을 대조군으로 두었음, 보고서는 미세조정 절차와 비공개 평가의 개별 문항, 위협 행위자에게 도움이 될 절차적 서술을 의도적으로 제외했다고 밝혔음, 저자는 수니슈찰 데브 등 8명이고 랜드 글로벌·신흥위험부문 산하 인공지능·안보·기술센터가 자체 재원으로 수행했음", "src": "RAND 발간 9.14", "pd": "2026-09-14", "url": "https://www.rand.org/pubs/research_reports/RRA5112-1.html"}, {"sec": 6, "t": "美 국립과학재단, 심사·평가 방식을 시험하는 메타사이언스실 신설 발표", "k": "연구비를 어떻게 배분할지를 기관 스스로 실험 대상으로 삼겠다는 것이다", "ez": "미국 국립과학재단이 연구비를 배분하는 방식 자체를 연구 대상으로 삼겠다고 9월 10일 밝혔음. 국장실 아래 메타사이언스실이라는 조직을 새로 두고, 심사와 지원 방식을 바꿔 본 뒤 그 효과를 측정하는 일을 맡김. 시험 대상 가운데 눈에 띄는 것이 골든티켓임. 심사위원 여럿이 합의하는 방식에서는 의견이 갈리는 제안이 탈락하기 쉬운데, 심사위원 한 사람이 그런 제안을 단독으로 지지해 올릴 수 있게 하는 장치임. 과제 기간도 조정함. 5년 넘게 신청할 수 있는 창구를 넓히고, 몇 쪽짜리 신청서로 빠르게 결정하는 단기 과제도 확대함. 재단은 2036년까지 연구비 1달러가 내는 성과를 두 배로 높이겠다는 목표를 함께 적었음.", "body": "美 국립과학재단(NSF) 브라이언 스톤 국장 직무대행이 9월 10일 과학기술계 앞으로 「새로운 과학 황금기의 NSF 리더십」 성명을 냈음, 성명의 핵심은 국장실 아래 메타사이언스실을 신설해 연구비 지원·심사·프로그램 운영 방식을 실험하고 그 효과를 측정하는 것임, 이 조직은 메타사이언스 전문가와 데이터 과학자로 구성되며 어떤 방식이 더 나은 성과를 내는지 가려 확대하고 그렇지 않은 것은 중단하겠다고 밝혔음, 효과가 없던 실험의 사후분석까지 공개하겠다고 적었음, 시험 대상으로 든 심사 방식은 개별 심사위원이 위원회 합의를 통과하지 못할 제안을 단독으로 지지할 수 있는 골든티켓, 행정부담을 줄이는 분산 심사, 새로움을 재는 새 지표임, 과제 기간은 5년 이상을 신청할 수 있는 창구를 넓히고 8월 17일 공고한 15억 달러 이상 규모의 핵심 발견 연구 기회에 그 유연성을 반영했다고 밝혔음, 몇 쪽짜리 신청서로 빠르게 결정하는 단기 과제 경로도 확대하며 5월 발표한 X-Labs 를 새 기관 모형으로 제시했음, 성명은 2036년까지 연방 연구비 1달러당 과학 생산성과 영향을 두 배로 늘리는 것을 목표로 제시했음", "src": "NSF 발표 9.10 · 성명문", "pd": "2026-09-10", "url": "https://www.nsf.gov/news/nsf-leadership-new-golden-age-science", "durl": "https://nsf-gov-resources.nsf.gov/files/Statement-NSF-Leadership-Golden-Age-Science.pdf"}, {"sec": 7, "t": "항공우주연구원, 연구·행정 전반에 인공지능 도입하는 지능형 플랫폼 구축 착수", "k": "연구자가 쌓아 온 기술자료와 경험을 검색 가능한 지식자산으로 바꾸는 것이 목표다", "ez": "한국항공우주연구원이 연구와 행정 전반에 인공지능을 도입하는 작업을 9월 14일 시작했음. 만들려는 것은 KARI BRAIN 이라는 이름의 플랫폼으로, 연구자 개인과 부서에 흩어져 있던 기술자료와 경험을 인공지능이 찾아 활용할 수 있는 형태로 바꾸는 것이 목표임. 주목할 점은 모델을 외부에 맡기지 않고 내부에서 운용한다는 것임. 파라미터가 3,000억 개 넘는 대형 모델을 자체 설비에서 운용함. 설비는 올해 1월과 4월에 각각 고성능 계산장치를 탑재한 서버를 도입해 갖췄음. 적용 범위는 기술자료 분석과 설계 지원, 시험데이터 처리부터 규정 검색과 문서 작성까지임. 2027년 7월까지를 1차 기간으로 두고 효과를 측정하기로 했음.", "body": "한국항공우주연구원이 9월 14일 연구·행정 전반의 인공지능 전환을 추진하며 지능형 플랫폼 KARI BRAIN 을 구축한다고 밝혔음, 개인과 부서에 흩어져 있는 기술자료와 연구경험을 인공지능이 검색해 활용할 수 있는 지식자산으로 바꾸는 것이 목표임, 연구개발 분야에서는 기술자료 분석과 설계·해석 지원, 시험데이터 처리, 소프트웨어 개발에 적용하고 행정 분야에서는 규정 검색과 문서 작성, 반복 업무 자동화에 적용함, 계산 설비는 올해 1월 엔비디아 H200 4기를 탑재한 서버를, 4월 B200 8기를 탑재한 서버를 도입했고 파라미터 3,000억 개 이상의 대형 모델을 외부에 위탁하지 않고 내부에서 운용함, 원내 생성형 인공지능 서비스 이용자는 836명임, 2026년 8월부터 2027년 7월까지를 1차 이행기간으로 정해 현장 적용과 성과 측정을 거친 뒤 효과가 확인된 활용 방법을 조직 전반으로 확대할 계획임, 8개 최고부서가 선정한 13명을 전환 실무책임자로 배치했음, 이상철 원장은 축적한 전문지식과 연구데이터를 인공지능과 연결해 연구자의 전문성을 뒷받침하겠다고 밝혔음", "src": "항우연 발표 9.14 · 전자신문 보도", "pd": "2026-09-14", "url": "https://www.kari.re.kr/kor/article/ATCL87374b48c/18714", "murl": "https://www.etnews.com/20260914000426"}, {"sec": 6, "t": "GIST, 상황에 따라 달라지는 변화를 인공지능이 찾아내는지 재는 기준 개발", "k": "문장은 사람보다 자연스러웠으나 무엇이 바뀌었는지 짚는 정확도는 크게 뒤졌다", "ez": "인공지능에게 사진 두 장을 주고 무엇이 달라졌는지 물으면 그럴듯한 문장을 내놓음. 그 답이 정말 맞는지 재는 일은 간단하지 않음. 같은 사진이라도 무엇을 확인하려 하느냐에 따라 중요한 변화가 달라지기 때문임. 철도 사진이라면 날씨를 볼 때는 쌓인 눈이, 안전을 볼 때는 선로 위 열차가 핵심임. 광주과학기술원 연구팀이 이 점을 반영한 평가 기준을 9월 14일 내놓았음. 상황 51개를 정하고 상황마다 찾아야 할 변화와 무시해야 할 차이를 따로 지정한 뒤, 사람이 설명을 단 사진 쌍 4,996개를 모았음. 최신 모델을 시험한 결과가 갈렸음. 문장이 얼마나 자연스러운지만 보면 사람보다 높은 점수를 받았으나, 종합 점수는 10점 만점에 5.72점으로 사람 7.45점에 뒤졌음.", "body": "광주과학기술원 인공지능학과 김의환 교수 연구팀이 두 장의 사진을 비교해 인공지능이 상황에 맞는 변화를 선별해 설명하는지 평가하는 기준 C3-Bench 를 개발하고 9월 14일 밝혔음, 기존 평가는 정답 문장과 같은 낱말이 얼마나 겹치는지를 주로 보았고 어떤 변화를 중요하게 보아야 하는지가 정해져 있지 않은 경우가 많았음, 연구팀은 자연 장면과 위성·항공 원격탐사 영상, 이미지 편집, 이상 탐지 4개 분야에서 현실적인 변화 상황 51개를 선정하고 사람이 직접 설명을 단 이미지 쌍 4,996개로 평가체계를 구성했음, 상황마다 찾아야 할 변화와 무시해야 할 차이, 설명할 때 지켜야 할 기준을 따로 지정했음, 이미지 쌍 400개로 사람과 GPT-5.2 를 비교한 결과 정확성·구체성·자연스러움·상황 관련성을 합한 10점 만점 점수가 사람 7.45점, GPT-5.2 5.72점으로 1.73점 차이가 났음, 다만 문장의 자연스러움만 보면 GPT-5.2 가 8.53점으로 사람 8.32점을 앞섰음, 사진 순서를 뒤집었을 때 설명을 반대로 바꾸는 가역성은 사람 93%, GPT-5.2 61%였음, 오류 유형은 물체를 인식하지 못하거나 종류·특성을 잘못 파악하는 시각 인식 오류가 63.3%로 가장 많았음, 논문은 유럽컴퓨터비전학회 ECCV 2026 에 채택됐고 김재우 석·박사통합과정생이 제1저자, 김의환 부교수가 교신저자임, 과기정통부·한국연구재단 우수신진연구자지원사업과 정보통신기획평가원 과제, 지스트-이노코어 사업의 지원을 받았음", "src": "GIST 발표 9.14", "pd": "2026-09-14", "url": "https://www.gist.ac.kr/kr/html/sub07/070102.html?mode=V&no=223602"}]}, {"date": "2026-09-14", "items": [{"sec": 1, "t": "美 국토안보부, 제네시스 미션에 국가안보 연구과제 2건 제시", "k": "안보 부처의 연구 수요를 에너지부 설비가 받아 수행하는 통로가 생겼다", "ez": "미국 국토안보부가 에너지부가 이끄는 인공지능 과학사업 「제네시스 미션」에 연구과제 두 건을 냈다. 하나는 소프트웨어가 안전한지 인공지능으로 검증하는 일이고, 다른 하나는 생물학적 위협을 일찍 찾아내고 그 출처를 구분하는 일이다.\n\n눈여겨볼 점은 과제를 낸 부처와 설비를 가진 부처가 다르다는 것이다. 국토안보부 수석과학자는 필요한 계산 설비와 기술 인력이 에너지부 국립연구소에 있다고 설명했다. 안보 부처가 연구 수요를 제시하고 에너지부의 연구설비가 그것을 수행하는 구조다.\n\n제네시스 미션 전체 과제는 에너지부가 공개한 종합문서를 기준으로 33건이며 다섯 갈래로 나뉜다. 그중 자율실험실 구현, 양자 알고리즘 발견, 생명계 예측, 소재 설계 네 건은 연구를 수행하는 방법 자체를 바꾸려는 과제다. 이 문서는 15개가 넘는 연방기관이 함께 작성했다.", "body": "美 국토안보부(DHS) 과학기술국이 9월 10일 빌링턴 사이버보안 서밋에서 제네시스 미션 참여 방식을 밝혔고 9월 11일 보도됨, 국토안보부가 제시한 과제는 「국가안보를 위한 소프트웨어 이해」와 「생물학적 위협의 조기 탐지·귀속」 2건이며 7월 22일 과학기술 차관 페드로 아옌데 명의로 공표된 것임, 샘 하워턴 수석과학자는 필요한 플랫폼과 기술 인력이 에너지부 국립연구소에 있다고 설명했고 에너지부 사이버보안·에너지안보·긴급대응국 앤드루 매클루어 국장이 함께 참석한 것으로 보도됨, 제네시스 미션의 국가 과학기술 도전과제는 에너지부가 공개한 종합문서 목차 기준 5대 분류 아래 33건이고 그 가운데 「인공지능 주도 자율실험실 구현」·「인공지능으로 양자 알고리즘 발견」·「생명계 예측」·「기능이 예측되는 소재 설계」 넷이 연구 수행 방식 자체를 바꾸는 갈래임, 종합문서는 15개 이상 연방기관이 함께 작성했고 2025년 11월 24일 행정명령 「제네시스 미션 출범」에 근거함", "src": "DHS 발표 7.22 · 도전과제 종합문서 · FedScoop 보도 9.11", "pd": "2026-09-11", "url": "https://www.dhs.gov/science-and-technology/news/2026/07/22/st-announces-new-genesis-mission-challenges-safeguard-americas-future", "durl": "https://www.energy.gov/documents/genesis-mission-national-science-technology-challenges-0", "murl": "https://fedscoop.com/dhs-doe-partner-cybersecurity-billington/"}, {"sec": 7, "t": "UNIST, 동남권 지역 자율 연구개발 사업단 주관 기관으로 선정", "k": "지역 산업 수요를 대학이 과제로 만들어 양산까지 관리하게 됐다", "ez": "울산과학기술원이 과학기술정보통신부의 지역 자율 연구개발 사업에서 동남권 사업단을 맡는다. 지역이 중앙의 지침을 받는 대신 스스로 과제를 정하는 방식이며 부산·울산·경남을 아우른다.\n\n2026년에 131억 원이 들어가고 과제는 아홉 개다. 조선업에 인공지능을 접목하는 일, 전력용 반도체, 첨단 항공 추진기술 등이 포함된다. 중장기로는 2030년까지 모두 2,531억 원이 계획돼 있고 이 가운데 국비가 2,131억 원, 지방비가 400억 원이다.\n\n사업단이 하는 일은 산업 현장의 기술 수요를 과제로 바꾼 뒤 기초 연구부터 시제품, 현장 검증, 시험과 인증, 양산까지 끊기지 않게 관리하는 것이다. 인공지능 쪽 과제로는 제조 과정에서 쌓인 데이터를 학습해 공정을 스스로 조정하는 플랫폼을 만들어 조선 생산에 적용한다.", "body": "울산과학기술원(UNIST)이 과학기술정보통신부 「4극3특 지역 자율 연구개발 사업」의 동남권 사업단 주관 기관을 맡는다고 9월 11일 발표했음, 2026년 동남권 투입액은 131억 원이고 조선 인공지능 전환·전력반도체·첨단항공 추진기술과 K-UBRC 등 9개 과제가 추진됨, 중장기 계획은 2026년부터 2030년까지 총 2,531억 원이며 국비 2,131억 원과 지방비 400억 원으로 나뉘어 있음, 사업단은 부산·울산·경남 지방자치단체와 연구개발지원단·대학·출연연·기업이 참여하는 형태이고, 산업 기술수요를 과제로 개발한 뒤 원천기술부터 시제품·현장실증·시험·인증·양산까지 전 과정을 관리하는 역할을 지님, 인공지능 관련으로는 제조데이터를 학습해 공정을 스스로 조정하는 「제조데이터 기반 피지컬 인공지능 자율공정 플랫폼」을 개발해 조선 생산성과 품질에 적용함", "src": "UNIST 발표 9.11", "pd": "2026-09-11", "url": "https://www.unist.ac.kr/unist/center/news.do?mode=view&articleNo=307412"}, {"sec": 7, "t": "과총·고경력과학기술연우총연합회, 은퇴 연구자 연결 플랫폼 제안", "k": "연구현장을 떠난 전문가를 기업·지역 수요에 연결하는 방안이 나왔다", "ez": "연구 현장을 떠난 고경력 과학기술인을 국가 차원에서 다시 활용하자는 제안이 나왔다. 한국과학기술단체총연합회와 고경력과학기술연우총연합회가 국회의원실과 함께 9월 15일 국회에서 정책포럼을 연다.\n\n제안의 중심은 인공지능을 쓴 연결 플랫폼이다. 기업과 공공기관, 지역이 필요한 기술을 등록하면 그에 맞는 경력을 가진 퇴직 연구자를 찾아 연결한다. 퇴직 전에 경력을 진단하고 필요한 교육을 거쳐 퇴직 후 자리까지 잇는 체계도 함께 두자는 안이다.\n\n2027년에 시범사업 네 개를 두는 구상이다. 인공지능 국가플랫폼, 경력 전환 채용 모델, 한국형 산학협력 책임자, 지역 전략산업 임무팀이다. 지금은 시행 주체가 흩어져 있고 퇴직 전후로 경력이 끊기며 역할과 보상, 성과를 평가할 기준이 없다는 점이 문제로 지적됨.", "body": "한국과학기술단체총연합회와 고경력과학기술연우총연합회가 황정아·조승래 의원실과 함께 9월 15일 국회의원회관 제6간담회의실에서 「국가전략자산으로서의 고경력 과학기술인 활용방안」 정책포럼을 여는 것으로 9월 13일 보도됨, 주관은 고경력과학기술연우총연합회이고 과학기술정보통신부 연구개발정책관이 참석하는 것으로 보도됨, 제안의 핵심은 기업·공공기관·지역의 기술 수요와 퇴직 연구자의 전문성을 인공지능으로 연결하는 국가 통합 플랫폼이며, 퇴직 전 진단과 맞춤 교육을 거쳐 퇴직 후 배치까지 잇는 생애 전주기 경력 체계를 함께 두는 구조로 전해짐, 2027년 시범사업 4개로 인공지능 국가플랫폼·경력전환 채용모델·한국형 산학협력 책임자 제도·지역 전략산업 임무팀이 제시된 것으로 보도됨, 현행 체계의 문제로는 시행 주체가 흩어져 있는 점, 퇴직 전후 경력이 끊기는 점, 실제 수요에 맞춘 전문성 연결이 이뤄지지 않는 점, 역할·계약·보상·성과평가 기준이 없는 점이 지적됨", "src": "대덕넷 보도 9.13", "pd": "2026-09-13", "url": "https://www.hellodd.com/news/articleView.html?idxno=113159"}, {"sec": 6, "t": "필즈상 수상자 25명, 인공지능 수학 문제풀이 경쟁 비판 공동선언", "k": "문제를 몇 개 풀었는지로 연구를 평가하는 방식에 제동이 걸렸다", "ez": "수학계에서 가장 권위 있는 상인 필즈상을 받은 25명이 함께 이름을 올려 인공지능 기업들에 문제를 제기했다. 9월 11일 발표된 선언문의 제목은 「수학에서 인공지능의 심각한 어긋남」이다.\n\n이들이 문제 삼은 것은 인공지능 자체가 아니다. 기업들이 「어려운 수학 문제를 몇 개 풀었는가」를 실력의 척도로 내세우는 방식이다. 선언문은 그 방식이 수학이라는 학문과 연구자 공동체에 해롭다고 적었다. 수학의 목적은 답을 얻는 것만이 아니라 왜 그것이 참인지 이해하고 그 과정에서 새 이론과 방법을 얻는 데 있기 때문이다.\n\n또 발표를 서두르면 논문을 제대로 쓰고 앞선 연구를 인용할 시간이 없어 공로를 누구에게 돌릴지 다투게 된다고 지적했다. 선언문은 인공지능을 경쟁자가 아니라 조수로 쓰자고 제안했다. 서명자에는 한국계 수상자인 프린스턴대 허준이 교수도 들어 있다.", "body": "필즈상 수상자 25명이 9월 11일 공동선언 「A Severe Misalignment of AI in Mathematics」를 발표했음, 선언은 인공지능 기업이 수학 문제 해결을 벤치마크로 삼는 것이 수학이라는 학문과 그 공동체에 해롭다고 적고 양측의 목표가 「심각하게 어긋나 있다」고 밝혔음, 요구는 도구 사용을 멈추라는 것이 아니라 풀어낸 문제 수로 가치를 재는 것을 멈추라는 것이며 표적은 기술이 아니라 평가 지표임, 서둘러 낸 발표가 집필과 선행연구 인용에 필요한 시간을 남기지 않아 귀속·표절 문제를 낳는다고 지적했음, 서명자는 1978년부터 2026년까지의 수상자에 걸치며 피에르 들리뉴·테렌스 타오·페터 숄체·마리나 비아조프스카·마르틴 하이러·세드릭 빌라니·마님 바르가바·응오바오쩌우·모리 시게후미와 한국계 수상자인 프린스턴대 허준이 교수가 포함됨, 선언은 인공지능을 경쟁자가 아니라 조수로 쓰자고 적었음", "src": "필즈상 수상자 25명 공동선언 9.11 · 동아사이언스 보도 9.13", "pd": "2026-09-11", "url": "https://terrytao.wordpress.com/2026/09/11/a-severe-misalignment-of-ai-in-mathematics/", "murl": "https://www.dongascience.com/ko/news/79888"}, {"sec": 7, "t": "GIST, 4극3특 호남권 사업단 맡아 연구단 모집 개시", "k": "권역마다 같은 예산을 주고 연구주제는 지역이 정하는 방식이 시작됐다", "ez": "광주과학기술원이 과학기술정보통신부의 지역 자율 연구개발 사업에서 호남권 사업단을 맡는다. 중앙정부가 연구 주제를 정해 내려보내던 방식을 바꿔 지역이 필요한 연구를 스스로 기획하는 체계다.\n\n올해 전국에 789억 원이 들어간다. 중부·호남·대경·동남 네 권역에 각각 131억 원, 강원·전북·제주 세 곳에 각각 88억 원이다. 권역마다 같은 금액을 주고 무엇을 연구할지는 그 지역이 정한다.\n\n호남권은 반도체·에너지·모빌리티 세 분야를 골랐다. 반도체에서는 인공지능으로 칩을 쌓고 열을 관리하는 기술을, 모빌리티에서는 여러 종류의 로봇이 함께 일하는 인공지능 자율제조와 도시를 가상으로 복제해 교통안전과 재난에 대응하는 기술을 개발한다. 연구단 모집은 10월 12일 오후 3시까지 범부처통합연구지원시스템에서 받는다.", "body": "광주과학기술원(GIST)이 과학기술정보통신부 「4극3특 지역 자율 연구개발 사업」의 호남권 사업단을 맡았다고 9월 13일 발표했음, 사업단장은 GIST 환경·에너지공학과 박기홍 교수이고 전남광주통합특별시가 산업·정책 수요로 방향을 제시하면 GIST 가 대학·연구기관·기업을 연결해 기획과 수행을 뒷받침하는 협력체계임, 첨부 보도자료에 따르면 정부는 올해 총 789억 원을 투입해 중부·호남·대경·동남 4극에 각각 131억 원, 강원·전북·제주 3특에 각각 88억 원을 지원함, 사업 출범식은 9월 10일 한국과학기술원에서 열렸음, 호남권 중점 분야는 반도체·에너지·모빌리티 셋이며 반도체에서는 인공지능 기반 첨단 패키징·열관리와 산업특화형 고신뢰성 인공지능·광·전력반도체 기술을, 모빌리티에서는 다기종 로봇 기반 인공지능 자율제조와 도시 디지털트윈 기반 교통안전·재난대응 기술을 개발함, 에너지에서는 가상송전선로와 나트륨이온전지 기반 그리드포밍 에너지저장장치, 그린수소와 레이저 핵융합 연계 기술을 확보함, 연구단 모집은 9월 11일부터 10월 12일 오후 3시까지 범부처통합연구지원시스템에서 접수함", "src": "GIST 발표 9.13 · 첨부 보도자료", "pd": "2026-09-13", "url": "https://www.gist.ac.kr/kr/html/sub07/070103.html?mode=V&no=223595", "durl": "https://www.gist.ac.kr/kr/html/sub07/070103.html?mode=D&no=223595&file_id=83929"}]}, {"date": "2026-09-11", "items": [{"sec": 1, "t": "美 NSF, 연구지원 체계 개편안 발표하며 프런티어 이니셔티브 4개 신설", "k": "연구비를 나누는 방식 자체를 바꾸고 인공지능 활용 연구를 별도 축으로 세웠다", "ez": "미국 국립과학재단이 연구비를 나누는 방식을 다시 짜겠다고 9월 10일 밝혔다. 지금까지 여러 창구가 뒤섞여 있던 것을, 앞으로는 새로운 지식을 찾는 연구, 기술로 옮기는 연구, 시설을 짓는 일, 사람을 기르는 일 넷으로 갈라 창구마다 목적을 하나씩만 두기로 했다. 연구의 성격에 따라 지원 방식도 달리한다. 오래 걸리는 연구에는 5년이 넘는 기간을 주고, 짧게 확인할 수 있는 모험적 시도에는 몇 쪽짜리 신청서로 빠르게 결정한다. 심사에서는 위원들의 합의를 얻지 못한 제안이라도 한 명이 강하게 지지하면 통과시킬 수 있는 장치를 시험하고, 연구비 제도가 실제로 효과를 냈는지 따로 검증하는 조직도 새로 만든다. 인공지능은 별도의 축으로 세웠다. 로봇이 실험을 대신 수행하는 자율실험실을 전국 규모로 묶고, 기계가 곧바로 학습할 수 있게 정리한 연구 데이터를 늘린다. 연구비 1달러가 만들어 내는 성과를 2036년까지 두 배로 올린다는 목표도 함께 적었다.", "body": "美 국립과학재단(NSF)이 9월 10일 브라이언 스톤 원장 직무대행 명의로 과학기술계 앞 성명 「새로운 과학 황금기의 NSF 리더십」을 발표했음, 연구비 지원 창구를 발견연구·중개연구·연구인프라·인재양성 네 갈래로 갈라 창구마다 목적을 하나씩만 지게 하고, 지원 기간·지정 정도·심사 기전·기관 형태를 연구의 성격에 맞춰 달리 적용하는 포트폴리오 방식을 제시했음, 5년 이상 장기 과제 신청 창구를 넓히고 그 유연성을 8월 17일 공개한 15억 달러(약 2조 1천억 원) 규모 핵심 발견연구 공모에 이미 반영했다고 밝혔음, 짧은 기간의 탐색형 지원은 몇 쪽 분량 신청서로 신속히 결정하는 경로를 확대한다고 적었음, 심사에서는 합의에 이르지 못한 제안을 심사위원 한 명이 통과시킬 수 있는 「골든 티켓」과 분산심사를 시험함, 자체 평가와 개선을 전담하는 메타사이언스실(OMS)을 원장실 안에 신설해 연구비 기전의 효과를 공개 보고하고 실패한 시도의 사후분석까지 공개하겠다고 했으며, 2036년까지 연방 연구비 1달러당 과학 생산성과 영향을 두 배로 만든다는 목표를 명시했음, 학제 간 조정을 맡을 프런티어 이니셔티브 네 갈래를 처음 지정했음 — 지능의 미래, 양자현상 프런티어, 첨단소재·물질, 생물학적 설계의 기초, AI 관련해서는 제네시스 미션 조정에 기관 관계망을 투입한다고 밝히며 동료기관 서한(DCL)을 이미 발송하고 핵심 발견연구 공모에 AI 활용을 장려하는 문구를 넣었다고 적었음, 프로그램 가능 클라우드 실험실 국가 네트워크와 자율주행 실험실 투자, AI 학습이 가능한 데이터셋, 차세대 연구데이터 기반, 국가AI연구자원(NAIRR)과 주·지역 AI 인프라 허브의 연계를 AI 시대 연구 인프라의 축으로 들었음", "src": "NSF 발표 9.10 · 성명문", "pd": "2026-09-10", "url": "https://nsf.gov/news/nsf-leadership-new-golden-age-science", "durl": "https://nsf-gov-resources.nsf.gov/files/Statement-NSF-Leadership-Golden-Age-Science.pdf"}, {"sec": 2, "t": "KISTI, 대전~시카고 국가과학기술연구망 국제회선 400Gbps 개통", "k": "국내에서 미국으로 대용량 연구자료를 보내는 시간이 4분의 1로 줄었다", "ez": "한국과학기술정보연구원이 대전과 미국 시카고를 잇는 연구 전용 회선의 속도를 네 배로 올려 9월 10일 개통했다. 국가과학기술연구망은 대학과 연구기관이 실험 자료를 주고받는 데 쓰는 전용 통신망으로 일반 인터넷과는 따로 운영된다. 속도는 초당 100기가비트에서 400기가비트로 올라갔다. 100테라바이트 분량, 곧 고화질 영화 수만 편에 해당하는 자료를 보낼 때 예전에는 2시간 13분이 걸렸으나 이제 33분이면 끝난다. 태평양을 건너는 1만 킬로미터 넘는 구간에서 이 속도를 유지한 것은 국내에서 처음이다. 시카고 쪽 끝은 노스웨스턴대가 운영하는 국제 연구망 중계 지점에 연결돼 있어 북미와 남미, 유럽의 연구망까지 같은 속도로 닿는다. 인공지능 학습 자료와 천문·우주, 고에너지물리, 바이오처럼 자료 크기가 큰 분야에서 쓰임이 클 것으로 제시됐다.", "body": "한국과학기술정보연구원(KISTI)이 9월 10일 국가과학기술연구망(KREONET)의 대전~미국 시카고 국제백본망을 기존 100Gbps 에서 400Gbps 로 넓혀 개통했다고 발표했음, 민간 통신사와 공공 부문을 통틀어 국내에서 처음 구축된 단일 파장당 400Gbps 급 국제회선이며, 태평양을 건너는 1만 킬로미터 이상 구간에서 단일 400Gbps 전송 품질을 확보하고 실제 연구 트래픽 환경에서 성능을 검증했다고 적었음, 100테라바이트 규모 자료를 보낼 때 기존 환경에서는 약 2시간 13분이 걸렸으나 이번 회선에서는 약 33분으로 줄어듦, 시카고 쪽 종단은 노스웨스턴대 국제첨단인터넷연구센터(iCAIR)가 운영하는 스타라이트 국제연구망 허브이고 이를 통해 북미·남미·유럽 연구망까지 같은 속도로 닿음, KREONET 백본망의 최대 전송용량은 1.2Tbps 이고 국내 지역망센터 18곳과 전세계 약 3만 개 연구네트워크를 잇고 있음, AI 학습데이터를 비롯해 천문·우주, 고에너지물리, 바이오 등 수십 테라바이트에서 페타바이트급 자료를 다루는 분야의 활용을 목적으로 들었음, 개통 기념식은 9월 8일 열렸고 조 맘브레티 iCAIR 센터장과 조부승 KISTI 과학기술연구망센터장이 참석해 차세대 국제 공동연구의 기반이라고 밝혔음", "src": "KISTI 발표 9.10 · 쿠키뉴스 보도", "pd": "2026-09-10", "url": "https://www.kisti.re.kr/promote/post/news/7104", "murl": "https://www.kukinews.com/article/view/kuk202609100045"}, {"sec": 2, "t": "식품진흥원·한국식품연구원, 농식품 데이터 공동활용 협약 체결", "k": "연구실 자료와 기업 자료를 서로 되쓰게 하는 통로를 열었다", "ez": "한국식품산업클러스터진흥원과 한국식품연구원이 9월 9일 농식품 데이터를 함께 쓰기로 협약을 맺었다. 연구기관이 실험에서 쌓은 자료와 기업 지원기관이 모은 시장 자료를 서로 열어 주는 것이 핵심이다. 두 기관은 각자 운영하던 데이터 플랫폼을 단계적으로 연결하고, 어떤 자료를 갖고 있는지 목록과 설명을 먼저 공유하기로 했다. 연구실에서 나온 자료는 기업의 제품 개발에 쓰이고, 기업이 모은 자료는 다시 연구개발에 쓰이는 구조다. 협약식 뒤에는 연구데이터 관리계획을 서로 공개했다. 연구데이터 관리계획은 연구 과정에서 나온 자료를 어떤 형식으로 남기고 누구에게 공개할지 미리 정해 두는 문서로, 이것이 맞아야 기관 사이에서 자료를 주고받을 수 있다. 두 기관은 연구 자료와 시장 자료를 인공지능으로 결합하는 '마더테이스트' 사업의 방향도 함께 논의했다. 사업 규모와 기간은 공개되지 않았다.", "body": "한국식품산업클러스터진흥원(식품진흥원)과 한국식품연구원이 9월 9일 식품진흥원 본관에서 농식품 데이터 공동활용·교류 업무협약을 체결했고 9월 10일 보도됨, 협약은 식품연구원의 '식품 연구데이터 플랫폼'과 식품진흥원의 '디지털 식품정보 플랫폼'을 단계적으로 연계하고 데이터 목록과 메타데이터를 공유하며, 연구데이터를 기업 제품 개발에 활용하고 기업 데이터를 연구개발에 되쓰는 것을 내용으로 한다고 보도됨, 협약식 뒤 기술교류회에서 두 기관이 연구데이터 관리계획(DMP)을 공유하고 차세대 식품 데이터 사업 '마더테이스트'의 기획 방향을 논의했다고 보도됨, 마더테이스트는 연구 데이터와 시장 데이터를 AI 로 결합해 기업의 제품 개발과 해외시장 현지화를 지원하는 모형으로 소개됨, 김덕호 식품진흥원 이사장은 이번 협약을 연구와 기업 지원 현장을 데이터로 잇는 출발점이라고 밝힌 것으로 보도됐고 백현동 한국식품연구원 원장이 협약식에 참석함, 사업 규모·기간·예산은 제시되지 않았음", "src": "뉴시스 보도 9.10", "pd": "2026-09-10", "url": "https://www.livesnews.com/news/article.html?no=64061"}, {"sec": 6, "t": "美 전미경제연구소, AI 연구자 4만 2천 명 20년 추적 결과 공개", "k": "산업계로 옮긴 연구자는 논문을 덜 내고 특허를 더 내는 것으로 나타났다", "ez": "미국 전미경제연구소가 인공지능 연구자 4만 2천 명이 20년 동안 어디에서 일하고 무엇을 냈는지 추적한 분석을 내놓았고, 과학 학술지 네이처가 9월 10일 이를 다뤘다. 논문 기록과 정부가 가진 고용 자료를 이어 붙여 같은 사람을 계속 따라간 것이 이 연구의 방식이다. 가장 눈에 띄는 수치는 임금이다. 논문을 내는 산업계 연구자 가운데 상위 1%는 조건이 비슷한 대학 연구자보다 해마다 150만 달러, 약 21억 원을 더 받는다. 이 차이는 2001년의 다섯 배로 벌어졌다. 돈보다 중요한 것은 결과물의 성격이 바뀐다는 점이다. 산업계로 자리를 옮긴 연구자는 논문을 덜 내고 특허를 더 낸다. 누구나 읽을 수 있는 형태로 지식을 내놓던 사람이 회사가 소유하는 형태로 내놓게 된다는 뜻이다. 산업계는 더 젊고 외국에서 태어난 연구자를 많이 데려갔고, 성별 구성의 개선은 대학 쪽에서 더 크게 나타났다.", "body": "美 전미경제연구소(NBER) 작업논문 「Attention (And Money) Is All You Need」(작업논문 34964, 우푸크 아크지이트 시카고대 등 4인)의 분석 결과를 네이처 뉴스면이 9월 10일 다루면서 국내 지면에 도달했음, 논문은 학술 논문 기록과 美 인구조사국의 고용주·피고용인 자료를 연결한 새 자료집합을 만들어 AI 연구자 4만 2천 명을 20년에 걸쳐 추적했음, 논문에 따르면 논문을 내는 산업계 과학자 가운데 상위 1% 는 조건이 비슷한 학계 연구자보다 해마다 150만 달러(약 21억 원)를 더 벌고 있고 이 격차는 2001년 이후 다섯 배로 벌어졌음, 임금 할증이 커지는 것과 대형 기존 기업으로 인력이 몰리는 현상이 함께 나타났고, 산업계로 옮긴 연구자는 논문을 덜 내는 대신 특허를 더 내는 것으로 관측돼 개방과학에서 독점적 혁신으로 무게가 옮겨간 것과 부합한다고 논문은 기술했음, 산업계는 더 젊고 외국 출생인 연구자를 더 많이 끌어들이는 반면 성별 구성의 개선은 학계에서 더 크게 나타났음, NBER 작업논문은 동료심사를 거치지 않은 논의용 원고임을 논문 서두가 밝히고 있음", "src": "네이처 보도 9.10 · 작업논문", "pd": "2026-09-10", "url": "https://www.nature.com/articles/d41586-026-02026-1", "durl": "https://www.nber.org/system/files/working_papers/w34964/w34964.pdf"}, {"sec": 7, "t": "대전시, AI혁신전략위원회 출범… KAIST 연구부총장이 공동위원장", "k": "대덕특구를 관할하는 지자체가 인공지능 정책을 한 기구로 모았다", "ez": "대전시가 인공지능 정책을 한 곳에서 결정할 기구를 만들었다. 9월 10일 첫 회의를 열었고 11일 이를 발표했다. 위원장은 허태정 시장과 최성율 KAIST 연구부총장이 함께 맡는다. 위원은 모두 12명이다. 위성영상 기업 SIA, 물류로봇 기업 트위니, 반도체 기업 파네시아의 대표와 대학 교수들, 한국전자통신연구원의 피지컬AI연구소장이 민간위원으로 들어갔다. 대덕연구단지가 있는 도시라는 점이 위원 구성에 그대로 드러난다. 위원회는 대전시 인공지능 정책의 기본계획을 세우고 성과를 평가하며 제도를 고치는 일을 맡는다. 아래에는 사회·행정, 도시·안전, 과학·산업, 교육·인재·윤리 네 개 분과를 두었다. 국방 인공지능 전환 단지 조성과 인공지능 반도체 거점 육성이 주요 과제로 제시됐고, 인공지능 기본조례는 2027년 1월 공포할 예정이다.", "body": "대전시가 9월 10일 시청 중회의실에서 'AI혁신전략위원회' 제1차 회의를 열어 위원을 위촉하고 인공지능 혁신전략 추진계획을 논의했으며 9월 11일 이를 발표했음, 위원회는 허태정 대전시장과 최성율 KAIST 연구부총장이 공동위원장을 맡고 산업계·학계·연구계 전문가와 대전시 실·국장 등 12명으로 구성됨, 민간위원에는 전태균 SIA 대표, 천홍석 트위니 대표, 정명수 파네시아 대표, 이은구 한남대 교수, 이영주 KAIST 교수, 임성수 충남대 교수, 고영주 아시아기술혁신학회장, 유원필 ETRI 피지컬AI연구소장이 포함된 것으로 보도됨, 위원회는 대전시 AI 정책 기본계획 수립과 성과 평가, 제도 개선, 기반 확충을 논의하는 기구로 규정됐고 사회·행정, 도시·안전, 과학·산업, 교육·인재·윤리 네 개 분과위원회와 실무 협의체를 두기로 했음, 국방 AI 전환 클러스터 조성과 AI 반도체 거점 육성, 스마트 재난·안전망, 행정 인공지능 전환이 주요 과제로 제시됐고 인공지능 기본조례는 2027년 1월 공포 예정으로 보도됨", "src": "대전시 발표 9.11 · 대덕넷 보도", "pd": "2026-09-11", "url": "https://www.daejeon.go.kr/drh/board/boardNormalView.do?ntatcSeq=1522301446&menuSeq=1632&boardId=normal_0189", "murl": "https://www.hellodd.com/news/articleView.html?idxno=113140"}, {"sec": 7, "t": "케이메디허브, 인공지능 활용 혁신신약 발굴사업 성과교류회 개최", "k": "5년짜리 국가 AI 신약 사업이 종료 넉 달을 앞두고 결과를 모았다", "ez": "대구경북첨단의료산업진흥재단이 인공지능으로 새 약의 후보물질을 찾는 국가사업의 성과를 모아 9월 8일 발표회를 열었고 10일 이를 알렸다. 2022년에 시작해 올해 12월에 끝나는 5년짜리 사업이다. 이 사업의 목표는 두 가지다. 하나는 누구나 쓸 수 있는 공공 플랫폼을 만들어 인공지능으로 약물 후보를 골라내는 것이고, 다른 하나는 그 플랫폼을 실제 연구에 적용해 쓸 만한지 확인하는 것이다. 발표회에는 과학기술정보통신부와 한국연구재단, 참여 기업과 대학 관계자 16명이 모였다. 신약 기업과 제약회사, 대학이 각각 인공지능을 어떻게 후보물질 탐색에 썼는지 사례를 내놓았다. 다만 후보물질을 몇 건 찾았는지, 플랫폼을 얼마나 썼는지 같은 수치는 공개되지 않았다.", "body": "대구경북첨단의료산업진흥재단(케이메디허브)이 9월 8일 서울 노보텔 앰배서더 동대문에서 '인공지능 활용 혁신신약 발굴사업' 성과교류회를 열었고 9월 10일 이를 발표했음, 이 사업은 과학기술정보통신부가 주관하고 한국연구재단이 지원하며 2022년부터 2026년 12월까지 5년간 추진되는 국가사업으로, 인공지능 신약개발 공공 플랫폼을 고도화하고 이를 실제 연구에 적용해 후보물질 발굴 효율을 높이는 것을 목적으로 한다고 보도됨, 행사에는 과기정통부와 한국연구재단, 참여 산·학·연 관계자 등 16명이 참석했고 세부 과제별 성과 발표와 AI 신약개발 생태계 구축 전략 논의가 이뤄졌다고 보도됨, 아론티어 고준수 대표와 아이젠사이언스 김선규 본부장이 산업 동향과 기술 발전 방향을 발표했고 삼진제약 이수민 연구센터장과 연세대 박상현 교수가 AI 기술을 접목한 후보물질 발굴 과정과 적용 사례를 발표한 것으로 보도됨, 후보물질 수·성공률·플랫폼 이용 실적 등 성과를 가늠할 수 있는 수치는 제시되지 않았음", "src": "팜뉴스 보도 9.10", "pd": "2026-09-10", "url": "https://www.pharmnews.com/news/articleView.html?idxno=306180"}, {"sec": 3, "t": "美 아르곤연·미시간대·OpenAI, 과학 난제 지도 '챌린지 아틀라스' 공개", "k": "어떤 난제를 얼마의 계산으로 풀 수 있는지 값을 매긴 지도가 나왔다", "ez": "미국 아르곤국립연구소와 미시간대, OpenAI의 연구자들이 인공지능이 풀 만한 과학 난제를 골라 목록으로 내놓았다. 이름은 '사이언티픽 챌린지 아틀라스'이고, 과학 학술지 사이언스가 9월 10일 이를 다뤘다. 새로 실험을 하지 않아도 이미 쌓여 있는 자료만으로 답이 나올 수 있는 문제를 고른 것이 특징이다. 목록을 만든 방식이 눈에 띈다. 먼저 인공지능에게 최근 논문을 읽게 해 스스로 풀 만한 문제를 제안하게 했다. 그다음 이미 발표된 논문의 결과를 그대로 다시 만들어 보게 했다. 아는 답을 되짚는 데 힘이 얼마나 드는지 재어 두면, 모르는 답을 내는 데 얼마가 들지 가늠할 수 있기 때문이다. 그렇게 해서 문제마다 값이 붙었다. 한 축은 인공지능이 생각하는 양이고 다른 축은 슈퍼컴퓨터를 쓰는 시간이다. 첫 네 문제는 모두 물리다. 그중 하나는 양자역학과 중력을 하나로 잇는 이론이 극한 조건에서도 버티는지 확인하는 계산인데, 적분을 300만 번 넘게 해야 하고 물리학자들이 16년 넘게 손을 대지 못한 문제다.", "body": "美 아르곤국립연구소 릭 스티븐스 부소장과 미시간대 카르틱 두라이사미 교수, OpenAI 제이슨 프루에가 공동으로 조직한 과학 난제 목록 '사이언티픽 챌린지 아틀라스(Scientific Challenge Atlas)'가 공개됐다고 사이언스 뉴스면이 9월 10일 보도함, 아틀라스는 이미 축적된 데이터만으로 AI 가 새로운 결과를 끌어낼 수 있는 과학 문제를 골라 모은 목록으로, 첫 네 문제는 모두 물리 분야이고 복잡한 양자 계산을 확정하는 것부터 특수한 기하 공간이 얼마나 복잡해질 수 있는지 한계를 찾는 것까지를 다룬다고 보도됨, 만드는 방식은 AI 에이전트가 자신의 지식과 최근 논문을 검토해 새롭고 풀 만한 문제를 먼저 제안하게 한 뒤 같은 에이전트에게 이미 발표된 논문의 결과를 재현하게 해 난이도의 눈금을 잡는 것이었다고 보도됨 — 기존 결과를 어느 정도 노력으로 재현하는지를 보고 새 결과를 내는 데 드는 노
