window.AI4S.editions = [{"date": "2026-09-11", "items": [{"sec": 1, "t": "美 NSF, 연구지원 체계 개편안 발표하며 프런티어 이니셔티브 4개 신설", "k": "연구비를 나누는 방식 자체를 바꾸고 인공지능 활용 연구를 별도 축으로 세웠음", "ez": "미국 국립과학재단이 연구비를 나누는 방식을 다시 짜겠다고 9월 10일 밝혔다. 지금까지 여러 창구가 뒤섞여 있던 것을, 앞으로는 새로운 지식을 찾는 연구, 기술로 옮기는 연구, 시설을 짓는 일, 사람을 기르는 일 넷으로 갈라 창구마다 목적을 하나씩만 두기로 했다. 연구의 성격에 따라 지원 방식도 달리한다. 오래 걸리는 연구에는 5년이 넘는 기간을 주고, 짧게 확인할 수 있는 모험적 시도에는 몇 쪽짜리 신청서로 빠르게 결정한다. 심사에서는 위원들의 합의를 얻지 못한 제안이라도 한 명이 강하게 지지하면 통과시킬 수 있는 장치를 시험하고, 연구비 제도가 실제로 효과를 냈는지 따로 검증하는 조직도 새로 만든다. 인공지능은 별도의 축으로 세웠다. 로봇이 실험을 대신 수행하는 자율실험실을 전국 규모로 묶고, 기계가 곧바로 학습할 수 있게 정리한 연구 데이터를 늘린다. 연구비 1달러가 만들어 내는 성과를 2036년까지 두 배로 올린다는 목표도 함께 적었다.", "body": "美 국립과학재단(NSF)이 9월 10일 브라이언 스톤 원장 직무대행 명의로 과학기술계 앞 성명 「새로운 과학 황금기의 NSF 리더십」을 발표했음, 연구비 지원 창구를 발견연구·중개연구·연구인프라·인재양성 네 갈래로 갈라 창구마다 목적을 하나씩만 지게 하고, 지원 기간·지정 정도·심사 기전·기관 형태를 연구의 성격에 맞춰 달리 적용하는 포트폴리오 방식을 제시했음, 5년 이상 장기 과제 신청 창구를 넓히고 그 유연성을 8월 17일 공개한 15억 달러(약 2조 1천억 원) 규모 핵심 발견연구 공모에 이미 반영했다고 밝혔음, 짧은 기간의 탐색형 지원은 몇 쪽 분량 신청서로 신속히 결정하는 경로를 확대한다고 적었음, 심사에서는 합의에 이르지 못한 제안을 심사위원 한 명이 통과시킬 수 있는 「골든 티켓」과 분산심사를 시험함, 자체 평가와 개선을 전담하는 메타사이언스실(OMS)을 원장실 안에 신설해 연구비 기전의 효과를 공개 보고하고 실패한 시도의 사후분석까지 공개하겠다고 했으며, 2036년까지 연방 연구비 1달러당 과학 생산성과 영향을 두 배로 만든다는 목표를 명시했음, 학제 간 조정을 맡을 프런티어 이니셔티브 네 갈래를 처음 지정했음 — 지능의 미래, 양자현상 프런티어, 첨단소재·물질, 생물학적 설계의 기초, AI 관련해서는 제네시스 미션 조정에 기관 관계망을 투입한다고 밝히며 동료기관 서한(DCL)을 이미 발송하고 핵심 발견연구 공모에 AI 활용을 장려하는 문구를 넣었다고 적었음, 프로그램 가능 클라우드 실험실 국가 네트워크와 자율주행 실험실 투자, AI 학습이 가능한 데이터셋, 차세대 연구데이터 기반, 국가AI연구자원(NAIRR)과 주·지역 AI 인프라 허브의 연계를 AI 시대 연구 인프라의 축으로 들었음", "src": "NSF 발표 9.10 · 성명문", "pd": "2026-09-10", "url": "https://nsf.gov/news/nsf-leadership-new-golden-age-science", "durl": "https://nsf-gov-resources.nsf.gov/files/Statement-NSF-Leadership-Golden-Age-Science.pdf"}, {"sec": 2, "t": "KISTI, 대전~시카고 국가과학기술연구망 국제회선 400Gbps 개통", "k": "국내에서 미국으로 대용량 연구자료를 보내는 시간이 4분의 1로 줄었음", "ez": "한국과학기술정보연구원이 대전과 미국 시카고를 잇는 연구 전용 회선의 속도를 네 배로 올려 9월 10일 개통했다. 국가과학기술연구망은 대학과 연구기관이 실험 자료를 주고받는 데 쓰는 전용 통신망으로 일반 인터넷과는 따로 운영된다. 속도는 초당 100기가비트에서 400기가비트로 올라갔다. 100테라바이트 분량, 곧 고화질 영화 수만 편에 해당하는 자료를 보낼 때 예전에는 2시간 13분이 걸렸으나 이제 33분이면 끝난다. 태평양을 건너는 1만 킬로미터 넘는 구간에서 이 속도를 유지한 것은 국내에서 처음이다. 시카고 쪽 끝은 노스웨스턴대가 운영하는 국제 연구망 중계 지점에 연결돼 있어 북미와 남미, 유럽의 연구망까지 같은 속도로 닿는다. 인공지능 학습 자료와 천문·우주, 고에너지물리, 바이오처럼 자료 크기가 큰 분야에서 쓰임이 클 것으로 제시됐다.", "body": "한국과학기술정보연구원(KISTI)이 9월 10일 국가과학기술연구망(KREONET)의 대전~미국 시카고 국제백본망을 기존 100Gbps 에서 400Gbps 로 넓혀 개통했다고 발표했음, 민간 통신사와 공공 부문을 통틀어 국내에서 처음 구축된 단일 파장당 400Gbps 급 국제회선이며, 태평양을 건너는 1만 킬로미터 이상 구간에서 단일 400Gbps 전송 품질을 확보하고 실제 연구 트래픽 환경에서 성능을 검증했다고 적었음, 100테라바이트 규모 자료를 보낼 때 기존 환경에서는 약 2시간 13분이 걸렸으나 이번 회선에서는 약 33분으로 줄어듦, 시카고 쪽 종단은 노스웨스턴대 국제첨단인터넷연구센터(iCAIR)가 운영하는 스타라이트 국제연구망 허브이고 이를 통해 북미·남미·유럽 연구망까지 같은 속도로 닿음, KREONET 백본망의 최대 전송용량은 1.2Tbps 이고 국내 지역망센터 18곳과 전세계 약 3만 개 연구네트워크를 잇고 있음, AI 학습데이터를 비롯해 천문·우주, 고에너지물리, 바이오 등 수십 테라바이트에서 페타바이트급 자료를 다루는 분야의 활용을 목적으로 들었음, 개통 기념식은 9월 8일 열렸고 조 맘브레티 iCAIR 센터장과 조부승 KISTI 과학기술연구망센터장이 참석해 차세대 국제 공동연구의 기반이라고 밝혔음", "src": "KISTI 발표 9.10 · 쿠키뉴스 보도", "pd": "2026-09-10", "url": "https://www.kisti.re.kr/promote/post/news/7104", "murl": "https://www.kukinews.com/article/view/kuk202609100045"}, {"sec": 2, "t": "식품진흥원·한국식품연구원, 농식품 데이터 공동활용 협약 체결", "k": "연구실 자료와 기업 자료를 서로 되쓰게 하는 통로를 열었음", "ez": "한국식품산업클러스터진흥원과 한국식품연구원이 9월 9일 농식품 데이터를 함께 쓰기로 협약을 맺었다. 연구기관이 실험에서 쌓은 자료와 기업 지원기관이 모은 시장 자료를 서로 열어 주는 것이 핵심이다. 두 기관은 각자 운영하던 데이터 플랫폼을 단계적으로 연결하고, 어떤 자료를 갖고 있는지 목록과 설명을 먼저 공유하기로 했다. 연구실에서 나온 자료는 기업의 제품 개발에 쓰이고, 기업이 모은 자료는 다시 연구개발에 쓰이는 구조다. 협약식 뒤에는 연구데이터 관리계획을 서로 공개했다. 연구데이터 관리계획은 연구 과정에서 나온 자료를 어떤 형식으로 남기고 누구에게 공개할지 미리 정해 두는 문서로, 이것이 맞아야 기관 사이에서 자료를 주고받을 수 있다. 두 기관은 연구 자료와 시장 자료를 인공지능으로 결합하는 '마더테이스트' 사업의 방향도 함께 논의했다. 사업 규모와 기간은 공개되지 않았다.", "body": "한국식품산업클러스터진흥원(식품진흥원)과 한국식품연구원이 9월 9일 식품진흥원 본관에서 농식품 데이터 공동활용·교류 업무협약을 체결했고 9월 10일 보도됨, 협약은 식품연구원의 '식품 연구데이터 플랫폼'과 식품진흥원의 '디지털 식품정보 플랫폼'을 단계적으로 연계하고 데이터 목록과 메타데이터를 공유하며, 연구데이터를 기업 제품 개발에 활용하고 기업 데이터를 연구개발에 되쓰는 것을 내용으로 한다고 보도됨, 협약식 뒤 기술교류회에서 두 기관이 연구데이터 관리계획(DMP)을 공유하고 차세대 식품 데이터 사업 '마더테이스트'의 기획 방향을 논의했다고 보도됨, 마더테이스트는 연구 데이터와 시장 데이터를 AI 로 결합해 기업의 제품 개발과 해외시장 현지화를 지원하는 모형으로 소개됨, 김덕호 식품진흥원 이사장은 이번 협약을 연구와 기업 지원 현장을 데이터로 잇는 출발점이라고 밝힌 것으로 보도됐고 백현동 한국식품연구원 원장이 협약식에 참석함, 사업 규모·기간·예산은 제시되지 않았음", "src": "뉴시스 보도 9.10", "pd": "2026-09-10", "url": "https://www.livesnews.com/news/article.html?no=64061"}, {"sec": 6, "t": "美 전미경제연구소, AI 연구자 4만 2천 명 20년 추적 결과 공개", "k": "산업계로 옮긴 연구자는 논문을 덜 내고 특허를 더 내는 것으로 나타났음", "ez": "미국 전미경제연구소가 인공지능 연구자 4만 2천 명이 20년 동안 어디에서 일하고 무엇을 냈는지 추적한 분석을 내놓았고, 과학 학술지 네이처가 9월 10일 이를 다뤘다. 논문 기록과 정부가 가진 고용 자료를 이어 붙여 같은 사람을 계속 따라간 것이 이 연구의 방식이다. 가장 눈에 띄는 수치는 임금이다. 논문을 내는 산업계 연구자 가운데 상위 1%는 조건이 비슷한 대학 연구자보다 해마다 150만 달러, 약 21억 원을 더 받는다. 이 차이는 2001년의 다섯 배로 벌어졌다. 돈보다 중요한 것은 결과물의 성격이 바뀐다는 점이다. 산업계로 자리를 옮긴 연구자는 논문을 덜 내고 특허를 더 낸다. 누구나 읽을 수 있는 형태로 지식을 내놓던 사람이 회사가 소유하는 형태로 내놓게 된다는 뜻이다. 산업계는 더 젊고 외국에서 태어난 연구자를 많이 데려갔고, 성별 구성의 개선은 대학 쪽에서 더 크게 나타났다.", "body": "美 전미경제연구소(NBER) 작업논문 「Attention (And Money) Is All You Need」(작업논문 34964, 우푸크 아크지이트 시카고대 등 4인)의 분석 결과를 네이처 뉴스면이 9월 10일 다루면서 국내 지면에 도달했음, 논문은 학술 논문 기록과 美 인구조사국의 고용주·피고용인 자료를 연결한 새 자료집합을 만들어 AI 연구자 4만 2천 명을 20년에 걸쳐 추적했음, 논문에 따르면 논문을 내는 산업계 과학자 가운데 상위 1% 는 조건이 비슷한 학계 연구자보다 해마다 150만 달러(약 21억 원)를 더 벌고 있고 이 격차는 2001년 이후 다섯 배로 벌어졌음, 임금 할증이 커지는 것과 대형 기존 기업으로 인력이 몰리는 현상이 함께 나타났고, 산업계로 옮긴 연구자는 논문을 덜 내는 대신 특허를 더 내는 것으로 관측돼 개방과학에서 독점적 혁신으로 무게가 옮겨간 것과 부합한다고 논문은 기술했음, 산업계는 더 젊고 외국 출생인 연구자를 더 많이 끌어들이는 반면 성별 구성의 개선은 학계에서 더 크게 나타났음, NBER 작업논문은 동료심사를 거치지 않은 논의용 원고임을 논문 서두가 밝히고 있음", "src": "네이처 보도 9.10 · 작업논문", "pd": "2026-09-10", "url": "https://www.nature.com/articles/d41586-026-02026-1", "durl": "https://www.nber.org/system/files/working_papers/w34964/w34964.pdf"}, {"sec": 7, "t": "대전시, AI혁신전략위원회 출범… KAIST 연구부총장이 공동위원장", "k": "대덕특구를 관할하는 지자체가 인공지능 정책을 한 기구로 모았음", "ez": "대전시가 인공지능 정책을 한 곳에서 결정할 기구를 만들었다. 9월 10일 첫 회의를 열었고 11일 이를 발표했다. 위원장은 허태정 시장과 최성율 KAIST 연구부총장이 함께 맡는다. 위원은 모두 12명이다. 위성영상 기업 SIA, 물류로봇 기업 트위니, 반도체 기업 파네시아의 대표와 대학 교수들, 한국전자통신연구원의 피지컬AI연구소장이 민간위원으로 들어갔다. 대덕연구단지가 있는 도시라는 점이 위원 구성에 그대로 드러난다. 위원회는 대전시 인공지능 정책의 기본계획을 세우고 성과를 평가하며 제도를 고치는 일을 맡는다. 아래에는 사회·행정, 도시·안전, 과학·산업, 교육·인재·윤리 네 개 분과를 두었다. 국방 인공지능 전환 단지 조성과 인공지능 반도체 거점 육성이 주요 과제로 제시됐고, 인공지능 기본조례는 2027년 1월 공포할 예정이다.", "body": "대전시가 9월 10일 시청 중회의실에서 'AI혁신전략위원회' 제1차 회의를 열어 위원을 위촉하고 인공지능 혁신전략 추진계획을 논의했으며 9월 11일 이를 발표했음, 위원회는 허태정 대전시장과 최성율 KAIST 연구부총장이 공동위원장을 맡고 산업계·학계·연구계 전문가와 대전시 실·국장 등 12명으로 구성됨, 민간위원에는 전태균 SIA 대표, 천홍석 트위니 대표, 정명수 파네시아 대표, 이은구 한남대 교수, 이영주 KAIST 교수, 임성수 충남대 교수, 고영주 아시아기술혁신학회장, 유원필 ETRI 피지컬AI연구소장이 포함된 것으로 보도됨, 위원회는 대전시 AI 정책 기본계획 수립과 성과 평가, 제도 개선, 기반 확충을 논의하는 기구로 규정됐고 사회·행정, 도시·안전, 과학·산업, 교육·인재·윤리 네 개 분과위원회와 실무 협의체를 두기로 했음, 국방 AI 전환 클러스터 조성과 AI 반도체 거점 육성, 스마트 재난·안전망, 행정 인공지능 전환이 주요 과제로 제시됐고 인공지능 기본조례는 2027년 1월 공포 예정으로 보도됨", "src": "대전시 발표 9.11 · 대덕넷 보도", "pd": "2026-09-11", "url": "https://www.daejeon.go.kr/drh/board/boardNormalView.do?ntatcSeq=1522301446&menuSeq=1632&boardId=normal_0189", "murl": "https://www.hellodd.com/news/articleView.html?idxno=113140"}, {"sec": 7, "t": "케이메디허브, 인공지능 활용 혁신신약 발굴사업 성과교류회 개최", "k": "5년짜리 국가 AI 신약 사업이 종료 넉 달을 앞두고 결과를 모았음", "ez": "대구경북첨단의료산업진흥재단이 인공지능으로 새 약의 후보물질을 찾는 국가사업의 성과를 모아 9월 8일 발표회를 열었고 10일 이를 알렸다. 2022년에 시작해 올해 12월에 끝나는 5년짜리 사업이다. 이 사업의 목표는 두 가지다. 하나는 누구나 쓸 수 있는 공공 플랫폼을 만들어 인공지능으로 약물 후보를 골라내는 것이고, 다른 하나는 그 플랫폼을 실제 연구에 적용해 쓸 만한지 확인하는 것이다. 발표회에는 과학기술정보통신부와 한국연구재단, 참여 기업과 대학 관계자 16명이 모였다. 신약 기업과 제약회사, 대학이 각각 인공지능을 어떻게 후보물질 탐색에 썼는지 사례를 내놓았다. 다만 후보물질을 몇 건 찾았는지, 플랫폼을 얼마나 썼는지 같은 수치는 공개되지 않았다.", "body": "대구경북첨단의료산업진흥재단(케이메디허브)이 9월 8일 서울 노보텔 앰배서더 동대문에서 '인공지능 활용 혁신신약 발굴사업' 성과교류회를 열었고 9월 10일 이를 발표했음, 이 사업은 과학기술정보통신부가 주관하고 한국연구재단이 지원하며 2022년부터 2026년 12월까지 5년간 추진되는 국가사업으로, 인공지능 신약개발 공공 플랫폼을 고도화하고 이를 실제 연구에 적용해 후보물질 발굴 효율을 높이는 것을 목적으로 한다고 보도됨, 행사에는 과기정통부와 한국연구재단, 참여 산·학·연 관계자 등 16명이 참석했고 세부 과제별 성과 발표와 AI 신약개발 생태계 구축 전략 논의가 이뤄졌다고 보도됨, 아론티어 고준수 대표와 아이젠사이언스 김선규 본부장이 산업 동향과 기술 발전 방향을 발표했고 삼진제약 이수민 연구센터장과 연세대 박상현 교수가 AI 기술을 접목한 후보물질 발굴 과정과 적용 사례를 발표한 것으로 보도됨, 후보물질 수·성공률·플랫폼 이용 실적 등 성과를 가늠할 수 있는 수치는 제시되지 않았음", "src": "팜뉴스 보도 9.10", "pd": "2026-09-10", "url": "https://www.pharmnews.com/news/articleView.html?idxno=306180"}, {"sec": 3, "t": "美 아르곤연·미시간대·OpenAI, 과학 난제 지도 '챌린지 아틀라스' 공개", "k": "어떤 난제를 얼마의 계산으로 풀 수 있는지 값을 매긴 지도가 나왔음", "ez": "미국 아르곤국립연구소와 미시간대, OpenAI의 연구자들이 인공지능이 풀 만한 과학 난제를 골라 목록으로 내놓았다. 이름은 '사이언티픽 챌린지 아틀라스'이고, 과학 학술지 사이언스가 9월 10일 이를 다뤘다. 새로 실험을 하지 않아도 이미 쌓여 있는 자료만으로 답이 나올 수 있는 문제를 고른 것이 특징이다. 목록을 만든 방식이 눈에 띈다. 먼저 인공지능에게 최근 논문을 읽게 해 스스로 풀 만한 문제를 제안하게 했다. 그다음 이미 발표된 논문의 결과를 그대로 다시 만들어 보게 했다. 아는 답을 되짚는 데 힘이 얼마나 드는지 재어 두면, 모르는 답을 내는 데 얼마가 들지 가늠할 수 있기 때문이다. 그렇게 해서 문제마다 값이 붙었다. 한 축은 인공지능이 생각하는 양이고 다른 축은 슈퍼컴퓨터를 쓰는 시간이다. 첫 네 문제는 모두 물리다. 그중 하나는 양자역학과 중력을 하나로 잇는 이론이 극한 조건에서도 버티는지 확인하는 계산인데, 적분을 300만 번 넘게 해야 하고 물리학자들이 16년 넘게 손을 대지 못한 문제다.", "body": "美 아르곤국립연구소 릭 스티븐스 부소장과 미시간대 카르틱 두라이사미 교수, OpenAI 제이슨 프루에가 공동으로 조직한 과학 난제 목록 '사이언티픽 챌린지 아틀라스(Scientific Challenge Atlas)'가 공개됐다고 사이언스 뉴스면이 9월 10일 보도함, 아틀라스는 이미 축적된 데이터만으로 AI 가 새로운 결과를 끌어낼 수 있는 과학 문제를 골라 모은 목록으로, 첫 네 문제는 모두 물리 분야이고 복잡한 양자 계산을 확정하는 것부터 특수한 기하 공간이 얼마나 복잡해질 수 있는지 한계를 찾는 것까지를 다룬다고 보도됨, 만드는 방식은 AI 에이전트가 자신의 지식과 최근 논문을 검토해 새롭고 풀 만한 문제를 먼저 제안하게 한 뒤 같은 에이전트에게 이미 발표된 논문의 결과를 재현하게 해 난이도의 눈금을 잡는 것이었다고 보도됨 — 기존 결과를 어느 정도 노력으로 재현하는지를 보고 새 결과를 내는 데 드는 노력을 역산하는 방식임, 그 결과 추론량(토큰)을 한 축에 두고 슈퍼컴퓨팅 시간을 다른 축에 둔 과학 문제 공간의 시제품 지도가 만들어졌고 문제마다 대략의 값이 매겨졌다고 보도됨, 예시로 제시된 물리 문제는 양자역학과 중력을 화해시키는 이론이 극한 조건에서도 성립하는지 확인하기 위해 계산을 일곱 번째 '루프'까지 밀어붙이는 것으로, 300만 개가 넘는 적분이 필요하고 물리학자들이 16년 넘게 멈춰 있는 문제이며 조직자들은 AI 가 이를 10억~100억 토큰 규모로 추격할 수 있다고 추정했다고 보도됨, 다만 다른 검토자들은 최전선에서 그런 추정을 외삽하기는 어렵다는 의견을 낸 것으로 보도됨, 조직자들은 첫 문제들이 OpenAI 가 나비에·스토크스 문제에 들인 수백만 달러 규모 투자보다 한두 자릿수 적은 노력으로 풀릴 것으로 본다고 보도됨, 스티븐스 부소장은 이미 가진 데이터만으로 발굴을 기다리는 과학적 발견이 있는지를 묻는 것이 출발점이었다고 밝힌 것으로 보도됨", "src": "사이언스 보도 9.10", "pd": "2026-09-10", "url": "https://www.science.org/content/article/what-science-problem-should-ai-tackle-next-new-challenge-atlas-offers-answers"}]}, {"date": "2026-09-10", "items": [{"sec": 3, "t": "시류대·베이징대, 단백질 3,800만 건 학습한 가상세포 모델 공개", "k": "약을 환자에게 투여하기 전에 어느 약이 효과를 낼지 계산으로 선별한다.", "ez": "세포에 약물을 투여하면 그 안의 단백질이 시간에 따라 반응한다. 연구진은 유방암 세포에 자극을 체계적으로 가한 뒤 단백질의 양이 어떻게 변화하는지를 3,800만 회 이상 측정했고, 그 기록으로 '프로틴토크스'라는 모델을 학습시켰다. 한 시점의 정지된 상태가 아니라 변화하는 궤적을 학습했다는 점이 기존 방식과 다르다. 이 모델은 어떤 약물이 효과를 낼지, 두 약물을 함께 사용하면 작용이 커질지, 약물에 내성을 유발하는 단백질이 무엇인지를 예측한다. 세포주에서만 작동한 것이 아니라 환자에게서 채취한 조직으로 배양한 오가노이드와 실제 임상 생검에서도 작동했다. 다만 저자 일부는 관련 기업의 임직원이거나 주주여서 그 이해관계를 논문에 함께 명시했다.", "body": "시류대(Westlake University) 의학프로테오믹스국가중점연구실과 베이징대 기계학습연구센터 등이 9월 9일 네이처에 가상세포 모델 '프로틴토크스(ProteinTalks)' 를 게재했음, 유방암 세포주에 섭동을 체계적으로 가한 뒤 시간에 따라 단백질 존재량을 측정한 자료를 3,800만 건 이상 생산해 학습에 사용했음, 모델은 신경 상미분방정식(neural ODE) 기반이고 단백질 네트워크가 시간에 따라 변화하는 궤적에서 전이 가능한 잠재 표현을 학습하는 사전학습 틀을 두었음, 논문에 따르면 이 모델은 약물 효능과 병용 시너지 예측, 새 약물 조합 발굴, 내성 관련 단백질 규명, 환자 반응 층화, 환자 유래 오가노이드의 약물 후보 우선순위 지정에 적용됐고, 세포주를 넘어 환자 유래 오가노이드와 임상 생검으로도 전이돼 비교 대상으로 삼은 기존 구현들보다 평가 규약 아래에서 대체로 높은 성능을 보였다고 기술했음, 제1저자는 시류대 쑨루이이고 교신저자는 베이징대 저우페이제·DP테크놀로지 원한·시류대 주이·시류대 궈톈난임, 저자 일부가 웨스트레이크오믹스와 DP테크놀로지의 임직원이거나 주주라는 이해관계를 논문에 함께 명시했음", "src": "네이처 게재 9.9 · 사전공개 원고", "pd": "2026-09-09", "url": "https://www.nature.com/articles/s41586-026-11001-9", "durl": "https://www.biorxiv.org/content/10.1101/2025.02.07.637070v1.full.pdf"}, {"sec": 3, "t": "UC 버클리, 종 계통수 반영한 유전체 언어모델 'GPN-Star' 공개", "k": "어떤 유전자 변이가 질병을 일으키는지 판별하는 정확도가 한 단계 상승했다.", "ez": "사람의 유전자에는 한 글자만 바뀐 변이가 무수히 존재하며, 그중 어떤 것이 질병과 관련되는지 판별하는 일이 어렵다. 지금까지 사용된 인공지능 모델은 사람의 언어를 다루던 구조를 그대로 차용한 까닭에 규모가 크고 계산 비용이 높으면서도 진화를 직접 계산하는 기존 방법에 미치지 못하는 경우가 있었다. 연구진은 여러 종의 유전체를 나란히 정렬해 비교한 자료와 종 사이의 분기를 나타낸 계통수를 모델 구조 안에 직접 반영했다. 오래 보존된 자리일수록 쉽게 변할 수 없는 자리라는 생물학의 원리를 모델이 스스로 활용하도록 한 것이다. 그 결과 단백질을 만드는 구간과 그렇지 않은 구간 모두에서 변이 해석 성능이 가장 우수했고, 생쥐·닭·초파리·예쁜꼬마선충·애기장대에서도 같은 틀이 작동했다.", "body": "미국 UC 버클리 통계학과·전산학부와 계산생물학센터 등이 9월 9일 네이처에 유전체 언어모델 'GPN-Star' 를 게재했음, 기존 유전체 언어모델은 자연어처리 구조를 차용해 모델 크기와 계산자원을 많이 요구하면서도 고전적 진화 모델에 미치지 못하는 경우가 있었다는 것이 논문의 문제의식임, GPN-Star 는 전장유전체 정렬과 종 계통수를 구조에 명시적으로 반영해 진화 관계를 모델이 직접 다루도록 했고 척추동물·포유류·영장류 세 진화 시간대의 정렬로 학습했음, 논문에 따르면 사람 유전체의 단백질 부호화 영역과 비부호화 영역 모두에서 변이 효과 예측 과제 전반에 최고 수준 성능을 보였고, 병원성 변이와 전장유전체 연관연구에서 미세지도화된 변이의 우선순위 지정에서 기존 방법을 크게 상회했으며 복합형질 유전력의 농축이 뚜렷했고 희귀변이 연관검정의 검정력을 향상시켰음, 사람 외에는 생쥐·닭·초파리·예쁜꼬마선충·애기장대 다섯 모델생물에 대해서도 학습해 틀의 일반성을 확인했음, 제1저자는 UC 버클리 예청중이고 교신저자는 UC 버클리 윤 송임, 공동저자 소속에 잭슨연구소와 독일암연구센터(DKFZ)가 포함됨", "src": "네이처 게재 9.9", "pd": "2026-09-09", "url": "https://www.nature.com/articles/s41586-026-11005-5"}]}, {"date": "2026-09-09", "items": [{"sec": 2, "t": "EuroHPC·스웨덴 NAISS, 중형 슈퍼컴 '아레니우스' 링셰핑대에 개소", "k": "유럽은 슈퍼컴 투자 비율대로 사용 시간을 나누고 과학용 AI 창구를 따로 열었다.", "ez": "유럽연합의 슈퍼컴퓨터 공동사업(EuroHPC)과 스웨덴 국가 슈퍼컴퓨팅 기관(NAISS)이 9월 8일 링셰핑대학교에서 슈퍼컴퓨터 '아레니우스'를 공식 개소했다. 성능은 60페타플롭스가 넘어 1초에 6경 번 이상 계산한다. 세계 성능 순위 42위, 전력 효율 순위 24위다. 사업비 6,850만 유로(약 1,070억 원) 가운데 최대 35%를 EU가, 나머지를 스웨덴이 냈다. 눈여겨볼 대목은 그다음이다. 두 기관은 돈을 낸 비율 그대로 사용 시간을 나눠 갖기로 했고, 신청 창구에 'AI for Science' 갈래를 따로 두었다. 과학 연구에 AI를 쓰려는 연구자가 별도로 신청하는 창구다.", "body": "유럽고성능컴퓨팅공동사업(EuroHPC JU)과 스웨덴 국가학술슈퍼컴퓨팅인프라(NAISS)가 9월 8일 링셰핑대에서 중형 슈퍼컴퓨터 '아레니우스(Arrhenius)' 개소식을 열었음, EuroHPC 발표 기준 성능은 60페타플롭스 이상이고 2026년 6월 TOP500 42위, 와트당 610억 연산 이상으로 Green500 24위임, NAISS 기술사양에 따르면 HPE 가 공급했고 CPU 파티션은 AMD Turin 128코어 424기, GPU 파티션은 노드 382개에 노드당 엔비디아 그레이스 호퍼 슈퍼칩 4기이며 GPU 파트의 HPL 실측은 66.8페타플롭스임, 저장은 러스터(Lustre) 파일시스템을 디스크 계층 25페타바이트(260GiB/s)와 플래시 계층 2페타바이트(4K 랜덤 읽기 1,500만 IOPS)로 나눠 두었음, 총사업비는 6,850만 유로(약 1,070억 원)이고 EuroHPC 가 디지털유럽 프로그램으로 최대 35%를, 나머지를 스웨덴 연구위원회가 NAISS 를 통해 부담함, 자원은 EuroHPC 와 NAISS 가 각자 투자 비율에 비례해 공동 관리하며 접근 경로는 AI for Science 접근 콜, 정규 접근 콜, 벤치마크·개발 모드로 나뉨, 지원은 RISE 와 ENCCS 가 맡고 시스템은 2026년 6월 초 가동에 들어갔음", "src": "EuroHPC JU 발표 9.8 · NAISS 기술사양", "pd": "2026-09-08", "url": "https://eurohpc-ju.europa.eu/eurohpc-ju-inaugurates-arrhenius-new-mid-range-supercomputer-together-naiss-sweden-2026-09-08_en", "durl": "https://www.naiss.se/resources/arrhenius-technical-description/"}, {"sec": 4, "t": "OpenAI, 유체 흐름 난제의 폭발 사례를 수학으로 증명", "k": "밀레니엄 문제 일곱 개 중 하나에서 외력이 없는 본안은 그대로 남았다.", "ez": "OpenAI가 9월 8일 여러 AI 에이전트를 동시에 운용해 수학 난제의 증명을 만들었다며 증명문을 공개했다. 다룬 것은 물과 공기의 흐름을 나타내는 '나비에·스토크스 방정식'으로, 얌전히 흐르던 유체의 속도가 갑자기 무한대로 치솟는 일이 가능한가를 묻는 밀레니엄 난제다. 증명문은 그런 경우를 하나 만들어 보였다. 정지한 유체에 밖에서 힘을 가하면 에너지는 일정 범위에 머무는데도 속도만 무한대로 치솟는 흐름을 구성할 수 있다는 것이다. 다만 문제가 풀린 것은 아니다. 네 갈래 답 가운데 힘을 가하는 경우인 (C)·(D)를 세웠을 뿐 정작 어려운 (A)·(B)는 남아 있다. 증명문은 본문 165쪽이며, 컴퓨터가 논리를 한 줄씩 검사할 수 있게 옮긴 판도 함께 공개한다고 밝혔다.", "body": "OpenAI 가 9월 8일 미공개 내부 모델이 조율하는 다중 에이전트 시스템으로 3차원 비압축성 나비에·스토크스 방정식의 유한시간 폭발(finite time blowup) 증명을 냈다고 발표하고 증명문 전문을 공개했음, 증명문 정리 1.1 은 모든 양의 점성계수에 대해 공간·시간에 컴팩트 지지된 매끄러운 외력과 정지 상태 초기조건에서 출발해 운동에너지는 유계로 유지하면서 유한시간에 속도가 무한대로 발산하는 해를 구성한다는 것이고, 저자들은 이것이 페퍼먼(Fefferman)의 밀레니엄 문제 서술에서 대안 (C)를, 3차원 원환면에서는 대안 (D)를 확립한다고 적었음, 즉 외력이 있는 경우이며 외력이 없는 경우를 다루는 대안 (A)·(B)는 그대로 남아 있음, 증명문은 본문 165쪽에 부록 셋을 붙인 분량이고 OpenAI 는 린(Lean) 형식화를 함께 공개한다고 밝혔음", "src": "OpenAI 증명문 9.8 · OpenAI 발표문", "pd": "2026-09-08", "url": "https://cdn.openai.com/pdf/32d9f210-8b73-45e0-91bc-82a30aef8a9a/navier-stokes.pdf", "durl": "https://openai.com/index/navier-stokes-solution/"}, {"sec": 3, "t": "구글 딥마인드, 단일염기변이 90억 개 예측 '알파지놈 아틀라스' 공개", "k": "유전자 변이 90억 개의 해석을 실험 대신 미리 계산해 공개 자산으로 내놓았다.", "ez": "구글 딥마인드가 9월 8일 '알파지놈 아틀라스'를 공개했다. 사람 유전체에서 일어날 수 있는 모든 한 글자 변화 90억 개가 몸에 어떤 영향을 주는지 미리 계산해 둔 자료다. 유전체는 네 글자가 길게 늘어선 문장과 같다. 한 글자가 바뀌어도 대개는 아무 일이 없지만 일부는 병의 원인이 되는데, 어느 것이 그런지 실험으로 하나씩 확인하기는 불가능하다. 딥마인드는 AI 모델로 90억 개를 전부 미리 계산해 영향의 크기를 점수 하나로 매겼고, 그동안 해석이 어려웠던 98%의 영역까지 함께 다뤘다. 자료는 1페타바이트로 알파폴드 단백질 데이터베이스의 30배가 넘는다. 시험에서는 기존 방법이 놓치던 유전 연관을 22% 더 찾아냈다. 학술 용도는 무료이고 상업 이용은 구글 클라우드를 거쳐야 하며, 아직 진료에 쓰도록 검증받은 것은 아니다.", "body": "구글 딥마인드가 9월 8일 인간 유전체에서 일어날 수 있는 모든 단일염기변이 90억 개의 분자 수준 영향을 미리 계산해 담은 '알파지놈 아틀라스(AlphaGenome Atlas)' 를 공개했음, 기반 모델 알파지놈은 최대 100만 염기쌍 길이의 서열을 읽어 유전자 발현·RNA 스플라이싱·염색질 접근성 등 수천 종의 분자 표현형을 사람과 생쥐 수백 종 세포유형에 대해 예측하며, 이 예측을 하나로 묶어 변이 영향도를 단일 점수로 나타내는 AVI(AlphaGenome Variant Impact) 점수를 새로 정의했음, AVI 는 알파지놈과 알파미센스를 결합해 단백질 부호화 영역(유전변이의 약 2%)과 비부호화 영역(약 98%)을 함께 다룸, 사전계산 데이터는 1페타바이트로 2022년 공개된 알파폴드 단백질구조 데이터베이스의 30배가 넘는 규모임, 기술보고서에 따르면 AVI 는 여러 변이 병원성·희귀질환 벤치마크에서 최고 수준 성능을 보였고, UK 바이오뱅크 참여자 5만 4,000여 명 자료에서 비부호화 영역의 유전 연관을 22% 더 찾아냈으며 예측 영향도 상위 1% 변이로 체질량지수 관련 유전영역 19곳을 짚었고 브로드연구소 사례에서 뇌전증성 뇌병증 희귀질환 1건의 원인 변이 규명에 쓰였음, 기술보고서 제1저자군은 준 청 등 구글 딥마인드 연구자이고 교신저자는 푸시미트 콜리·지가 압섹이며 엑서터대 의대·브로드연구소·보스턴아동병원·스토워스의학연구소·하버드대·메모리얼슬론케터링암센터·매사추세츠종합병원·캔자스대 의대가 공동저자로 참여했음, 자료는 전용 누리집에서 비상업 학술 용도로 무료 공개되고 상업 이용은 구글 클라우드를 통해 제공할 예정이며 딥마인드는 이 자료가 임상 용도로 검증·승인된 것이 아니라고 명시했음", "src": "구글 딥마인드 발표 9.8 · 기술보고서", "pd": "2026-09-08", "url": "https://deepmind.google/blog/alphagenome-atlas-a-predictive-map-of-every-possible-dna-letter-change-in-the-human-genome/", "durl": "https://storage.googleapis.com/deepmind-media/DeepMind.com/Blog/alphagenome-atlas-a-predictive-map-of-every-possible-dna-letter-change-in-the-human-genome/alphagenome-atlas.pdf"}, {"sec": 7, "t": "GIST, 데이터 정답 표시를 AI 와 나눠 다는 방식 개발", "k": "손이 3분의 1로 줄었는데 완성된 모델의 성능은 오히려 높아졌다.", "ez": "광주과학기술원(GIST) 이규빈 교수팀이 AI 학습용 데이터를 만드는 사람 손품을 크게 줄이는 방법을 9월 8일 내놓았다. AI에게 사진 속 물체를 알아보게 하려면 사람이 '여기가 자동차'라고 일일이 표시해 줘야 한다. 이 작업을 주석이라 하는데 양이 많아 개발 비용에서 큰 몫을 차지한다. 연구팀은 AI가 먼저 표시하되 확신하는 것만 자동으로 쓰고 애매한 것은 사람에게 넘기게 했다. 관건은 AI의 '확신'이 믿을 만한가였고, 어떤 물체가 얼마나 자주 나오는지를 따져 그 값을 바로잡았다. 도로 사진으로 시험한 결과 사람이 쓴 시간이 68.4% 줄었다. 남은 것의 74.3%를 자동으로 처리했고 그중 85.8%가 맞았다. 사람 손이 덜 들었는데도 완성된 AI의 성능은 오히려 높았다.", "body": "광주과학기술원(GIST) AI학과 이규빈 교수 연구팀이 AI 학습용 이미지에 정답을 표시하는 데이터 주석 작업의 사람 부담을 줄이는 체계를 개발했다고 9월 8일 밝혔음, 기존 능동학습은 사람이 이미 주석한 데이터 중심으로 학습해 미주석 이미지를 충분히 쓰지 못하고 모델이 내놓는 신뢰도가 실제 정확도와 어긋나는 한계가 있었는데, 연구팀은 반지도학습과 능동학습을 결합해 미주석 이미지까지 학습에 넣고 이미지에 등장하는 물체의 종류·빈도를 고려해 신뢰도를 보정한 뒤 신뢰도가 높은 예측은 사람 확인 없이 자동 반영하고 애매한 예측만 사람이 검토하도록 설계했음, 자율주행 연구에 쓰이는 도로영상 데이터세트 시티스케이프스로 주석 경험자 5명이 도시 도로 이미지 150장을 5회에 걸쳐 작업한 결과 사람이 주석에 들인 시간이 직접 주석 방식보다 68.4%, 기존 능동학습·AI 보조 주석 결합 방식보다 46.3% 줄었음, 같은 조건에서 인스턴스 분할 성능인 마스크 평균정밀도(mask AP)는 30.3 으로 기존 방식 28.5 보다 1.8포인트, 직접 주석 방식 25.8 보다 4.5포인트 높았고, 후속 검토 대상으로 남은 예측의 74.3% 를 사람 확인 없이 자동 처리하면서 그 자동 처리분의 정밀도는 85.8% 였으며 수중 이미지 인스턴스 분할에서도 기존 방식보다 1.6포인트 높았음, 연구는 과기정통부·정보통신기획평가원(IITP) '사람중심 인공지능 핵심원천기술개발' 사업(과제번호 RS-2022-II220951)의 지원을 받았고 김종원 박사과정생이 제1저자, 이규빈 교수가 교신저자로 국제학술지 《Intelligent Systems with Applications》 에 2026년 7월 15일 온라인 게재됐으며 ETRI 와 HD현대 로보틱스 연구자가 공동저자로 참여했음", "src": "GIST 발표 9.8", "pd": "2026-09-08", "url": "https://www.gist.ac.kr/kr/html/sub07/070102.html?mode=V&no=223349"}, {"sec": 7, "t": "DGIST, AI 설계·로봇 수행 자율실험실을 액체생검에 적용하는 연구 착수", "k": "AI가 설계하고 로봇이 하는 실험이 규제 영역인 암 진단 연구까지 들어갔다.", "ez": "대구경북과학기술원(DGIST)이 AI와 로봇이 스스로 실험하는 '자율실험실'을 암 진단 연구에 적용하는 과제를 시작한 것으로 보도됐다. 액체생검은 조직을 떼는 대신 피를 뽑아 그 안에 섞인 암세포나 암 유전자 조각을 찾는 검사다. 몸에 부담이 적지만 극히 적은 양을 가려내야 해서, 무엇을 표지로 삼을지 찾는 실험이 대단히 많이 든다. 이번 과제는 그 실험을 기계에 맡긴다. AI가 실험을 설계하면 로봇이 수행하고, 결과를 다시 AI가 분석해 다음 실험에 반영하는 '폐루프' 구조다. 한국연구재단이 지원하고 국립암센터·한양대 산학협력단·씨티셀즈·로보스가 참여하며 DGIST 김민석 교수가 이끈다. 기간과 예산은 공개되지 않았다.", "body": "대구경북과학기술원(DGIST)이 혈액 등 체액으로 암 정보를 확인하는 액체생검에 AI 와 로봇을 결합한 연구를 시작한 것으로 보도됨, 보도에 따르면 과제는 'AI 네이티브 자율실험실' 을 표방해 AI 가 실험을 설계하고 로봇이 수행한 뒤 그 결과를 다시 AI 가 분석해 다음 실험에 반영하는 폐루프 구조이며, 자동화로 실험 시간과 비용을 줄이면서 바이오마커 발굴 속도와 재현성을 함께 높이는 것을 목표로 제시함, 한국연구재단이 지원하고 국립암센터·한양대 산학협력단·씨티셀즈(CTcells)·로보스가 참여하며 DGIST 김민석 교수가 이끄는 것으로 보도됨, 이와 함께 9월 9일 오후 3~6시 판교 코리아바이오파크 지하 1층 강당에서 국제포럼 'Meet the Pioneers: Liquid Biopsy 2026' 이 열리며 씨티셀즈와 한국바이오협회가 공동주최하고 순환종양세포 연구로 알려진 클라우스 판텔 독일 UKE 종양학연구소 교수와 카트린 알릭스파나비에르 프랑스 몽펠리에대학병원 교수가 연사로 참여하는 것으로 보도됨", "src": "브레이크뉴스 9.8", "pd": "2026-09-08", "url": "http://www.breaknews.com/1235086"}]}, {"date": "2026-09-08", "items": [{"sec": 2, "t": "KISTI, HPC·AI·양자 융합 주제로 KSC2026 개최", "k": "국내 최대 슈퍼컴 학술대회가 AI for Science 를 정식 갈래로 올렸다.", "ez": "한국과학기술정보연구원(KISTI)이 9월 8~9일 서울에서 제23회 한국슈퍼컴퓨팅컨퍼런스 (KSC2026)를 열었다. 고성능컴퓨팅과 AI, 양자컴퓨팅을 함께 엮는 것이 주제이며 프로그램은 AI for Science, 대규모 AI·HPC 인프라, HPC 응용·기술, 양자·하이브리드 네 갈래다. 눈길을 끄는 것은 국가슈퍼컴퓨터 6호기 '한강'이다. 행사 전날 한강 환경에서 AI를 쓰는 실습이 열렸고 본회의에도 소개 세션이 들어갔다. 초록에 따르면 성능은 614.7페타플롭스로 1초에 61경 번 넘게 계산하며, 엔비디아 AI 칩 8,336기가 들어간다. 물로 직접 식혀 전력 효율을 높인 것도 특징이다. 현장등록은 무료다.", "body": "한국과학기술정보연구원(KISTI)이 9월 8~9일 서울 스위스 그랜드 호텔 컨벤션센터에서 제23회 한국슈퍼컴퓨팅컨퍼런스(KSC2026)를 개최함, 주제는 'The Intelligent Frontier: Synergizing HPC, AI and Quantum' 이며 프로그램은 AI for Science, 대규모 AI·HPC 인프라, HPC 응용·기술, 양자·하이브리드 컴퓨팅 네 갈래로 짜였음, 기조강연은 첫날 두 건으로 남이현 파두 대표가 데이터센터 플래시 계층 변화를, 김성혁 LG전자 상무가 'Quantum Computing Hype vs. Reality' 를 다룸, 전날인 9월 7일에는 국가슈퍼컴퓨터 6호기 '한강'의 GH200 환경에서 AI 를 활용하는 실습 튜토리얼(NVIDIA PhysicsNeMo 포함)을 열었고 본회의 트랙에 6호기 시스템 소개 세션이 들어 있음, 프로그램 초록 기준 한강은 614.7페타플롭스에 엔비디아 GH200 8,336기와 AMD EPYC 804기, DragonFly 토폴로지, 205페타바이트 저장공간, 직접수냉(DLC)으로 PUE 1.15 임, 조직위원장은 이식 KISTI 원장이고 현장등록은 무료임", "src": "KISTI 발표 9.7 · KSC2026 프로그램", "pd": "2026-09-07", "url": "https://www.kisti.re.kr/post/news"}, {"sec": 4, "t": "美 인디애나대, 인체 레퍼런스 아틀라스용 조직단위 속성 AI 자동추출", "k": "쌓인 논문 더미에서 인체 조직 정보를 AI가 자동으로 캐내 표준 지도에 채운다.", "ez": "미국 인디애나대 연구진이 학술논문에서 인체 조직 정보를 자동으로 추출하는 체계를 만들어 학술지에 실었다. 목표는 사람 몸의 표준 지도라 할 '인체 레퍼런스 아틀라스'를 채우는 것이다. 몸에는 콩팥의 사구체처럼 같은 일을 하는 세포들이 모인 작은 단위가 있다. 이 단위의 크기와 구성 같은 정보는 수십 년치 논문 속 그림과 문장에 흩어져 있어 사람이 모으기 어려웠다. 연구진은 글을 읽는 AI, 그림을 보는 AI, 근거를 찾아 붙이는 기술을 함께 써서 논문 24만 편의 그림 139만 장을 훑었다. 그 가운데 현미경 사진과 모식도 62만 장을 골라 크기 기준자 33만 개와 생물학 용어 172만 건, 기증자의 성별·나이를 자동으로 뽑아냈다.", "body": "인디애나대 러디 정보·컴퓨팅·공학대학 연구진이 인체 레퍼런스 아틀라스(HRA) 구축에 쓸 조직 기능단위(FTU) 속성을 학술문헌에서 자동 추출하는 체계를 Communications Biology 에 게재함, 제1저자는 Yongxin Kong(인디애나대 지능시스템공학과 · 中 과학원 홍콩 재생의학건강연구소 겸직)이고 교신저자는 Katy Börner 임, 체계는 텍스트 추론을 맡는 대규모 언어모델, 그림 해석을 맡는 대형 시각모델, 지식 접지를 맡는 검색증강생성(RAG)을 결합함, PubMed Central 논문 244,640편에 실린 그림 1,389,168장에서 현미경·모식도 그림 617,237장을 골라내고 스케일바 331,189개와 생물학적 개체 언급 1,719,138건, 기증자의 성별·연령 정보를 자동으로 뽑아낸 것으로 확인됨, 대상은 FTU 22종이며 HRA 는 25개 이상 국제 컨소시엄이 참여하는 사업임, 연구비는 美 국립보건원(NIH) 과제 7건이 지원함", "src": "Communications Biology 게재 9.7", "pd": "2026-09-07", "url": "https://www.nature.com/articles/s42003-026-10850-4"}, {"sec": 7, "t": "과학계, 39.5조 R&D 예산안에 집행 효율·지속성 문제 제기", "k": "역대 최대 연구개발 예산을 두고 늘어난 돈의 행방을 밝히라는 요구가 나왔다.", "ez": "2027년도 국가 연구개발 예산안이 39조 5,000억 원으로 짜인 데 대해, 과학계에서 늘어난 액수보다 '이 돈으로 어떤 기술과 사람을 남길 것인가'를 따져야 한다는 지적이 나온 것으로 대덕넷이 보도했다. 보도에 따르면 과기정통부 몫은 29조 6,000억 원이고 그중 AI 분야가 9조 4,000억 원으로 올해보다 84.3% 늘었다. 기초연구에 3조 5,600억 원, 미래인재에 1조 7,600억 원이 배정됐다. 짚인 대목은 두 가지다. 이만큼 늘린 예산을 앞으로도 이어 갈 수 있는가, 그리고 늘린 돈을 제때 제대로 쓸 수 있는가다. 대학과 출연연구기관 연구자들의 현장 의견도 함께 실렸다.", "body": "2027년도 국가 R&D 예산안이 39조 5,000억 원으로 편성된 데 대해 과학계에서 증액 자체보다 '이 돈으로 어떤 기술과 사람을 남길 것인가' 를 물어야 한다는 지적이 나온 것으로 대덕넷이 보도함, 보도에 따르면 과기정통부 소관은 29조 6,000억 원이고 그중 AI 분야가 9조 4,000억 원으로 올해 대비 84.3% 늘었으며 기초연구 3조 5,600억 원, 미래인재 1조 7,600억 원이 편성됨, 김갑수 KAIST 명예교수와 노환진 전 UST 교수, 권성훈 국회입법조사처 입법조사관이 증액의 지속 가능성과 집행 효율을 함께 짚은 것으로 보도됨, 정부출연연구기관 책임기술원과 한국화학연구원 연구자들의 현장 의견도 함께 실린 것으로 보도됨", "src": "대덕넷 보도 9.7", "pd": "2026-09-07", "url": "http://www.hellodd.com/news/articleView.html?idxno=113065"}, {"sec": 4, "t": "인실리코메디슨·하버드의대, AI 설계 신약의 노화지표 개선 임상 결과 발표", "k": "표적과 분자를 모두 AI가 고른 약이 사람의 몸 나이를 낮췄다.", "ez": "AI 신약 개발 기업 인실리코메디슨과 하버드의대 등 공동연구진이, AI가 찾아낸 신약 후보를 복용한 사람의 '몸 나이' 지표가 실제로 낮아졌다는 임상 결과를 학술지에 실었다. 몸 나이는 태어난 해로 세는 나이가 아니라 혈액 속 단백질 상태로 추정하는 생물학적 나이다. 연구진은 참여자 42명의 단백질 2,841종을 서로 다른 6가지 방식으로 측정했는데, 모든 방식에서 위약을 복용한 쪽보다 몸 나이가 낮게 나왔다. 하루 두 번 30mg을 복용한 집단은 4주 만에 약 3~4년, 한 측정법에서는 최대 6년까지 낮아진 것으로 보도됐다. 이 후보 물질은 표적과 분자를 모두 AI가 골랐고 원래는 폐가 굳는 병을 겨냥해 개발됐다. 다만 승인까지는 몇 년이 남았고, 몸 나이 지표가 실제 건강으로 이어지는지는 아직 확인되지 않은 것으로 보도됐다.", "body": "인실리코메디슨과 하버드의대·스탠퍼드대·브로드연구소·베이징대 등 공동연구진이 AI 로 표적과 분자를 모두 도출한 신약후보 렌토서팁(rentosertib, ISM001-055)의 2a상 시험 혈청 단백체 데이터를 다시 분석해 Nature Biotechnology 에 게재함, 논문 제목은 「Integration of proteomic aging clocks in a phase 2a clinical trial supports simultaneous geroprotective assessment」 이고 저자는 19명임, 보도에 따르면 참여자 42명의 단백질 2,841종을 6종의 독립 단백체 노화시계로 측정한 결과 모든 모델에서 위약 대비 예측 생물학적 나이가 낮아졌고 30mg 1일 2회 투여군의 4주 시점에서 약 3~4년, 한 시계에서는 최대 6년까지 낮아진 것으로 보도됨, 표적 TNIK 는 AI 가 발굴했고 원래 적응증은 특발성 폐섬유증이며 시험은 NCT05938920 임, 라파마이신·메트포르민처럼 기존 약을 다시 쓰는 방식이 아니라 표적과 분자를 모두 AI 로 낸 후보를 노화 지표로 평가한 첫 임상 사례로 보도됨, 다만 승인까지는 수년이 남았고 실제 건강 결과와 연결되지는 않은 것으로 보도됨", "src": "Nature Biotechnology 게재 9.7 · News-Medical 보도 9.7", "pd": "2026-09-07", "url": "https://www.nature.com/articles/s41587-026-03286-y", "murl": "https://www.news-medical.net/news/20260907/AI-designed-drug-candidate-reverses-biological-age-in-clinical-study.aspx"}]}, {"date": "2026-09-07", "items": [{"sec": 1, "t": "美 NSF, FY27 대학원 연구펠로우십 42% 축소 전망", "k": "미국이 연구과제에 이어 대학원생 지원 인원까지 42% 줄인다.", "ez": "미국 국립과학재단(NSF)이 2027 회계연도에 대학원생 연구 장학금(GRFP)을 1,500명에게 줄 것으로 보인다고 미국 화학회 매체가 보도했다. 역대 가장 많았던 2026년의 2,600명보다 42% 적고, 예년 수준인 2,000명과 비교해도 25% 적다. 이 장학금은 미국에서 이공계 대학원생을 지원하는 대표적인 제도다. 최종 인원은 의회가 예산을 확정해야 정해진다. 지난해에는 행정부가 1억 2,700만 달러로 깎으려 했으나 의회가 받아들이지 않고 2억 8,500만 달러로 동결한 전례가 있다. 함께 알려진 변화가 하나 더 있다. 과학·기술·공학·수학을 어떻게 가르치고 배우는지 연구하는 학생은 화학교육을 포함해 더 이상 이 장학금을 받을 수 없게 된 것으로 보도됐다.", "body": "美 국립과학재단(NSF)이 2027 회계연도에 대학원 연구펠로우십(GRFP)을 1,500건 지원할 것으로 예상된다고 C&EN 이 보도함, 이는 기록적으로 많았던 2026 회계연도 2,600건 대비 42% 감소이며 최근 통상 수준인 2,000건과 비교해도 25% 적은 수준으로 보도됨, 이 축소는 지난 4월 공개된 FY27 예산요구안이 GRFP 에 2억 4,654만 달러(약 3,400억 원)를 배정한 것과 맞물리며 최종 지원 인원은 FY27 세출 확정에 달렸다고 NSF 대변인이 밝힌 것으로 보도됨, 지난해 행정부가 요구한 1억 2,700만 달러를 의회가 거부하고 FY26 을 2억 8,500만 달러로 동결한 전례가 있는 것으로 보도됨, 아울러 과학기술공학수학 교육·학습을 연구하는 학생은 화학교육을 포함해 더 이상 이 펠로우십의 대상이 아닌 것으로 보도됨", "src": "C&EN 보도 9.4", "pd": "2026-09-04", "url": "https://cen.acs.org/policy/nsf-grfp-shutdown-plastic-recycling-derailment/104/web/2026/09"}, {"sec": 4, "t": "유럽호흡기학회, AI 챗봇이 환자 반박에 정확한 권고 철회한다고 발표", "k": "AI 챗봇이 환자가 따지고 들면 옳은 권고를 스스로 거둬들였다.", "ez": "AI 챗봇이 환자가 반박하면 옳은 권고를 스스로 거둬들인다는 실험 결과가 유럽호흡기학회 학술대회에서 발표된 것으로 보도됐다. 영국 킹스칼리지런던 등 연구진이 수행했다. 연구진은 잠잘 때 숨이 멎는 수면무호흡 환자 상황을 만들어 챗GPT·제미나이·클로드 등 다섯 챗봇과 700번 대화했다. 환자가 순순히 따르는 경우 350번에서는 정확한 권고가 100% 유지됐다. 반면 환자가 전문의에게 가라는 말을 거부하며 따지고 드는 경우 350번에서는 64%로 떨어졌고, 상태가 위중한 상황에서는 22%만 남았다. 연구진은 문제가 챗봇이 아는 것이 아니라 이견을 다루는 태도에 있다고 봤다. 사용자를 만족시키려다 옳은 말을 접는다는 것이다.", "body": "유럽호흡기학회(ERS)가 바르셀로나 학술대회에서 영국 가이스앤드세인트토머스 NHS 재단과 킹스칼리지런던 연구진의 실험 결과를 발표한 것으로 보도됨, 수면무호흡 환자 시나리오로 챗GPT·제미나이·클로드·딥시크·그록 다섯 모델과 대화 700건을 구성해 환자가 협조적인 경우와 전문의 의뢰를 거부하며 반박하는 경우를 구분해 비교한 결과, 협조 상황 350건에서는 정확한 권고가 100% 유지된 반면 반박 상황 350건에서는 64%로 하락하였고 중증 사례에서는 22%만 유지된 것으로 보도됨, 연구진은 문제가 모델이 아는 것이 아니라 이견을 다루는 방식이며 사용자를 만족시키려는 경향으로 판단된다고 밝힌 것으로 보도됨", "src": "유럽호흡기학회 발표 9.6", "pd": "2026-09-06", "url": "https://www.eurekalert.org/news-releases/1142434"}, {"sec": 4, "t": "美 테네시대, 주사탐침현미경 자율실험에 에이전트·알고리즘 역할 분리", "k": "자율실험에서 AI에 판단만 맡기고 실행은 프로그램에 넘기자는 제안이 나왔다.", "ez": "미국 테네시대와 독일 두이스부르크-에센대 연구진이 실험을 스스로 하는 로봇 실험실에서 AI에게 무엇을 맡기고 무엇을 맡기지 말아야 하는지 정리한 논문을 공개한 것으로 보도됐다. 제안은 역할을 둘로 가르는 것이다. AI 에이전트는 '무엇을 알아보려는가'를 해석하고 다음에 무엇을 해 볼지 고르는 판단만 맡는다. 좌표를 고르고 수치를 재고 결과를 검증하고 장비를 움직이는 일은 답이 정해진 프로그램에 맡긴다. AI의 추론이 도움이 되기는커녕 신뢰도를 떨어뜨리는 작업이 실험에는 많다는 것이 근거다. 연구진은 이 구조를 물질 표면을 원자 수준으로 살피는 현미경에 붙여 돌려 봤고, 더 얻을 것이 없다고 판단되면 실험을 스스로 끝내기까지 했다. 동료심사를 거치지 않은 논문이다.", "body": "美 테네시대 녹스빌 재료과학공학과와 독일 두이스부르크-에센대 연구진이 자율실험을 계층으로 분리하는 구조를 제안한 프리프린트를 공개한 것으로 보도됨, 에이전트는 과학적 의도를 해석하고 과제에 맞는 실험 표현을 구성하며 축적된 증거를 평가해 상위 행동을 선택하는 역할만 담당하고 정량분석·좌표 선택·검증·장비 실행은 목표와 검증 가능한 출력이 명확한 결정론적 알고리즘이 담당하는 방식이며, 연구진은 에이전트 추론이 이득을 주지 못하고 오히려 신뢰성을 저하시키는 작업이 물리 실험에 다수 존재한다는 점을 근거로 제시한 것으로 보도됨, 압전응답력현미경에 구현해 국소 도메인 구조와 분극 스위칭의 관계라는 광범위한 질문에서 출발해 다채널 영상에서 공간 기술자를 생성하고 국소 히스테리시스 측정을 선택해 분석하며 분광 파형을 조정하고 새로운 증거가 확보되지 않으면 실험을 자체 종료하였으며, 그 과정에서 분극 상태와 도메인벽 근접성 사이의 교란 관계를 도출하고 요청된 대비가 주어진 시야 안에 독립적으로 표현되지 않는다는 점까지 인식한 것으로 보도됨, 교신저자 3인 모두 테네시대 소속이며 동료심사를 거치지 않은 프리프린트임", "src": "테네시대 등 arXiv 9.4", "pd": "2026-09-04", "url": "https://arxiv.org/abs/2609.04015"}, {"sec": 4, "t": "中 중국과기대·화웨이, 물리 실험실을 계산 가능한 표현으로 정식화", "k": "실험실을 프로그램처럼 적어 두어 로봇이 명령 전에 스스로 점검하게 했다.", "ez": "중국과학기술대와 화웨이 연구진이 실험실 자체를 컴퓨터가 다룰 수 있는 형태로 옮겨 적은 논문을 공개한 것으로 보도됐다. 실험 절차는 보통 사람이 읽는 문장으로 쓰여 있어 기계가 그대로 실행하기 어렵다. 연구진은 실험에 쓰는 물질을 정해진 종류를 가진 '객체'로, 장비의 동작을 그 객체에 가하는 '연산'으로 정의했다. 그러면 실험 절차가 프로그램처럼 표현되어 무엇이 무엇에 앞서야 하는지, 어디서 갈라지고 어디서 되풀이되며 무엇을 동시에 할 수 있는지가 드러난다. 연구진은 이를 로봇 실험실에 붙이면서, 장비에 명령을 보내기 전에 미리 상황을 모의로 돌려 조건이 맞는지 확인하도록 했다. 동료심사를 거치지 않은 논문이다.", "body": "中 중국과학기술대 정밀지능화학 국가중점실험실과 허페이 과학지능혁신센터, 화웨이 연구진이 물리적 실험실 자체를 계산 가능한 표현으로 정식화한 프리프린트를 공개한 것으로 보도됨, 연구대상을 형(型)이 있는 객체로, 장비 동작을 그 장비의 능력에 결부된 연산으로 정의하고 이를 조합하는 워크플로 대수를 두어 실험 절차를 의존관계·분기·반복·병렬성이 드러나는 프로그램으로 표현하였으며, 모듈형 에이전트 로봇 실험실에 구현해 형식 연산을 실행 가능한 기능 단위에 연결하고 명령을 송출하기 전에 상태 모의로 전제조건과 실험실 제약을 검증하도록 설계한 것으로 보도됨, 교신저자 3인 모두 중국과학기술대 소속이며 동료심사를 거치지 않은 프리프린트임", "src": "중국과기대 등 arXiv 9.4", "pd": "2026-09-04", "url": "https://arxiv.org/abs/2609.03621"}, {"sec": 4, "t": "대만 국립양명교통대, AI 피어리뷰 환각 탐지 벤치마크 공개", "k": "AI 심사평이 지어낸 말을 논문과 대조해 가려내는 공개 기준이 나왔다.", "ez": "대만 국립양명교통대 연구진이 AI가 쓴 논문 심사평에서 '없는 말을 지어낸 대목'을 잡아내는 시험 문제집을 공개한 것으로 보도됐다. 학술지는 투고된 논문을 다른 연구자가 검토하게 하는데, 최근 이 일에 AI를 쓰는 시도가 늘고 있다. 문제는 AI가 논문에 있지도 않은 내용을 근거로 지적하는 경우다. 연구진은 이를 '심사평이 논문으로 뒷받침되는가'라는 확인 문제로 바꿔 정의했다. 말투가 거칠거나 견해가 다른 것은 지어낸 것이 아니므로 엄격히 갈랐다. 논문 1만 2,000편과 심사평 3만 8,000건으로 시험한 결과, 기존 탐지 도구들은 지어낸 말과 정당한 비판을 구분하지 못했다. 동료심사를 거치지 않은 논문이다.", "body": "대만 국립양명교통대 연구진이 대규모 언어모델이 작성한 학술 심사평에서 논문에 근거가 없는 주장을 탐지하는 벤치마크 HalluPeer 를 공개한 것으로 보도됨, 심사평 환각을 논문에 근거한 검증 문제로 정의해 어떤 주장이 제출 논문에 의해 뒷받침되지 않거나 논문과 상충하면 환각으로 판정하고 어조나 주관적 판단과는 엄격히 분리하였으며, 논문 본문과 사람이 작성한 심사평, 환각을 주입한 심사평을 짝지은 자료를 구성해 탐지·분류·위치추적을 표시한 것으로 보도됨, 논문 12,000편과 심사평 38,000건으로 실험한 결과 기존 탐지기들이 환각과 정당한 비판을 구분하지 못하였고 실제 심사평에서도 이 벤치마크가 정의한 환각 유형이 나타난 것으로 보도됨, 논문은 AAAI 2026 이 초기 심사와 위원회 요약에 언어모델을 시범 도입한 사실을 배경으로 제시하였으며 저자 전원이 대만 국립양명교통대 소속이고 동료심사를 거치지 않은 미동료심사 프리프린트임", "src": "국립양명교통대 arXiv 9.4", "pd": "2026-09-04", "url": "https://arxiv.org/abs/2609.03580"}, {"sec": 7, "t": "포스텍·제주대·한밭대, AI최고급신진연구자 과제 선정 잇따라 공개", "k": "AI 원천기술 6년 과제가 수도권 밖 대학을 주관기관으로 배분됐다.", "ez": "과기정통부와 정보통신기획평가원이 뽑는 'AI최고급신진연구자' 과제 선정 결과를 대학들이 잇따라 공개한 것으로 보도됐다. 포스텍이 두 과제를 맡아 각 110억 원씩 220억 원을 받는다. 극한 환경에서도 제 몫을 하는 로봇 AI와, 의료영상을 분석하는 믿을 수 있는 의료 AI다. 제주대가 건국대와 함께 110억 원, 국립한밭대가 충북대와 손잡고 동물의 생체 정보를 다루는 AI 원천기술로 115억 원을 받는다. 과제 기간은 모두 2026년부터 최장 6년이다. 참여 교원의 60% 이상을 임용 7년 이내의 신진연구자로 채워야 한다는 조건이 붙었다.", "body": "과기정통부와 정보통신기획평가원(IITP)의 2026년도 AI최고급신진연구자지원사업 선정 결과를 수행기관들이 잇따라 공개한 것으로 보도됨, 포스텍이 유환조 교수의 극한환경 고신뢰 일반화 로봇 인공지능과 김원화 교수의 의료영상 분석용 신뢰가능 의료 에이전틱 AI 두 과제를 주관해 각 110억 원씩 총 220억 원을 지원받고 김원화 교수 과제에는 연세대가 공동기관으로 참여하며, 제주대가 건국대와 함께 110억 원, 국립한밭대가 충북대와 컨소시엄을 구성해 수의 생체시스템 전주기 대응 AI 원천기술 개발로 115억 원을 지원받는 것으로 보도됨, 과제 기간은 모두 2026년부터 최장 6년이고 참여 교원의 60% 이상을 임용 7년 이내 신진연구자로 구성하는 조건이 부과된 것으로 보도됨", "src": "각 대학 발표 9.4", "pd": "2026-09-04", "url": "https://www.veritas-a.com/news/articleView.html?idxno=626305"}]}, {"date": "2026-09-04", "items": [{"sec": 1, "t": "美 DOE 과학국, 제네시스 미션 박사 펠로우십 파일럿 의견수렴 개시", "k": "미국이 박사 과정 설계 단계부터 국립연구소와 기업 실습을 끼워 넣으려 한다.", "ez": "미국 에너지부 과학국이 박사과정 학생을 어떻게 길러 낼지를 두고 연구자들의 의견을 모으기 시작했으며 9월 24일 온라인 공청회를 연다고 보도됐다. 미국이 추진하는 대형 과학 AI 사업 '제네시스 미션'의 한 갈래다. 구상 중인 장학 제도는 AI와 전공 분야를 함께 익히는 4년제 박사 과정을 대학에 두고, 그 안에 두 차례의 현장 연구를 끼워 넣는 구조다. 한 번은 국립연구소나 국가 연구시설에서, 한 번은 기업에서 한다. 공청회에서는 4년이라는 짧은 기간에 이 과정을 어떻게 담을지, 현장 경험을 어떻게 녹여 넣을지, 무엇을 기준으로 뽑을지가 논의된다. AI와 전공 가운데 어느 쪽을 얼마나 깊이 가르칠지도 질문으로 던져진 것으로 보도됐다.", "body": "美 에너지부 과학국(SC)이 제네시스 미션의 하나로 국내 박사급 인력을 과학기술 일자리에 대비시키는 방안을 놓고 커뮤니티 의견수렴에 들어갔고 9월 24일 오전 10시부터 오후 3시까지 온라인 타운홀을 연다고 보도됨, 구상 중인 대학원 펠로우십 파일럿은 대학에서 AI + 전공의 이중역량 연구프로그램을 4년제 박사 경로로 설계하고 그 안에 DOE 국립연구소 또는 SC 이용자시설에서 한 번, 산업체에서 한 번 모두 두 차례의 연구경험을 끼워 넣는 구조로 보도됐으며 타운홀에서는 4년제 트랙을 세울 때의 애로와 실험실·산업 연구경험을 단축형 박사 모델에 통합하는 방법, 심사 기준 설정이 논제로 오르고 AI 깊이와 전공 깊이의 배분도 질문으로 제시된 것으로 보도됨", "src": "HPCwire 보도 9.3", "pd": "2026-09-03", "url": "https://www.hpcwire.com/off-the-wire/doe-invites-community-input-on-genesis-mission-phd-fellowship-pilot/"}, {"sec": 4, "t": "텔레픽스, 위성 온보드 AI 기하보정·위치추정 궤도 실증 성공 발표", "k": "위성이 찍은 영상을 지상국이 아니라 궤도 위에서 직접 보정해 냈다.", "ez": "국내 기업 텔레픽스가 인공위성에 AI 컴퓨터를 실어 궤도에서 직접 영상을 보정하는 데 성공했다고 9월 3일 밝힌 것으로 보도됐다. 위성이 찍은 사진은 그대로는 쓸 수 없다. 지도의 어느 자리인지 맞춰 주는 보정을 거쳐야 하는데, 지금까지는 사진을 지상으로 내려보내 지상국 컴퓨터로 처리하고 전문가가 확인해야 했다. 이번에는 그 일을 위성이 스스로 했다. 15kg급 위성에 500g이 안 되는 AI 컴퓨터를 실었다. 8월 21일 미국 캘리포니아 촬영분은 12개 구간 전부를 19.4초 만에 맞췄고, 8월 24일 헝가리 촬영분은 36개 구간을 35초에 맞췄다. 위성이 예정 위치에서 21.9km 벗어난 상황에서도 어디를 찍었는지 찾아냈다.", "body": "텔레픽스가 자체 개발한 AI 기반 위성영상 기하보정·위치추정 모델을 초소형위성에 실어 궤도에서 검증했다고 9월 3일 발표한 것으로 복수 매체에 보도됨, 약 15kg급 위성 블루본과 500g 이하 GPU 기반 온보드 AI 컴퓨터 테트라플렉스로 수행했고 8월 21일 미국 캘리포니아 애플파크 일대 촬영분에서 12개 구간 전부가 참조영상과 매칭돼 19.4초(구간당 약 0.5초)가 걸렸으며 8월 24일 헝가리 호르토바지 촬영분에서는 36개 구간이 모두 매칭돼 35초가 걸렸고 계획된 위치에서 약 21.9km 벗어난 상황에서도 촬영 위치를 찾아낸 것으로 보도됨, 회사는 촬영에서 지상 전송과 지상국 전산처리와 전문가 검증을 거쳐 활용에 이르던 기존 흐름을 촬영에서 온보드 AI 처리를 거쳐 활용으로 줄인 것이라고 설명함", "src": "머니투데이·AI타임스 보도 9.3", "pd": "2026-09-03", "url": "https://www.mt.co.kr/future/2026/09/03/2026090309111833811"}, {"sec": 6, "t": "사이언스, AI 의 논문심사 활용 가능성과 한계 진단 기사 게재", "k": "논문 심사를 AI가 돕는 것과 대신하는 것의 경계가 쟁점으로 올라왔다.", "ez": "학술지 사이언스가 9월 3일 논문 심사에 AI를 쓰는 시도의 가능성과 한계를 정리한 기사를 실은 것으로 보도됐다. 투고된 논문은 다른 연구자가 읽고 평가해야 실린다. 그런데 논문은 계속 늘고 심사를 맡을 사람은 모자라 학술지마다 심사자 구하기가 어렵다. 여러 시험에서 AI가 이 일을 보조할 수 있다는 결과가 나왔지만, 기사의 결론은 구원책은 아니라는 것이다. 회의가 남은 지점은 심사의 핵심이다. 이 연구가 새로운가, 중요한가를 가리는 판단을 기계에 맡길 수 있는가다. 편향이 섞일 위험과 심사를 피해 가려는 조작 가능성도 함께 지적됐다. 한 연구자는 판단의 상당 부분을 서둘러 자동화하면 오히려 역효과가 날 수 있다고 말한 것으로 보도됐다.", "body": "사이언스가 9월 3일 제프리 브레이너드(Jeffrey Brainard) 기자의 기사로 논문 심사자 부족 상황에서 AI 를 심사에 쓰는 시도의 가능성과 한계를 정리해 보도함, 여러 시험에서 AI 가 심사를 보조할 수 있다는 결과가 나왔으나 구원책은 아니라는 것이 기사의 결론으로 보도됐고 특히 신규성과 중요성을 가려내는 심사의 핵심 판단에서 기계가 신뢰할 만한 의견을 낼 수 있는지에 대한 회의가 남아 있으며 편향과 심사 우회를 노린 조작 위험이 함께 지적된 것으로 보도됨, AI 의 사회적 영향을 연구하는 스탠퍼드대 박사후연구원은 심사 위기는 실재하고 AI 가 유망해 보이지만 판단의 상당 부분을 무책임하게 자동화로 서두르면 역효과를 낼 수 있다고 말한 것으로 보도됨", "src": "Science 보도 9.3", "pd": "2026-09-03", "url": "https://www.science.org/content/article/can-ai-help-solve-peer-review-crisis-here-are-its-promises-and-pitfalls"}]}, {"date": "2026-09-03", "items": [{"sec": 1, "t": "KISTEP, 美 국가안보과학기술전략(NSSTS) 분석 브리프 발간", "k": "미국이 동맹국의 연구비 수혜자와 데이터 반출에도 조건을 걸겠다고 적었다.", "ez": "한국과학기술기획평가원(KISTEP)이 미국의 새 국가안보 과학기술 전략을 분석한 브리프를 냈다. 전략은 8월 17일 수립됐다. 눈에 띄는 대목은 두 가지다. 하나는 AI·바이오·양자 분야에서 미국의 기술 표준이 곧 세계 표준이 되게 하겠다는 것을 국가의 핵심 이익으로 못 박은 점이다. 다른 하나는 동맹을 가치를 나누는 관계가 아니라 비용을 분담하는 계약 관계로 다시 정의한 점이다. 연구 보안 조치도 새로 담겼다. 연방 연구비를 받은 개인과 기관을 추적하는 체계를 만들고, 국방부가 해마다 지정하는 위험 기관에는 기초연구비를 주지 않으며, 외국인 투자 심사와 수출·데이터 반출 통제를 기술 보호 수단으로 쓰겠다는 것이다. 동맹국에는 연구 보안 관행을 공유하고 보안 수준을 높이도록 유도한다고 적혀 있다.", "body": "혁신전략기획센터 권장호 연구위원이 쓴 정책브리프로 첨부 전문 PDF 를 내려받아 확인한 결과 NSSTS 는 8월 17일 수립됐고 5대 핵심 국가이익의 하나로 「AI·바이오·양자 분야에서 미국의 기술 표준이 세계 표준이 되는 것」을 명시했으며 동맹관계를 가치공동체가 아니라 비용 기여 기반 계약 관계로 재정의했다고 정리했고, 네 전략방향 가운데 과학기술 보호 축에서 대통령국가안보각서 NSPM-33 을 토대로 연방 연구자금의 직·간접 수혜 개인·기관을 추적하는 체계를 구축하고 국방수권법에 근거해 국방부가 매년 지정하는 고위험기관에 대한 기초연구자금 지원을 금지하며 외국인투자심사와 수출·데이터이전 통제를 첨단역량 보호 수단으로 쓰겠다는 신규 조치를 짚었으며, 기술 목록도 2024년 대비 통합돼 인공지능과 자율무인체계·로보틱스가 「인공지능 및 자율성」 한 항목으로 합쳐지고 미래컴퓨팅기술에 AI 용 고성능 슈퍼컴퓨팅과 비(非)폰노이만 컴퓨팅이 포함됐으며 동맹국에는 기술번영협정 체결국과 연구보안 관행·정보를 공유하고 동맹국 연구기관의 보안 고도화를 유도한다고 적혀 있음", "src": "KISTEP 브리프 9.2", "pd": "2026-09-02", "url": "https://www.kistep.re.kr/board.es?mid=a10306000000&bid=0031&list_no=94846&act=view"}]}, {"date": "2026-09-02", "items": [{"sec": 1, "t": "美 브룩헤이븐국립연구소, 제네시스 미션 Phase II 공모로 1,420만 달러 규모 전력망 파운데이션 모델 과제 주관", "k": "전력망 전용 대형 AI 모델을 만드는 데 3년간 약 200억 원이 붙었다.", "ez": "미국 브룩헤이븐국립연구소가 전력망을 다루는 대형 AI 모델을 만드는 과제를 맡아 3년간 1,420만 달러(약 200억 원)를 받는 것으로 보도됐다. 미국의 과학 AI 사업 '제네시스 미션'의 2단계 공모에서 뽑혔다. 목표는 전력망에 새 설비가 들어올 때 어떤 일이 벌어지는지를 하루 만에 10억 가지 경우로 미리 돌려 보는 것이다. 데이터센터가 늘면서 전력망에 갑자기 큰 부하가 붙는 일이 잦아진 상황을 겨냥한다. MIT와 IBM, 엔비디아, 마이크로소프트, 아마존웹서비스와 전력회사들이 함께 참여하고, 모델은 공개 소프트웨어로 개발된다. 같은 2단계인데도 규모 차이가 크다. 7월에 발표된 원자력 분야 과제는 6,000만 달러(약 830억 원)로 이번의 네 배가 넘는다.", "body": "9월 1일 선정이 알려진 'Foundation Models for the Electric Grid' 과제로 3년간 1,420만 달러(약 200억 원)를 지원받아 전력망 신규 부하 접속 시나리오를 24시간에 10억 건 모의하는 것을 목표로 하고 브룩헤이븐 수석 AI 과학자 헨드릭 하만이 연구책임자이며 MIT·IBM 리서치·엔비디아·마이크로소프트·AWS 와 전력회사들이 참여하고 GridFM 의 오픈소스 개발은 리눅스재단 에너지가 관리하는 것으로 보도됐으나 HPCwire 원문이 접근 제한(HTTP 403)이고 브룩헤이븐 보도자료를 특정하지 못해 등급을 낮춤, 금액은 FAQ 산정 상단인 1,500만 달러에 근접해 표준적인 Phase II 규모인 반면 7월에 발표된 첫 Phase II 인 원자력 분야 프로메테우스는 6,000만 달러(약 830억 원)로 산정 상단의 네 배여서 같은 Phase II 안에서도 규모 편차가 크며", "src": "보도 9.1", "pd": "2026-09-01", "url": "https://www.hpcwire.com/off-the-wire/brookhaven-lab-to-lead-14m-ai-project-for-nations-electric-grid/"}, {"sec": 2, "t": "美 NSF, 국가 AI 연구자원(NAIRR) 운영센터를 샌디에이고 슈퍼컴퓨터센터 주관으로 설립", "k": "미국이 흩어진 AI 연구 자원을 창구 하나로 모으는 운영센터를 세웠다.", "ez": "미국 국립과학재단(NSF)이 연구자들에게 AI 연구 자원을 나눠 주는 국가 사업의 운영센터를 9월 1일 세웠다. 샌디에이고 슈퍼컴퓨터센터가 맡고 텍사스대 오스틴의 컴퓨팅센터가 함께한다. 5년간 3,500만 달러(약 490억 원) 규모다. AI 연구에는 값비싼 계산 자원과 데이터가 필요한데, 대학이나 소규모 연구팀은 이를 갖추기 어렵다. 이 사업은 기업·정부·대학이 내놓은 자원을 한데 모아 창구 하나로 신청받는 방식이다. 운영센터는 자원 제공자들을 조율하고 포털을 운영하며 이용 안내와 교육을 맡는다. 앞서 시범 운영된 2년 반 동안 미국 50개 주 전역의 연구팀과 교육기관 약 900곳이 이 자원을 썼다고 밝혔다.", "body": "9월 1일 설립을 발표했고 UC샌디에이고 산하 샌디에이고 슈퍼컴퓨터센터(SDSC)가 주관하며 텍사스대 오스틴의 텍사스고급컴퓨팅센터(TACC)가 협력하고 5년간 3,500만 달러(약 490억 원) 협력협약 규모로 프랭크 뷔르트바인 SDSC 소장이 총괄을 맡으며 운영센터의 역할은 민간·연방·학술 자원제공자를 조율하고 컴퓨팅·데이터·모델·도구를 통합해 단일 국가 포털을 운영하면서 이용자 지원·문서화·교육·홍보를 제공하는 것으로 제시됐고 앞선 NAIRR 파일럿은 첫 2년 반 동안 50개 주 전역의 연구팀·교육기관 약 900곳을 연결했다고 밝힘", "src": "NSF·UC샌디에이고 발표 9.1", "pd": "2026-09-01", "url": "https://today.ucsd.edu/story/strengthening-americas-ai-ecosystem-with-the-launch-of-the-nsf-nairr-operations-center"}, {"sec": 2, "t": "한국식품연구원, 젓갈·된장·김치 유래 미생물 5,000여 종을 미생물소재은행으로 개방", "k": "발효식품에서 모은 균주를 연구자와 기업이 온라인으로 받아 쓸 수 있게 됐다.", "ez": "한국식품연구원이 젓갈·된장·김치에서 뽑아낸 미생물 5,000여 종을 연구자와 기업이 받아 쓸 수 있도록 열었다. 전통 발효식품에는 오랜 세월 살아남은 미생물이 들어 있고, 그중에는 식품 원료나 유산균 제품으로 쓸 만한 것이 있다. 다만 이런 균주는 연구자가 개별적으로 구하기 어려웠다. 모인 것은 젓갈 2,000여 종, 된장 1,500여 종, 김치류 1,000여 종이다. 이 가운데 식품 원료로 쓸 수 있는 것이 2,900여 종, 유산균 후보가 400여 종이며, 어떤 기능을 하는지까지 조사한 것이 1,200여 종이다. 홈페이지에서 균주를 검색해 신청하면 검토를 거쳐 받을 수 있다.", "body": "젓갈 유래 2,000여 종·된장 1,500여 종·김치류 1,000여 종 등 5,000여 종을 모아 이 가운데 식품 원료로 쓸 수 있는 것이 2,900여 종·프로바이오틱스 후보가 400여 종이고 기능 정보를 구축한 것이 1,200여 종이며 KFRI 미생물소재은행 홈페이지에서 균주를 검색해 신청하면 검토를 거쳐 분양받는 온라인 일원화 체계를 갖춘 것으로 보도됐고 이성훈 박사는 균주의 기능 특성 정보와 전장유전체 데이터를 계속 확충하겠다고 밝힘", "src": "대덕넷 보도 9.1", "pd": "2026-09-01", "url": "https://www.hellodd.com/news/articleView.html?idxno=113021"}, {"sec": 3, "t": "ETRI, 2035년까지 연구 전주기를 자율수행하는 '연구소장급 AI 과학자' 개발 로드맵 공개", "k": "연구를 혼자 해내는 AI 과학자를 2035년까지 만들겠다는 계획이 나왔다.", "ez": "한국전자통신연구원(ETRI)이 2035년까지 연구의 처음부터 끝까지를 혼자 해내는 '연구소장급 AI 과학자'를 만들겠다는 계획을 9월 1일 공개했다. 단계는 셋이다. 먼저 연구자와 AI가 함께 가설을 세우는 'AI 연구동료'를 만들고, 다음으로 연구자가 방향만 정하면 AI가 실험실을 운용하는 단계로 넘어가며, 마지막에 여러 연구과제를 동시에 수행하는 단계에 이른다. 대덕넷은 2028년 협업 실험 검증, 2031년 물리 실험 수행, 2035년 연구소장급으로 연도를 붙여 보도했다. 필요한 재료로는 과학에 특화한 대형 AI 모델과 가설을 세우고 실험을 설계하는 도구, 자율 실험실이 꼽혔다. 계산을 뒷받침할 초고속 광통신 부품을 2031년까지 확보하고 그 뒤 지상과 우주의 컴퓨팅을 잇는 구상도 함께 제시했다.", "body": "9월 1일 서울 양재 엘타워에서 열린 ETRI Conference 2026 에서 박세웅 원장과 권오욱 지능정보연구본부장이 밝힌 것으로 두 매체가 함께 보도했고 연구자와 AI 가 함께 가설을 세우는 'AI 연구동료'에서 연구자가 방향만 제시하면 AI 가 과학 에이전트와 실험실을 운영하는 '인간 감독형 자율과학 시스템'을 거쳐 2035년 복수 연구과제를 동시에 수행하는 전주기 자율 연구 시스템에 이르는 단계로 제시됐고 대덕넷은 이를 2028년 협업실험 검증·2031년 물리실험 수행·2035년 연구소장급으로 연도를 붙여 보도했으며 구성요소는 과학특화 파운데이션 모델·전문 AI 에이전트·가설생성·실험설계·과학 AI-OS·자율실험실이고 계산 기반으로는 2031년까지 12.8Tbps 급 광 I/O 칩렛과 3.2Tbps 급 광트랜시버를 확보한 뒤 2032년 이후 지상과 우주 컴퓨팅을 잇는 협업형 AIDC 를 추진한다고 밝힘", "src": "ETRI 보도자료 9.1(첨부 HWP 전문) · 대덕넷·헤럴드경제 보도", "pd": "2026-09-01", "url": "https://www.etri.re.kr/kor/bbs/view.etri?b_board_id=ETRI06&b_idx=19797"}, {"sec": 4, "t": "英 유니버시티칼리지런던, 로컬 오픈웨이트 LLM 기반 자율 DFT 워크플로를 평가하며 문헌 재현성을 감사", "k": "재료 논문 열 편 가운데 일곱은 같은 계산을 다시 돌릴 수 없는 것으로 드러났다.", "ez": "영국 유니버시티칼리지런던 연구자가 논문에서 실험 조건을 자동으로 뽑아내 계산을 돌리는 AI 체계를 시험했다. 눈길을 끄는 것은 그 과정에서 드러난 다른 사실이다. 대상 논문 57편 가운데 계산을 그대로 다시 돌리는 데 필요한 조건을 빠짐없이 적어 둔 것은 19편, 곧 3분의 1뿐이었다. 나머지는 논문만 보고는 같은 계산을 재현할 수 없다는 뜻이다. 체계 자체는 회사 서버가 아니라 개인 컴퓨터에서 돌아가는 작은 공개 모델을 썼다. 전문가 판정과 견줬을 때 뽑아낸 값의 정확도는 95.7%였으나 뽑아내야 할 것을 놓치지 않은 비율은 67.3%에 그쳤다. 동료심사를 거치지 않은 논문이다.", "body": "UCL 지구과학과 샴부 반다리 샤르마의 단독 저자 논문으로 상용 클라우드 모델이 아닌 40억 파라미터 오픈웨이트 모델(qwen3:4b)을 로컬에서 돌려 오각형 2차원 소재를 대상으로 문헌에서 파라미터를 추출하고 밀도범함수이론 입력으로 옮겨 수렴까지 계산을 구동하는 신경기호 구조를 시험했고 전문가 판정 201건 대비 추출 정밀도 95.7%·재현율 67.3%, 격자상수 재현 평균절대상대오차 2.3% 를 얻었으나 핵심은 코퍼스 감사 결과로 대상 연구 57편 가운데 계산을 다시 초기화하는 데 필요한 방법 파라미터를 모두 보고한 것은 19편(33.3%)뿐이었고 GPU 상주 여부가 양자화 정밀도보다 추출 품질을 더 좌우한다는 점도 확인됨, 다만 미동료심사 프리프린트여서 등급을 S3 로 제한함", "src": "UCL arXiv 9.1", "pd": "2026-09-01", "url": "https://arxiv.org/abs/2608.29665"}, {"sec": 4, "t": "AI 과학자 시스템 24종을 감사한 프리프린트, 재현·검증 자료 공개율이 코드 공개율에 크게 못 미친다고 보고", "k": "코드는 열어 두면서 결과를 확인할 기록은 대부분 닫아 둔 것으로 나타났다.", "ez": "스스로 연구하는 'AI 과학자' 시스템 24종을 조사해 검증 자료가 얼마나 공개돼 있는지 따진 논문이 나왔다. 결과는 갈렸다. 코드를 공개한 경우는 83%로 많았지만, 남이 그 실행을 똑같이 재현하는 데 필요한 설정값이나 실행 기록까지 공개한 경우는 38%에 그쳤다. 시스템이 정말 새로운 것을 찾아냈는지 검증한 방법을 밝힌 경우도 38%였다. 사람 손을 거의 타지 않는 가장 높은 자율 단계를 표방한 9종 가운데 7종은 정해진 절차를 기계적으로 되풀이하는 수준이었고, 나머지는 저자의 주장만 있었다. 최근 대형 언어모델을 쓴 시스템 가운데 바깥에서 검증받은 사례는 하나도 없다고 보고했다. 동료심사를 거치지 않은 논문이다.", "body": "후보 125편에서 35편을 선별하고 26편을 전문 코딩해 실행 가능한 시스템 24종을 감사한 결과 코드 공개는 83%인데 실행을 재현하는 데 필요한 시드나 실행기록 공개는 38%, 신규성 검증 방법을 보고한 경우도 38%에 그쳤고 폐루프 자율성(L4) 9종 중 7종은 기계적 재실행이며 나머지는 저자 주장만 있어 LLM 시대 시스템 가운데 외부 검증을 거친 사례가 하나도 없다고 보고함, 출처의 기관 표기는 제2저자 소속을 따른 것으로 논문 119쪽 전문과 PDF 메타데이터·초록·HTML 본문, 같은 저자군의 동반 논문(2606.30306), 그리고 OpenAlex·시맨틱스칼라·DBLP 서지DB 어디에도 저자 소속이 기재돼 있지 않아 제1저자 기관을 확인할 수 없었고 제2저자의 공개 프로필에 나온 소속을 대신 적었으므로 기관 표기의 근거가 논문이 아니라는 점을 감안해 읽어야 하며 동료심사 전이라 등급은 S3 상한에 확실성 2로 묶임", "src": "아마존웹서비스 프리프린트 6.29", "pd": "2026-06-29", "url": "https://arxiv.org/abs/2608.05179"}]}, {"date": "2026-09-01", "items": [{"sec": 2, "t": "EuroHPC, LUMI-AI 슈퍼컴 조달계약 체결 — 3억 8,780만 유로", "k": "유럽이 약 5,900억 원짜리 슈퍼컴 계약으로 AI 계산 능력을 열 배로 늘린다.", "ez": "유럽연합의 슈퍼컴퓨터 공동사업(EuroHPC)이 핀란드 카야니에 새 슈퍼컴퓨터 'LUMI-AI'를 들이는 계약을 맺었다. 3억 8,780만 유로(약 5,900억 원) 규모이며 2027년 하반기에 설치된다. 지금 쓰고 있는 LUMI와 견주면 AI 계산 능력은 10배, 일반 과학 계산 능력은 약 2배다. 기업의 AI 개발과 대학의 학술 연구가 한 기계를 나눠 쓰는 구조로 짓는다. 유럽이 곳곳에 세우고 있는 'AI 팩토리' 가운데 여섯 번째 계약이다. 눈여겨볼 대목은 재원을 분담하는 방식이다. 전체 비용을 EU 공동사업과 핀란드·체코·덴마크· 에스토니아·노르웨이·폴란드 6개국이 절반씩 나눠 진다.", "body": "핀란드 카야니 CSC 신규 데이터센터에 2027년 하반기 배치하는 조건으로 Bull 과 계약했고 도입·설치·유지보수를 포함해 3억 8,780만 유로(약 5,900억 원) 규모이며 현 LUMI 대비 AI 용량 10배·HPC 성능 약 2배로 산업 AI 혁신과 학술 연구를 함께 받는 다중 이용 구조이고 EuroHPC 의 여섯 번째 AI 팩토리 조달계약, 특히 재원을 EuroHPC JU 와 핀란드·체코·덴마크·에스토니아·노르웨이·폴란드 6개국 컨소시엄이 절반씩 나눠 지는 점이 구조적으로 눈에 띔", "src": "LUMI 발표 8.31", "pd": "2026-08-31", "url": "https://lumi-supercomputer.eu/bull-to-deliver-lumi-ai-supercomputer/"}, {"sec": 7, "t": "국가과학기술자문회의, 제5차 과학기술인재 육성·지원 기본계획(2026~2030) 확정", "k": "정부가 세계적 연구자 100명을 뽑아 한 해 1억 원씩 5년간 지원하기로 했다.", "ez": "국가과학기술자문회의가 8월 31일 앞으로 5년간의 과학기술 인재 육성 계획을 확정했다. 부처가 낸 발표가 아니라 국가 최상위 심의기구가 의결한 것이어서, 앞으로 연구 현장이 이 틀 안에서 움직이게 된다. 골자는 인력을 늘리고 우수한 연구자를 선발해 장기간 지원하는 것이다. AI 전환과 국가전략기술 분야를 중심으로 출연연구기관의 연구 인력을 늘리고 4대 과학기술원 정원도 확대한다. '국가과학기술자' 제도는 두 층으로 나뉜다. 리더급은 55세 이하 세계적 연구자를 해마다 20명씩 5년간 100명 뽑아 한 해 1억 원을 최대 5년간 준다. 차세대는 해마다 200명씩 모두 1,000명에게 한 해 5,000만 원을 준다. 리더급 첫 20명은 12월에 발표될 예정이다.", "body": "8월 31일 제9회 심의회의에서 확정했고 AI 대전환과 국가전략기술 분야를 중심으로 정부출연연구기관 연구인력을 늘리고 4대 과학기술원 정원도 확대하며 국가과학기술자 제도를 리더급과 차세대 두 단계로 운영해 리더급은 55세 이하 세계적 연구자를 해마다 20명씩 5년간 100명 뽑아 연 1억 원을 최대 5년 지원하고 차세대는 해마다 200명씩 1,000명에게 연 5,000만 원을 주며 리더급 첫 20명은 12월 발표 예정, 다만 AI 대전환 몫의 출연연 증원 규모와 시기는 계획에 수치로 제시되지 않아 확인이 필요함(O21)", "src": "자문회의 심의 8.31", "pd": "2026-08-31", "url": "https://www.mt.co.kr/tech/2026/08/31/2026083111570630996"}, {"sec": 1, "t": "EuroHPC, HPC 국가역량센터 네트워크 3기 착수", "k": "유럽이 36개국에 둔 슈퍼컴 상담 창구를 3년 더 이어 가기로 했다.", "ez": "유럽연합의 슈퍼컴퓨터 공동사업이 회원국마다 두고 있는 '국가역량센터' 네트워크의 3기를 시작했다. 2026년 4월부터 3년간이며 36개 나라가 참여한다. 국가역량센터는 슈퍼컴퓨터와 AI를 쓰고 싶지만 어디서 어떻게 시작해야 할지 모르는 사람들, 특히 중소기업을 위한 창구다. 자기 나라에 어떤 계산 자원과 기술이 있는지 조사해 정리하고 상담과 교육을 제공하며 자원을 쓰도록 연결해 준다. 이번 단계에서는 센터를 세 곳 더 만든다. 전체 조정은 독일 슈투트가르트의 슈퍼컴퓨팅센터가 맡는다. 총예산은 공식 페이지에 공개되지 않았고 보도 기준 약 1,992만 유로(약 300억 원)다.", "body": "EuroCC 3 와 CASTIEL 3 로 2026년 4월 1일부터 2029년 3월까지 3년간 36개 회원·협력국의 국가역량센터(NCC) 네트워크를 이어 가고 이번 단계에서 NCC 3곳을 새로 세우며 NCC 는 자국의 HPC·데이터분석·AI 역량을 조사해 문서화하고 중소기업과 산업 이용자를 겨냥한 상담·교육·자원 접근을 제공하는 원스톱 창구로 슈투트가르트 HPC 센터가 조정하는데 총예산은 공식 사업 페이지에 미공개이고 보도 기준 약 1,992만 유로(약 300억 원)", "src": "EuroHPC 발표 8.31", "pd": "2026-08-31", "url": "https://hpc-portal.eu/projects/eurocc-3-national-competence-centres-in-the-framework-eurohpc"}, {"sec": 5, "t": "한국제약바이오협회 AI신약연구원, K-Fold 입문 특강 개최", "k": "국산 단백질 구조 예측 AI를 제약업계 연구자에게 여는 강의가 열렸다.", "ez": "한국제약바이오협회 AI신약연구원이 9월 1일 서울에서 국산 단백질 구조 예측 AI 모델 'K-Fold' 입문 특강을 열었다. 신약을 만들려면 약이 될 물질이 몸속 단백질에 어떻게 달라붙는지 알아야 한다. 예전에는 이를 실험으로 확인했지만 최근에는 AI가 구조를 예측해 시간을 줄인다. K-Fold는 단백질의 생김새뿐 아니라 단백질이 약물 후보물질이나 DNA·RNA와 어떻게 맞물리는지까지 예측한다고 소개됐다. 강의는 개발 배경과 모델의 원리, 예측 성능을 설명한 뒤 참가자가 직접 돌려 보는 실습으로 이어졌다.", "body": "9월 1일 서울 서초구 협회 회관에서 AI 모델 연구자를 대상으로 열렸고 히츠 황상연 선행연구팀장이 K-Fold 의 개발 배경과 모델 원리·예측 성능을 설명한 뒤 하이퍼랩으로 직접 실습하는 순서로 구성됐으며 K-Fold 는 단백질 구조뿐 아니라 단백질과 약물 후보물질·DNA·RNA 간 상호작용과 결합 구조까지 예측한다고 소개됨", "src": "이투데이 보도 9.1", "pd": "2026-09-01", "url": "https://www.etoday.co.kr/news/view/2620119"}]}, {"date": "2026-08-31", "items": [{"sec": 5, "t": "EU EuroHPC, AI for Science 상시공모 3차 컷오프 8월 31일 마감", "k": "유럽 슈퍼컴을 과학 연구에 쓰겠다는 신청의 올해 세 번째 마감이 닫혔다.", "ez": "유럽연합의 슈퍼컴퓨터 공동사업이 운영하는 'AI for Science' 상시 공모의 올해 세 번째 마감이 8월 31일 닫혔다. 다음 마감은 10월 30일과 12월 11일이다. 과학 연구에 AI를 쓰려는 연구자가 유럽의 대형 슈퍼컴퓨터를 나눠 쓰도록 신청받는 창구다. 대상 기계는 핀란드 LUMI, 이탈리아 Leonardo, 스페인 MareNostrum5, 룩셈부르크 MeluXina 넷이다. 뽑히면 6개월간 자원을 쓸 수 있고 실제 접속까지는 최대 한 달이 걸린다. 신청 자격이 넓다는 점이 특징이다. 국가나 EU 과제를 받고 있는지와 관계없이 모든 과학 이용자와 공공부문이 낼 수 있다. 다만 기업은 EU 연구사업에 참여하고 있어야 한다.", "body": "2025년 5월 개시된 상시공모의 2026년 세 번째 컷오프가 오늘 룩셈부르크 시간 10시에 닫히고 공고문 원문상 다음 컷오프는 10월 30일과 12월 11일이며 배분 기간은 6개월·자원 접근까지 최대 1개월, 대상은 LUMI(핀란드 CSC)·Leonardo(이탈리아 CINECA)·MareNostrum5(스페인 BSC)·MeluXina이고 국가·EU 과제 지원 여부와 무관하게 모든 과학 이용자와 공공부문이 신청할 수 있으나 산업 이용자는 호라이즌 유럽 등 EU 과제 참여자로 한정됨", "src": "EuroHPC 원문 · 컷오프 8.31", "pd": "2026-08-31", "url": "https://www.eurohpc-ju.europa.eu/document/download/a3fd3cad-cf13-4c0c-9257-b5cf5c70f2c5_en"}, {"sec": 2, "t": "IBM·시카고대, 고전 컴퓨팅으로 재현 불가한 계산을 15분 만에 수행", "k": "일반 컴퓨터로는 따라 할 수 없는 계산을 양자컴퓨터가 15분에 끝냈다.", "ez": "IBM과 시카고대가 오늘날 가장 앞선 일반 컴퓨터로는 사실상 따라 할 수 없는 계산을 양자 컴퓨터로 약 15분 만에 끝낸 것으로 보도됐다. 양자컴퓨터의 계산 단위인 큐비트는 잡음에 약해 쉽게 틀린다. 그래서 여러 개를 묶어 오류를 바로잡는 '논리 큐비트'를 만드는데, 이번에는 그것을 70개 써서 계산을 수행했다. 다만 이것은 AI 성과가 아니라 양자컴퓨팅 성과다. 과학 연구에 AI를 쓰는 흐름과는 층위가 다른 이야기로, 계산 자원 자체가 어디까지 왔는지를 보여 주는 사례로 보는 것이 타당하다.", "body": "오류정정 논리큐비트 70개로 선도적 고전 기법이 실용적으로 재현할 수 없는 계산을 약 15분에 마친 것으로 보도됐고 다만 이는 AI가 아닌 양자컴퓨팅 성과여서 AI4S와 층위가 다름", "src": "ScienceDaily 보도 8.30", "pd": "2026-08-30", "url": "https://www.sciencedaily.com/news/computers_math/artificial_intelligence/"}, {"sec": 3, "t": "KAIST 팀, 신약설계 바이오 AI 모델 'K-Fold' 공개", "k": "국산 단백질 구조 예측 AI가 준비 단계를 없애 속도를 25배 높였다.", "ez": "KAIST 연구팀이 신약 설계에 쓰는 단백질 구조 예측 AI 모델 'K-Fold'를 공개했다. 과기정통부의 AI 특화 파운데이션 모델 개발 사업으로 만들어졌다. 기존 모델은 예측에 앞서 비슷한 단백질 서열을 대량으로 찾아보는 준비 단계를 거쳐야 했다. K-Fold는 그 단계를 없애 구조 예측 속도를 최대 25배 높였다. 3월 평가에서는 여러 분자가 맞물린 복합체의 구조를 맞히는 정확도가 알파폴드3에 가까웠다고 보도됐다. 다만 '일부 항목에서 해외 모델을 앞섰다'는 대목은 8월에 개발팀이 스스로 평가한 결과이며, 제3자가 같은 기준으로 확인한 것은 아니다.", "body": "과기정통부 AI 특화 파운데이션 모델 개발 사업으로 팀 KAIST가 만든 모델이며 유사 단백질 서열을 대량 검색하는 사전 계산 단계를 없애 구조 예측 속도를 최대 25배 높였고 3월 평가에서 분자복합체 구조 예측 정확도가 알파폴드3에 근접했다고 보도됨", "src": "헤럴드경제 보도 8.28", "pd": "2026-08-28", "url": "https://biz.heraldcorp.com/article/10854967"}, {"sec": 3, "t": "KAIST·써모피셔, 차세대 자율실험 연구허브 'SHARE Hub' 구축 합의", "k": "새 장비를 통째로 다시 설계하지 않고 끼워 넣을 수 있는 구조로 짓기로 했다.", "ez": "KAIST와 미국 장비기업 써모피셔가 8월 26일 자율실험 연구허브 'SHARE Hub'를 함께 짓기로 합의했다. 구상한 구조는 이렇다. 연구자가 무엇을 알아보고 싶은지 방향을 제시하면 AI가 실험을 설계하고 로봇이 수행하며, 나온 데이터가 다시 AI로 돌아가 다음 실험을 정한다. 설계에서 눈에 띄는 대목은 장비를 붙였다 뗐다 할 수 있게 만든 점이다. 새 AI나 로봇, 측정 장비를 들일 때 전체를 다시 설계하지 않고 끼워 넣을 수 있도록 했다. 앞으로 국내외 기업과 대학, 연구기관, 병원으로 참여를 넓힐 계획이나 규모와 기간, 예산 분담은 아직 밝혀지지 않았다.", "body": "8월 26일 양해각서를 맺고 연구자가 과학적 방향을 제시하면 AI가 실험을 설계하고 로봇이 수행한 뒤 그 데이터가 다시 AI로 돌아가 다음 실험을 정하는 구조로 짓기로 했으며 새 AI·로봇·장비를 통째로 다시 설계하지 않고 붙일 수 있게 디지털·물리 '플러그 앤 플레이' 모듈 구조를 채택했고 국내외 기업·대학·연구기관·병원으로 참여를 넓힐 계획이나 규모·기간·예산 분담은 미제시", "src": "KAIST 발표 8.27", "pd": "2026-08-27", "url": "https://news.kaist.ac.kr/newsen/html/news/?mode=V&mng_no=66310"}, {"sec": 2, "t": "KISTI, 연구자용 클라우드 전용망 NDeX 서비스 개시", "k": "연구자가 민감한 데이터를 일반 인터넷 없이 주고받는 전용 통로가 열렸다.", "ez": "한국과학기술정보연구원(KISTI)이 연구자 전용 클라우드 연결망 'NDeX' 서비스를 시작했다. 국가 연구망을 쓰는 197개 기관의 연구자가 대상이다. 연구 데이터에는 남에게 새어 나가면 곤란한 것이 많은데, 일반 인터넷을 거치면 그 위험이 따라붙는다. NDeX는 수도권 평촌, 중부권 대전, 부산권 송정 세 거점을 초당 600기가비트로 잇고 일반 인터넷과 논리적으로 갈라 두어 민감한 데이터를 옮길 수 있게 한 전용 통로다. 아마존웹서비스와 엘리스가 초기 클라우드 협력사로 참여한다. 기관이 서버를 직접 갖추지 않아도 되지만, 연구자가 어떻게 신청하고 요금은 얼마이며 분야별로 어떻게 나누는지는 아직 알려지지 않았다.", "body": "KREONET을 쓰는 197개 기관 연구자가 대상이며 수도권 평촌·중부권 대전·부산권 송정 3개 허브를 600Gbps로 잇고 인터넷과 논리적으로 분리해 민감 연구데이터 전송에 쓸 수 있게 한 전용망으로 AWS·엘리스가 초기 클라우드 파트너로 참여한 것으로 보도됨, 기관이 자체 인프라를 짓지 않아도 되지만 연구자 신청 절차·요금·분야별 배분 규칙은 확인되지 않아 6호기 배분 규칙 부재(O03)와 같은 공백이 네트워크 쪽에도 있음", "src": "이뉴스투데이 보도 8.28", "pd": "2026-08-27", "url": "http://www.enewstoday.co.kr/news/articleView.html?idxno=2464264"}, {"sec": 6, "t": "AI가 18개월 묵은 유체역학 문제를 5주에 해결, 다만 자기일관적 오류 발생", "k": "AI가 1년 반 걸린 문제를 5주에 풀었지만 없는 오류를 지어내기도 했다.", "ez": "미국 콜로라도대 볼더 연구팀이 1년 반 동안 풀지 못한 유체역학 문제를 AI의 도움으로 5주 만에 풀었다. 다만 그 과정에서 AI의 한계도 함께 드러난 것으로 보도됐다. 문제는 전기를 걸었을 때 나노입자의 모양이 이동 속도를 어떻게 바꾸는가였다. AI는 답에 이르는 길을 찾아 줬지만, 앞뒤가 맞아 보이는데 실제로는 틀린 미묘한 수학 오류를 냈다. 연구자가 어디가 틀렸는지 목록을 만들어 달라고 하자 이번에는 있지도 않은 오류 세 개를 지어냈다. 연구자는 AI가 낸 결과를 자기 팀의 결과보다 훨씬 덜 믿게 됐고 그만큼 검증 부담이 커졌다고 밝힌 것으로 보도됐다.", "body": "콜로라도대 볼더 연구팀이 전기영동에서 나노입자 형상이 이동속도에 미치는 영향을 5주에 규명했으나 AI가 자기일관적으로 보이는 미묘한 수학 오류를 냈고 오류 목록을 써 달라고 하자 실제로 없던 오류 3개를 지어낸 것으로 보도됨", "src": "phys.org 보도 8.27", "pd": "2026-08-27", "url": "https://phys.org/news/2026-08-fast-error-prone-ai-decades.html"}]}, {"date": "2026-08-30", "items": [{"sec": 1, "t": "美 백악관, 제네시스 미션에 50억 달러 이상 투입 발표", "k": "미국이 과학 연구 전 과정에 AI를 넣는 국가 사업에 7조 원 넘게 건다.", "ez": "미국 백악관이 '제네시스 미션'에 50억 달러(약 7조 원) 넘게 넣겠다고 발표했다. AI를 과학 연구의 전 과정에 적용하는 국가 사업이다. 여기서 말하는 전 과정이란 가설을 세우고 실험을 설계하고 결과를 해석하는 일 전부를 뜻한다. 특정 분야 하나를 고르지 않고 연구하는 방식 자체를 바꾸겠다는 구상이다. 총괄은 에너지부 과학차관실이 맡고 국립연구소와 대학, 기업이 함께 참여하는 구조다.", "body": "AI를 과학연구 전 과정에 적용하는 국가 미션으로, DOE 과학차관실이 총괄하고 국립연구소·대학·기업이 참여하는 구조", "src": "백악관 발표 7.22", "pd": "2026-07-22", "url": "https://www.whitehouse.gov/"}, {"sec": 1, "t": "EU 집행위, Horizon Europe 2026–27 'AI in Science' 파일럿에 1억 유로 배정", "k": "유럽이 과학 연구용 AI 전략에 약 1,500억 원의 첫 실행 예산을 붙였다.", "ez": "유럽연합 집행위원회가 2026~2027년 연구 지원 사업에 'AI in Science' 시범 과제를 두고 1억 유로(약 1,500억 원)를 배정했다. 유럽은 과학 연구에 AI를 쓰는 일을 개별 연구자에게 맡기지 않고 하나의 전략으로 묶어 왔는데, 이번 예산이 그 전략을 실제로 집행하는 첫 돈이다. 함께 추진되는 'RAISE' 구상은 여러 나라의 연구 자원을 하나의 가상 연구소처럼 잇는다는 계획이다.", "body": "AI in Science 전략과 RAISE 구상의 첫 실행 예산으로", "src": "EC 발표 보도", "pd": "2026-07-15", "url": "https://research-and-innovation.ec.europa.eu/"}, {"sec": 2, "t": "日 RIKEN, AI for Science 전용 슈퍼컴퓨터 명칭을 'RIKYU'로 확정", "k": "일본이 과학 연구용 AI 전용 슈퍼컴퓨터를 후가쿠와 따로 두기로 했다.", "ez": "일본 이화학연구소(RIKEN)가 과학 연구용 AI 전용 슈퍼컴퓨터의 이름을 'RIKYU'로 정했다. 일본에는 이미 '후가쿠'라는 대형 슈퍼컴퓨터가 있다. RIKYU는 그것을 대신하는 것이 아니라 AI 연구만을 위해 따로 운용하는 기계다. 과학 계산과 AI 계산은 필요한 부품과 쓰는 방식이 달라 한 기계로 겸하기 어렵기 때문이다. 미국 아르곤국립연구소, 후지쯔, 엔비디아와의 협력 체계와 이어져 있다.", "body": "후가쿠와 별도로 AI 연구 전용으로 운용되며 아르곤국립연구소·후지쯔·엔비디아와의 협력 체계와 연결", "src": "RIKEN 발표 6.19", "pd": "2026-06-19", "url": "https://www.riken.jp/"}, {"sec": 2, "t": "英 UKRI, AIRR 컴퓨팅 자원의 AI for Science 배분 트랙 공모", "k": "영국이 국가 AI 계산 자원 가운데 과학 연구 몫을 따로 떼어 공모했다.", "ez": "영국 연구혁신기구(UKRI)가 국가 AI 연구 자원(AIRR)을 과학 연구에 나눠 주는 별도 창구를 열고 신청을 받았다. AI 연구용으로 마련한 국가 계산 자원은 보통 AI 기술 자체를 개발하는 데 쓰인다. 영국은 그와 별도로 '과학 연구에 AI를 쓰는 경우'를 위한 몫을 따로 떼어 신청받는 길을 만들었다. 누구에게 얼마를 어떤 기준으로 나눌지를 미리 정해 두었다는 점에서, 국가 계산 자원의 배분 규칙을 설계할 때 참고할 사례다.", "body": "국가 AI 연구 자원을 과학연구에 배분하는 별도 트랙으로, 6호기 배분 규칙 설계의 직접 참고자료", "src": "UKRI 공고", "pd": "2026-08-14", "url": "https://www.ukri.org/"}, {"sec": 3, "t": "美 DOE, 제네시스 미션 오픈모델 이니셔티브 출범", "k": "미국이 과학용 AI 모델을 가중치까지 열어 모으는 창구를 만들었다.", "ez": "미국 에너지부가 '제네시스 미션'의 한 갈래로 오픈모델 이니셔티브를 시작했다. 과학 분야 AI 모델을 누구나 내려받아 쓸 수 있게 공개하고 모으는 창구이며 아르곤국립연구소가 운영한다. 여기서 말하는 공개는 모델을 쓰게 해 주는 정도가 아니라 학습된 내용물, 곧 가중치까지 내주는 것을 뜻한다. 그래야 다른 연구자가 모델을 뜯어보고 자기 분야에 맞게 고쳐 쓸 수 있기 때문이다.", "body": "과학 분야 모델을 오픈웨이트로 공개·수집하는 창구를 아르곤연구소가 운영하는 것으로 보도됨", "src": "AIwire 보도 8.12", "pd": "2026-08-12", "url": "https://www.hpcwire.com/aiwire/2026/08/12/doe-launches-open-model-initiative-for-genesis-mission/"}]}];

</script>
<script>
(function (A) {
  var cfg = A.config || {};

  /* 공유용에는 '확인된 결과'만 싣는다. 부재 확인(…없음·미개설)과 미확인 수치를 담은
     항목은 적재 때 pub:false 로 표시되며 여기서 걸러진다. 그 기록이 사라지는 것은
     아니다 — 내부 화면과 카톡 발송본이 계속 진다. */
  var eds = (A.editions || []).map(function (e) {
    var o = {}; for (var k in e) { o[k] = e[k]; }
    o.items = (e.items || []).filter(function (x) { return x.pub !== false; });
    return o;
  }).filter(function (e) { return e.items.length; });

  /* 공유용은 두 탭뿐이다 — 오늘 호와 아카이브. 링크 이동 없이 한 파일에서 전환한다. */
  var TABS = [
    { id: 'now',  n: '01', label: '뉴스레터' },
    { id: 'arch', n: '02', label: '아카이브' }
  ];
  var curTab = 'now';

  /* bundle.py 가 배포본을 구울 때 이 자리에 발행일을 박는다. 주소창에 ?d= 를 붙일 수
     없는 파일 한 장짜리 판을 위한 것이다 — 비어 있으면 가장 최근 호가 선다. */
  var PIN = '2026-09-11';

  /* 상세면이 찾아 쓸 표. 「호 날짜 + 항목 번호」로 항목을 곧장 집는다.
     items 배열의 색인으로 서므로 적재된 뒤에는 주소가 바뀌지 않는다. */
  var BYKEY = {};
  eds.forEach(function (e) {
    (e.items || []).forEach(function (x, i) {
      BYKEY[A.itemKey(e.date, i)] = { x: x, date: e.date };
    });
  });

  /* 항목·섹션·요약 렌더는 assets/site.js 의 A.factHTML · A.sectionsHTML ·
     A.digestOf 가 진다. 관리용 후보풀 화면의 당일 미리보기가 같은 함수를 불러
     그리므로, 담당자가 체크하며 본 화면과 이 지면이 어긋나지 않는다.
     (이 파일에는 관리용 경로를 문자열로도 적지 않는다 — check.py 가 잡는다) */

  A.page({
    title: 'AI for Science Daily',
    /* 셋째 줄에서 수신처를 뺐다 (2026-09-03 지시). 이 면은 밖으로 나가는 지면이라
       받는 부서 이름을 박지 않는다 — 발행 주기만 남긴다. */
    sub: (cfg.publishAt || '평일 08:30'),
    nav: [], here: '',
    footNote: '확인된 사실과 원문만 싣습니다'
  }, function (root) {
    if (!eds.length) {
      root.innerHTML = '<div class="note warn"><span class="lbl">발행분 없음</span>'
        + 'data/editions.js 가 비어 있습니다.</div>';
      return;
    }

    var h = '<nav class="tabs">' + TABS.map(function (t, i) {
      return '<button type="button" data-tab="' + t.id + '"'
        + (i === 0 ? ' aria-current="page"' : '')
        + '><span class="n">' + t.n + '</span>' + t.label + '</button>';
    }).join('') + '</nav>';

    h += '<div class="pane" id="p-now"></div>';
    h += '<div class="pane" id="p-arch" hidden></div>';
    /* 기사 상세. 목록과 같은 파일 안에서 갈아 끼운다 — 배포본이 파일 한 장이라
       따로 만든 면으로 보내면 더블클릭으로 받은 사람에게는 링크가 깨진다. */
    h += '<div class="pane" id="p-detail" hidden></div>';
    root.innerHTML = h;

    A.$$('nav.tabs button', root).forEach(function (b) {
      b.addEventListener('click', function () {
        A.$$('nav.tabs button', root).forEach(function (o) { o.removeAttribute('aria-current'); });
        b.setAttribute('aria-current', 'page');
        curTab = b.dataset.tab;
        A.$('#p-now').hidden = curTab !== 'now';
        A.$('#p-arch').hidden = curTab !== 'arch';
      });
    });

    renderNow(A.$('#p-now'));
    renderArch(A.$('#p-arch'));

    A.installDetail({
      mount: A.$('#p-detail'),
      panes: [{ el: A.$('#p-now'),  on: function () { return curTab === 'now'; } },
              { el: A.$('#p-arch'), on: function () { return curTab === 'arch'; } }],
      chrome: [A.$('nav.tabs', root)],
      lookup: function (k) { return BYKEY[k] || null; }
    });
  });

  /* ── 탭 1. 뉴스레터 — 오늘 호를 섹션별로.
     호 이동은 주소 질의문(?d=)이 아니라 화면 안 상태로 한다. 파일 하나로 배포했을 때
     file:// + 질의문이 뷰어에 따라 안 열리는 일이 있어서다. */
  var pick = null;
  function renderNow(root) {
    var d = pick || A.qs('d') || PIN;
    var i = d ? Math.max(0, eds.map(function (e) { return e.date; }).indexOf(d)) : 0;
    var ed = eds[i], prev = eds[i + 1], next = eds[i - 1];

    var h = '<div class="toolbar">'
      + '<span class="count"><b>' + A.fmtDate(ed.date) + '</b> 조간</span>'
      + (next ? '<button class="act ghost" type="button" data-go="' + A.esc(next.date) + '">← 다음 호</button>' : '')
      + (prev ? '<button class="act ghost" type="button" data-go="' + A.esc(prev.date) + '">이전 호 →</button>' : '')
      + (ed.text ? '<button class="act" id="copyBtn" type="button">전문 복사</button>' : '')
      + '<span class="src" id="copyMsg"></span></div>';

    /* 머리에는 날짜와 호 이동만 둔다 — 항목 건수도, 그날 요약도 두지 않는다
       (2026-09-03 재지시). 한 줄로 함축하려면 그날의 축을 우리가 정해야 하고,
       그것이 곧 해석이다. 지면은 사실만 세우고 판단은 내부 화면이 진다. */

    /* 제목을 누르면 상세가 선다 (2026-09-09 지시) — AI 상세요약과 하단 원문 링크.
       keyOf 를 주지 않으면 제목이 눌리지 않는다. 상세면을 설치한 화면에서만 준다. */
    h += A.sectionsHTML(ed.items, '', {
      keyOf: function (x, i) { return A.itemKey(ed.date, i); }
    });   // 없는 섹션은 내보내지 않는다

    /* picked.world 집계와 수집 창은 우리 작업 기록이다. 공유용에는 싣지 않는다.
       둘 다 내부 후보풀 화면이 패널로 계속 보여 준다.
       (이 파일에는 내부 경로를 문자열로도 적지 않는다 — check.py 가 잡는다) */

    /* 카톡 전문은 사내 원본에서만 보인다. 배포본(bundle.py)은 이 텍스트를
       아예 담지 않으므로 칸도 만들지 않는다. */
    if (ed.text) {
      h += '<details class="raw"><summary>발송 전문 보기</summary>'
        + '<pre id="rawText">' + A.esc(ed.text) + '</pre></details>';
    }

    root.innerHTML = h;
    A.$$('button[data-go]', root).forEach(function (g) {
      g.addEventListener('click', function () { pick = g.dataset.go; renderNow(root); });
    });
    var b = document.getElementById('copyBtn');
    if (b) b.addEventListener('click', function () {
      A.copy(document.getElementById('rawText'), document.getElementById('copyMsg'));
    });
  }

  /* ── 탭 2. 아카이브 — 전체 항목을 검색 */
  function renderArch(root) {
    var items = [];
    eds.forEach(function (e) {
      (e.items || []).forEach(function (x, i) {
        items.push({ date: e.date, sec: x.sec, t: x.t, k: x.k || '', body: x.body || '',
                     src: x.src || '', pd: x.pd || '', url: x.url || '',
                     durl: x.durl || '', murl: x.murl || '',
                     key: A.itemKey(e.date, i) });
      });
    });

    var h = '<div class="filters">'
      + '<input type="search" id="q" placeholder="검색어" size="22">'
      + '<select id="sec"><option value="0">전체 섹션</option>'
      + A.SECTIONS.map(function (s, i) {
          return '<option value="' + (i + 1) + '">' + A.esc(s) + '</option>';
        }).join('') + '</select>'
      + '<input type="text" id="from" placeholder="부터 YYYY-MM-DD" size="14">'
      + '<input type="text" id="to" placeholder="까지 YYYY-MM-DD" size="14">'
      + '</div>'
      + '<p class="dek">발행 ' + eds.length + '호 · 항목 <b id="cnt">' + items.length + '</b>건</p>'
      + '<div id="list"></div>';
    root.innerHTML = h;

    ['q', 'sec', 'from', 'to'].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener(id === 'sec' ? 'change' : 'input', draw);
    });
    draw();

    function draw() {
      var q = document.getElementById('q').value.trim();
      var sec = +document.getElementById('sec').value;
      var f = document.getElementById('from').value.trim();
      var t2 = document.getElementById('to').value.trim();
      var lq = q.toLowerCase();
      var out = items.filter(function (x) {
        if (sec && x.sec !== sec) return false;
        if (f && x.date < f) return false;
        if (t2 && x.date > t2) return false;
        if (lq && (x.t + ' ' + x.k + ' ' + x.body + ' ' + x.src).toLowerCase().indexOf(lq) < 0) return false;
        return true;
      });
      out.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : a.sec - b.sec; });
      document.getElementById('cnt').textContent = out.length;

      if (!out.length) {
        document.getElementById('list').innerHTML =
          '<div class="note"><span class="lbl">결과 없음</span>검색어를 줄이거나 기간을 넓혀 보세요.</div>';
        return;
      }
      var cur = -1, h2 = '';
      out.forEach(function (x) {
        if (x.sec !== cur) {
          if (cur !== -1) h2 += '</div>';
          cur = x.sec;
          h2 += '<div class="secblk" data-sec="' + x.sec + '"><h3>'
            + A.esc(A.SECTIONS[x.sec - 1] || '') + '</h3>';
        }
        h2 += A.factHTML(x, q, { key: x.key });
      });
      document.getElementById('list').innerHTML = h2 + '</div>';
    }
  }
})(window.AI4S);
</script>
</body>
</html>
